<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>จกปูน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;700&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --slab:#2a2c2e; --slab2:#383b3e; --dust:#d6d9db; --mute:#8d9296;
  --orange:#f98233; --orange-d:#d65c0c; --red:#e5484d; --green:#5bd17a;
  --head:'Prompt','Sarabun',sans-serif; --body:'Sarabun','Prompt',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;background:transparent;overflow:hidden;font-family:var(--body);color:var(--dust)}
#app{position:fixed;inset:0;display:none;align-items:center;justify-content:center}
#app.on{display:flex}
.card{
  width:min(92vw,720px);background:var(--slab);border:2px solid #000;border-radius:6px;
  box-shadow:0 0 0 3px var(--orange-d),0 18px 40px rgba(0,0,0,.55);overflow:hidden;
}
.tape{height:14px;background:repeating-linear-gradient(-45deg,var(--orange) 0 14px,#16171a 14px 28px)}
.body{display:flex;gap:min(3vmin,22px);padding:min(3.2vmin,22px);align-items:stretch}
.info{flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:12px}
h1{font:700 clamp(22px,5.4vmin,34px)/1.1 var(--head);color:#fff}
#hint{margin-top:6px;font-size:clamp(13px,3vmin,16px);color:var(--mute);line-height:1.4}
.dots{display:flex;gap:7px;margin:4px 0}
.dots i{flex:1;height:10px;background:var(--slab2);border-radius:2px;transition:background .15s}
.dots i.done{background:var(--green)}
.dots i.cur{background:var(--orange)}
.clock{height:16px;background:#16171a;border-radius:3px;overflow:hidden}
.clock b{display:block;height:100%;width:100%;background:repeating-linear-gradient(-45deg,var(--orange) 0 10px,var(--orange-d) 10px 20px);transform-origin:left}
.pad{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:min(2vmin,14px);width:min(46vmin,300px)}
.pad button{
  aspect-ratio:1;border:0;border-radius:6px;background:var(--slab2);color:#6a6f73;
  font:700 clamp(28px,8vmin,52px)/1 var(--head);box-shadow:inset 0 -5px 0 rgba(0,0,0,.35);
  transition:transform .06s,background .08s,color .08s;
}
.pad button.lit{background:var(--orange);color:#1b1306;box-shadow:inset 0 -5px 0 var(--orange-d),0 0 22px rgba(249,130,51,.7)}
.pad button.good{background:var(--green);color:#0b2314;box-shadow:inset 0 -5px 0 #2f9b50}
.pad button.bad{background:var(--red);color:#fff;box-shadow:inset 0 -5px 0 #a02226}
.pad button:active{transform:translateY(3px)}
.pad.off{pointer-events:none}
.stage{display:none}
.stage.on{display:block}
.msg{font:700 clamp(20px,5vmin,30px)/1.2 var(--head);margin-bottom:8px}
.msg.bad{color:var(--red)} .msg.ok{color:var(--green)}
.sub{font-size:clamp(13px,3vmin,16px);color:var(--mute);line-height:1.5;margin-bottom:14px}
.row{display:flex;gap:10px}
.btn{flex:1;padding:12px 10px;border:0;border-radius:5px;font:600 clamp(15px,3.4vmin,19px) var(--body);cursor:pointer}
.btn.go{background:var(--orange);color:#1b1306}
.btn.no{background:var(--slab2);color:var(--dust)}
.big{font:700 clamp(40px,12vmin,76px)/1 var(--head);color:#fff;letter-spacing:1px;margin:6px 0 10px}
.bar{height:20px;background:#16171a;border-radius:3px;overflow:hidden}
.bar b{display:block;height:100%;width:0;background:repeating-linear-gradient(-45deg,var(--orange) 0 10px,var(--orange-d) 10px 20px);transition:width 1s linear}
.x{position:absolute;top:calc(50% - 0px);display:none}
.close{margin-top:10px;background:none;border:0;color:var(--mute);font:400 14px var(--body);text-decoration:underline;padding:6px 0}
.layout-load .pad{display:none}
.layout-load .body{display:block}
@media (max-aspect-ratio:1/1){.body{flex-direction:column}.pad{width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div class="card" id="card">
    <div class="tape"></div>
    <div class="body">
      <div class="info">
        <div>
          <h1>จกปูน</h1>
          <p id="hint">กดปุ่มที่สว่างให้ทัน</p>
        </div>

        <div class="stage on" id="sGame">
          <div class="dots" id="dots"></div>
          <div class="clock"><b id="clock"></b></div>
          <button class="close" id="bCancelGame">ยกเลิก</button>
        </div>

        <div class="stage" id="sFail">
          <p class="msg bad" id="failMsg">พลาด!</p>
          <p class="sub">ตำรวจได้รับแจ้งเหตุแล้ว ต้องเริ่มจกใหม่ตั้งแต่รอบแรก</p>
          <div class="row">
            <button class="btn go" id="bRetry">เริ่มใหม่</button>
            <button class="btn no" id="bCancelFail">เลิกจก</button>
          </div>
        </div>

        <div class="stage" id="sLoad">
          <p class="msg ok">จกสำเร็จ</p>
          <p class="sub">ตำรวจได้รับแจ้งเหตุแล้ว ยืนอยู่ที่กองปูนจนกว่าจะเสร็จ ถ้าเดินหนีจะเสียปูนถุงนี้</p>
          <div class="big" id="left">01:30</div>
          <div class="bar"><b id="bar"></b></div>
        </div>
      </div>

      <div class="pad off" id="pad">
        <button data-s="0">▲</button>
        <button data-s="1">●</button>
        <button data-s="2">■</button>
        <button data-s="3">◆</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  var $ = function(id){return document.getElementById(id)};
  var app=$('app'), card=$('card'), pad=$('pad'), hint=$('hint'), clock=$('clock'), dots=$('dots');
  var btns=[].slice.call(pad.querySelectorAll('button'));
  var stages={game:$('sGame'),fail:$('sFail'),load:$('sLoad')};
  var raf=0, loadTimer=0, roundOpen=false, roundStart=0, roundLimit=0, total=6;

  // ---- ตัวเชื่อมกับ CEF (cef.on / cef.emit) ----
  var cef = window.cef;
  function emit(name){
    var a=[].slice.call(arguments,1).map(String);
    try{ cef.emit.apply(cef,[name].concat(a)); }catch(e){}
  }
  function on(name,fn){
    cef.on(name,function(){
      var a=[].slice.call(arguments);
      if(a.length===1 && Array.isArray(a[0])) a=a[0];
      fn.apply(null,a);
    });
  }

  function stage(n){
    for(var k in stages) stages[k].classList.toggle('on',k===n);
    card.classList.toggle('layout-load',n==='load');
    pad.classList.toggle('off',n!=='game');
  }
  function clearPad(){ btns.forEach(function(b){b.className=''}); }
  function stopClock(){ cancelAnimationFrame(raf); roundOpen=false; }
  function setDots(done){
    dots.innerHTML='';
    for(var i=0;i<total;i++){
      var d=document.createElement('i');
      if(i<done) d.className='done'; else if(i===done) d.className='cur';
      dots.appendChild(d);
    }
  }
  function mmss(s){ s=Math.max(0,s|0); return ('0'+((s/60)|0)).slice(-2)+':'+('0'+(s%60)).slice(-2); }

  function tick(){
    if(!roundOpen) return;
    var left=1-(performance.now()-roundStart)/roundLimit;
    if(left<=0){
      clock.style.transform='scaleX(0)';
      roundOpen=false; pad.classList.add('off'); clearPad();
      emit('poon:miss');            // หมดเวลา รอเซิร์ฟเวอร์ตอบ poon:fail
      return;
    }
    clock.style.transform='scaleX('+left+')';
    raf=requestAnimationFrame(tick);
  }

  // ---- event จากเซิร์ฟเวอร์ ----
  function init(){
    on('poon:start',function(){
      stopClock(); clearInterval(loadTimer);
      app.classList.add('on'); stage('game'); clearPad(); setDots(0);
      clock.style.transform='scaleX(1)'; hint.textContent='เตรียมตัว...';
    });
    on('poon:round',function(n,t,slot,limit){
      total=+t; n=+n; slot=+slot; roundLimit=+limit;
      stopClock(); clearPad(); setDots(n-1);
      btns[slot].classList.add('lit');
      hint.textContent='กดปุ่มที่สว่าง ('+n+'/'+total+')';
      pad.classList.remove('off');
      roundStart=performance.now(); roundOpen=true; raf=requestAnimationFrame(tick);
    });
    on('poon:ok',function(){ /* แสดงผลตอนกดไปแล้ว รอรอบถัดไป */ });
    on('poon:fail',function(reason){
      stopClock(); clearPad(); stage('fail');
      $('failMsg').textContent = (+reason===1) ? 'กดผิดปุ่ม!' : 'ช้าเกินไป!';
      hint.textContent='';
    });
    on('poon:load',function(sec){
      stopClock(); clearPad(); stage('load'); hint.textContent='';
      sec=+sec; var end=Date.now()+sec*1000, bar=$('bar');
      bar.style.transition='none'; bar.style.width='0'; void bar.offsetWidth; bar.style.transition='';
      clearInterval(loadTimer);
      function upd(){
        var r=Math.max(0,Math.ceil((end-Date.now())/1000));
        $('left').textContent=mmss(r);
        bar.style.width=(100*(1-r/sec))+'%';
        if(r<=0) clearInterval(loadTimer);
      }
      upd(); loadTimer=setInterval(upd,250);
    });
    on('poon:close',function(){
      stopClock(); clearInterval(loadTimer); app.classList.remove('on'); clearPad();
    });
  }

  // ---- ปุ่มกด ----
  btns.forEach(function(b){
    b.addEventListener('pointerdown',function(e){
      e.preventDefault();
      if(!roundOpen) return;
      stopClock(); pad.classList.add('off');
      var s=+b.dataset.s, isLit=b.classList.contains('lit');
      clearPad(); b.classList.add(isLit?'good':'bad');
      emit('poon:tap',s);
    });
  });
  $('bRetry').onclick=function(){ emit('poon:retry'); };
  $('bCancelFail').onclick=function(){ emit('poon:cancel'); };
  $('bCancelGame').onclick=function(){ emit('poon:cancel'); };

  // ---- โหมดทดสอบในเบราว์เซอร์: เปิดไฟล์นี้ด้วย ?demo ----
  if(!cef && /demo/.test(location.search)){
    var H={}, st={n:0,slot:0,t0:0,lim:0,wait:0};
    cef={ on:function(n,f){H[n]=f}, emit:function(n,a){ fake(n,a) } };
    var send=function(n){ var a=[].slice.call(arguments,1); setTimeout(function(){H[n]&&H[n].apply(null,a)},40); };
    var round=function(){ st.n++; st.slot=(Math.random()*4)|0; st.lim=1700-(st.n-1)*150; st.t0=Date.now(); send('poon:round',st.n,6,st.slot,st.lim); };
    var fake=function(n,a){
      if(n==='poon:tap'){
        if(Date.now()-st.t0<100||+a!==st.slot) return send('poon:fail',1);
        if(st.n>=6) return send('poon:load',90);
        setTimeout(round,350);
      } else if(n==='poon:miss') send('poon:fail',2);
      else if(n==='poon:retry'){ st.n=0; send('poon:start'); setTimeout(round,900); }
      else if(n==='poon:cancel') send('poon:close');
    };
    init(); send('poon:start'); setTimeout(round,900);
  } else if(cef){ init(); }
})();
</script>
</body>
</html>
