<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Car Remote</title>
<style>
:root{--red:#1e6bff;--red2:#0b3d9e;--bg:#17181a;--bg2:#222326;--bd:#3d3e44;--tx:#ececee;--mu:#6f7178}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:transparent;font-family:Kanit,Tahoma,sans-serif;color:var(--tx);overflow:hidden;user-select:none}
#app{display:none;position:fixed;inset:0;align-items:center;justify-content:flex-end;padding-right:2vw}
#app.on{display:flex}
.wrap{position:relative;width:300px;height:190px;transform-origin:right center;transform:scale(var(--k,1))}
#app.on .wrap{animation:rIn .22s cubic-bezier(.2,.9,.3,1.1) both}
#app.out .wrap{animation:rOut .16s ease-in both}
@keyframes rIn{from{opacity:0;transform:translateY(16px) scale(calc(var(--k,1)*.94))}to{opacity:1;transform:scale(var(--k,1))}}
@keyframes rOut{to{opacity:0;transform:translateY(10px) scale(calc(var(--k,1)*.97))}}
@media(prefers-reduced-motion:reduce){#app .wrap{animation:none!important}}
.logo{position:absolute;left:50%;top:0;transform:translateX(-50%);width:128px;height:auto;z-index:2;filter:drop-shadow(0 3px 6px #000b);pointer-events:none}
.hex{position:absolute;left:0;right:0;bottom:0;height:108px;
 background:linear-gradient(90deg,var(--red),var(--red2));
 clip-path:polygon(34px 0,calc(100% - 34px) 0,100% 50%,calc(100% - 34px) 100%,34px 100%,0 50%);
 filter:drop-shadow(0 8px 18px #000c)}
.hex i{position:absolute;inset:2px;background:linear-gradient(180deg,#26272b,#141517);
 clip-path:polygon(33px 0,calc(100% - 33px) 0,100% 50%,calc(100% - 33px) 100%,33px 100%,0 50%)}
.btns{position:absolute;left:0;right:0;bottom:0;height:108px;display:flex;align-items:center;justify-content:center;gap:12px}
.b{width:74px;height:74px;border-radius:12px;border:1px solid var(--bd);background:var(--bg2);color:var(--mu);display:grid;place-items:center;cursor:pointer;position:relative;transition:transform .12s,background .15s,border-color .15s,color .15s,box-shadow .15s}
.b svg{width:38px;height:38px}
.b:hover{border-color:var(--red2);transform:translateY(-2px)}
.b:active{transform:scale(.94)}
.b.on{color:var(--red);border-color:var(--red);background:#122244;box-shadow:0 0 16px #1e6bff66,inset 0 0 12px #1e6bff33}
.b[disabled]{opacity:.55;pointer-events:none}
.b .t{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:9px;letter-spacing:.2px;color:currentColor;opacity:.85}
</style></head><body>

<script>
const $=id=>document.getElementById(id);
const LOCKED='<rect x="6" y="14" width="20" height="14" rx="3"/><path d="M10 14V10a6 6 0 0 1 12 0v4"/><circle cx="16" cy="21" r="1.600" fill="currentColor"/>';
const OPEN='<rect x="6" y="14" width="20" height="14" rx="3"/><path d="M10 14V10a6 6 0 0 1 11.500-2.400"/><circle cx="16" cy="21" r="1.600" fill="currentColor"/>';
let K=1,ct,guard,st={e:0,l:0};
function fit(){const w=document.querySelector(".wrap");K=Math.max(.38,Math.min(.55,innerHeight/1300,innerWidth/800));w.style.setProperty("--k",K)}
const send=(e,v)=>{try{cef.emit(e,v)}catch(_){console.log(e,v);if(location.hash=="#preview")fake(e)}};
function paint(e,l){
 st={e:+e?1:0,l:+l?1:0};
 $("eng").classList.toggle("on",!!st.e);$("engT").textContent=st.e?"ติดเครื่อง":"ดับ";
 $("lk").classList.toggle("on",!!st.l);$("lkT").textContent=st.l?"ล็อกอยู่":"ปลดล็อก";
 $("lkI").innerHTML=st.l?LOCKED:OPEN;
 busy(false);
}
function busy(v){clearTimeout(guard);$("eng").disabled=$("lk").disabled=v;if(v)guard=setTimeout(()=>busy(false),1500)}
const openUI=()=>{clearTimeout(ct);$("app").classList.remove("out");$("app").classList.add("on");fit()};
const closeUI=()=>{if(!$("app").classList.contains("on"))return;$("app").classList.add("out");ct=setTimeout(()=>$("app").classList.remove("on","out"),170)};
$("eng").onclick=()=>{busy(true);send("remote:engine","")};
$("lk").onclick=()=>{busy(true);send("remote:lock","")};
addEventListener("keydown",e=>{if(e.key=="Escape"||e.key=="n"||e.key=="N")send("remote:close","")});
const A=(a,b)=>{if(typeof a=="string"&&a[0]=="[")try{a=JSON.parse(a)}catch(_){}return Array.isArray(a)?a:[a,b]};
let bound=false;
function bind(){
 if(bound)return true;
 if(!window.cef||!cef.on)return false;
 cef.on("remote:open",(a,b)=>{const x=A(a,b);paint(x[0],x[1]);openUI()});
 cef.on("remote:state",(a,b)=>{const x=A(a,b);paint(x[0],x[1])});
 cef.on("remote:close",closeUI);
 return bound=true;
}
if(!bind()){const iv=setInterval(()=>{if(bind())clearInterval(iv)},100);addEventListener("load",bind)}
addEventListener("resize",fit);
paint(0,1);
// โหมดตัวอย่างนอกเกม: เปิดไฟล์ด้วย #preview
function fake(e){
 if(e=="remote:close"){closeUI();setTimeout(openUI,900)}
 if(e=="remote:engine")setTimeout(()=>paint(!st.e,st.l),250);
 if(e=="remote:lock")setTimeout(()=>paint(st.e,!st.l),250);
}
if(location.hash=="#preview"){document.body.style.background="#3a3326";paint(1,0);openUI()}
</script></body></html>
