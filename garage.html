<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garage</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#060304; --panel:#0d0708; --panel2:#140b0d;
  --red:#e11d2e; --red-hi:#ff4655; --ember:#7d0d19;
  --line:rgba(255,255,255,.08); --mute:rgba(255,255,255,.55); --soft:rgba(255,255,255,.82);
}
*{box-sizing:border-box;margin:0;padding:0;user-select:none}
html,body{height:100%;background:transparent;overflow:hidden;font-family:'Prompt','Sarabun','Segoe UI',sans-serif;color:#fff}
button{font-family:inherit}

#root{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 55%,rgba(60,6,12,.55),rgba(0,0,0,.78) 70%)}
#root.on{display:flex}

.shell{
  position:relative;width:min(92vw,1120px);height:min(80vh,640px);
  display:grid;grid-template-columns:clamp(190px,23%,250px) 1fr clamp(190px,23%,250px);
  grid-template-rows:auto 1fr auto;gap:0;
  background:linear-gradient(180deg,var(--panel2),var(--ink));
  border:1px solid var(--line);border-radius:18px;overflow:hidden;
  box-shadow:0 30px 80px #000c,0 0 0 1px #00000080,0 0 60px -20px var(--red);
  animation:open .28s cubic-bezier(.2,.8,.2,1);
}
@keyframes open{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.shell::before{ /* red edge light along the top */
  content:"";position:absolute;left:0;right:0;top:0;height:2px;z-index:3;
  background:linear-gradient(90deg,transparent,var(--red) 30%,var(--red-hi) 50%,var(--red) 70%,transparent);
}

/* ---------- header ---------- */
.hd{grid-column:1/4;display:flex;align-items:center;gap:14px;padding:16px 22px;border-bottom:1px solid var(--line)}
.logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;
  background:linear-gradient(145deg,var(--red-hi),var(--ember));box-shadow:0 6px 18px -4px var(--red)}
.logo svg{width:22px;height:22px;fill:#fff}
.hd h1{font-size:clamp(16px,2.6vh,21px);font-weight:600;letter-spacing:.04em;line-height:1.1}
.hd p{font-size:clamp(10px,1.6vh,12px);color:var(--mute);margin-top:2px}
.count{margin-left:auto;display:flex;align-items:baseline;gap:6px;font-size:12px;color:var(--mute)}
.count b{font-size:22px;font-weight:600;color:#fff}
.x{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#ffffff08;color:var(--soft);font-size:20px;cursor:pointer;transition:.15s}
.x:hover{background:var(--red);border-color:var(--red);color:#fff}

/* ---------- vehicle list ---------- */
.side{border-right:1px solid var(--line);padding:14px 10px 14px 14px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;min-height:0}
.side::-webkit-scrollbar{width:4px}
.side::-webkit-scrollbar-thumb{background:var(--ember);border-radius:4px}
.car{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;border:1px solid transparent;background:#ffffff06;cursor:pointer;flex:none;transition:.15s;position:relative}
.car:hover{background:#ffffff0e}
.car.on{background:linear-gradient(90deg,#e11d2e30,#e11d2e08);border-color:#e11d2e99}
.car.on::before{content:"";position:absolute;left:-1px;top:20%;bottom:20%;width:3px;border-radius:3px;background:var(--red-hi);box-shadow:0 0 10px var(--red)}
.car .th{width:64px;height:38px;flex:none;display:grid;place-items:center}
.car .th img{max-width:100%;max-height:100%;object-fit:contain}
.car b{display:block;font-size:clamp(11px,1.8vh,13px);font-weight:500;line-height:1.2}
.car small{display:block;font-size:clamp(9px,1.4vh,10.5px);color:var(--mute);margin-top:1px}
.empty{margin:auto;text-align:center;color:var(--mute);font-size:13px;line-height:1.7;padding:20px 8px}
.empty svg{width:40px;height:40px;fill:var(--ember);display:block;margin:0 auto 10px}

/* ---------- stage ---------- */
.stage{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;overflow:hidden;
  background:
    radial-gradient(ellipse 60% 38% at 50% 78%,rgba(225,29,46,.38),transparent 70%),
    radial-gradient(circle at 50% 40%,#1c0c0f,transparent 75%)}
.ghost{position:absolute;top:8%;left:50%;transform:translateX(-50%);white-space:nowrap;
  font-size:clamp(60px,15vh,130px);font-weight:700;color:transparent;-webkit-text-stroke:1px rgba(255,70,85,.14);letter-spacing:.02em;pointer-events:none}
.floor{position:absolute;left:50%;bottom:19%;width:68%;height:14%;transform:translateX(-50%);
  border-radius:50%;border:1px solid rgba(255,70,85,.35);
  background:radial-gradient(ellipse,rgba(225,29,46,.35),transparent 68%);
  box-shadow:0 0 40px -6px rgba(225,29,46,.55) inset}
.floor::after{content:"";position:absolute;inset:-14% -8%;border-radius:50%;border:1px dashed rgba(255,70,85,.18)}
#img{position:relative;z-index:2;max-width:82%;max-height:46%;object-fit:contain;filter:drop-shadow(0 18px 18px #000c) drop-shadow(0 0 22px rgba(225,29,46,.25))}
#img.swap{animation:swap .35s cubic-bezier(.2,.8,.2,1)}
@keyframes swap{from{opacity:0;transform:translateX(22px) scale(.97)}to{opacity:1;transform:none}}
.title{position:relative;z-index:2;text-align:center;margin-top:2.4vh}
.title h2{font-size:clamp(20px,4vh,32px);font-weight:600;letter-spacing:.02em;line-height:1.1}
.title span{display:inline-block;margin-top:6px;padding:2px 12px;border-radius:99px;font-size:clamp(9px,1.5vh,11px);color:var(--red-hi);background:#e11d2e1f;border:1px solid #e11d2e55}
.none{position:absolute;inset:0;display:none;place-items:center;color:var(--mute);font-size:14px;z-index:3}
.stage.blank .none{display:grid}
.stage.blank>*:not(.none){opacity:0}

/* ---------- stats ---------- */
.info{border-left:1px solid var(--line);padding:16px 18px;display:flex;flex-direction:column;gap:16px;min-height:0;overflow-y:auto}
.rings{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ring{position:relative;display:grid;place-items:center;aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6;stroke-linecap:round}
.ring .tr{stroke:#ffffff12}
.ring .pg{stroke:url(#g);stroke-dasharray:163.4;stroke-dashoffset:163.4;transition:stroke-dashoffset .5s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 4px rgba(225,29,46,.7))}
.ring div{position:absolute;text-align:center;line-height:1.1}
.ring b{display:block;font-size:clamp(13px,2.3vh,18px);font-weight:600}
.ring small{font-size:clamp(8px,1.3vh,10px);color:var(--mute)}
.bars{display:flex;flex-direction:column;gap:13px}
.bar header{display:flex;justify-content:space-between;font-size:clamp(10px,1.6vh,12px);color:var(--soft);margin-bottom:6px}
.bar header em{font-style:normal;color:var(--mute)}
.bar .tk{height:6px;border-radius:6px;background:#ffffff12;overflow:hidden}
.bar .tk u{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,var(--ember),var(--red) 55%,var(--red-hi));transition:width .5s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 10px rgba(225,29,46,.6)}

/* ---------- footer ---------- */
.ft{grid-column:1/4;display:flex;align-items:center;gap:14px;padding:14px 22px;border-top:1px solid var(--line);background:#00000040}
.hint{font-size:clamp(9px,1.5vh,11px);color:var(--mute);display:flex;gap:14px}
.hint kbd{font-family:inherit;padding:1px 7px;border-radius:6px;border:1px solid var(--line);background:#ffffff0a;color:var(--soft);margin-right:5px}
#spawn{margin-left:auto;min-width:clamp(160px,22vw,260px);height:clamp(36px,6vh,46px);padding:0 28px;border:0;border-radius:12px;cursor:pointer;
  font-size:clamp(12px,2vh,15px);font-weight:600;letter-spacing:.03em;color:#fff;
  background:linear-gradient(180deg,var(--red-hi),var(--red) 55%,#a5101e);
  box-shadow:0 10px 26px -8px var(--red),inset 0 1px 0 #ffffff55;transition:.15s}
#spawn:hover{filter:brightness(1.12);transform:translateY(-1px)}
#spawn:active{transform:scale(.98)}
#spawn:disabled{opacity:.35;pointer-events:none;filter:grayscale(.6)}
:focus-visible{outline:2px solid var(--red-hi);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#dbg{position:fixed;left:6px;bottom:6px;z-index:99;font:11px/1.4 monospace;color:#8f8;background:#000b;padding:3px 7px;border-radius:4px;pointer-events:none;white-space:pre}
</style>
</head>
<body>
<div id="dbg"></div>
<div id="root">
  <div class="shell">
    <svg width="0" height="0" style="position:absolute"><defs>
      <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff4655"/><stop offset="1" stop-color="#b3101f"/></linearGradient>
    </defs></svg>

    <div class="hd">
      <div class="logo"><svg viewBox="0 0 24 24"><path d="M12 3 2 11h3v9h14v-9h3L12 3Zm-4 9h8v2H8v-2Zm0 4h8v2H8v-2Z"/></svg></div>
      <div><h1>GARAGE</h1><p>โรงรถของคุณ</p></div>
      <div class="count"><b id="cnt">0</b> คัน</div>
      <button class="x" id="close" title="ปิด (Esc)">&times;</button>
    </div>

    <div class="side" id="list"></div>

    <div class="stage" id="stage">
      <div class="ghost" id="ghost"></div>
      <div class="floor"></div>
      <img id="img" alt="">
      <div class="title"><h2 id="nm">-</h2><span id="mdl">-</span></div>
      <div class="none">ยังไม่มีรถในโรงรถ</div>
    </div>

    <div class="info">
      <div class="rings">
        <div class="ring"><svg viewBox="0 0 60 60"><circle class="tr" cx="30" cy="30" r="26"/><circle class="pg" id="r_hp" cx="30" cy="30" r="26"/></svg><div><b id="hp">0%</b><small>สภาพรถ</small></div></div>
        <div class="ring"><svg viewBox="0 0 60 60"><circle class="tr" cx="30" cy="30" r="26"/><circle class="pg" id="r_fuel" cx="30" cy="30" r="26"/></svg><div><b id="fuel">0%</b><small>น้ำมัน</small></div></div>
      </div>
      <div class="bars">
        <div class="bar"><header><span>ความเร็ว</span><em id="v_spd">0</em></header><div class="tk"><u id="b_spd"></u></div></div>
        <div class="bar"><header><span>อัตราเร่ง</span><em id="v_acc">0</em></header><div class="tk"><u id="b_acc"></u></div></div>
        <div class="bar"><header><span>การเบรก</span><em id="v_brk">0</em></header><div class="tk"><u id="b_brk"></u></div></div>
        <div class="bar"><header><span>การควบคุม</span><em id="v_hnd">0</em></header><div class="tk"><u id="b_hnd"></u></div></div>
      </div>
    </div>

    <div class="ft">
      <div class="hint"><span><kbd>&uarr;</kbd><kbd>&darr;</kbd>เลือกรถ</span><span><kbd>Enter</kbd>เบิกรถ</span><span><kbd>Esc</kbd>ปิด</span></div>
      <button id="spawn">เบิกรถ</button>
    </div>
  </div>
</div>

<script>
// IMG_BASE: one image per vehicle model, e.g. img/579.png (same folder as this page)
const IMG_BASE = "img/";
const FALLBACK = "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 50"><path fill="#ffffff" d="M10 34l6-12c2-4 5-6 9-6h50c5 0 8 2 11 6l11 6c4 1 7 3 7 7v3h-8a9 9 0 0 0-18 0H46a9 9 0 0 0-18 0H10z"/><circle cx="37" cy="38" r="6" fill="#222"/><circle cx="87" cy="38" r="6" fill="#222"/></svg>');
const $ = id => document.getElementById(id);

// The in-game browser may inject `cef` slightly AFTER this script runs, so look it up lazily.
const PREVIEW = /[?&]preview=1/.test(location.search);   // add ?preview=1 to test in a normal browser
const getCef = () => (typeof cef !== "undefined" ? cef : (window.cef || null));
const handlers = {}, bound = {};
function bindAll() {
  const c = getCef(); if (!c) return false;
  for (const n in handlers) if (!bound[n]) { c.on(n, handlers[n]); bound[n] = true; }
  return true;
}
const setFocus = v => { try { const c = getCef(); if (c && typeof c.set_focus === "function") c.set_focus(!!v); } catch (e) {} };
const send = (n, ...a) => { const c = getCef(); if (c) c.emit(n, ...a); else console.log("emit (no cef)", n, a); };
// ---- on-screen debug line (set DEBUG=false when everything works) ----
const DEBUG = true;
const st = { v: "6", cef: "no", ready: "-", add: 0, exp: "-", show: "-", spawn: "-", err: "" };
function upd() {
  const d = $("dbg"); if (!d) return;
  d.style.display = DEBUG ? "block" : "none";
  d.textContent = "garage v" + st.v + " | cef:" + st.cef + " ready:" + st.ready + " add:" + st.add + "/" + st.exp +
    " show:" + st.show + " spawn:" + st.spawn + (st.err ? "\nERR: " + st.err : "");
}
addEventListener("error", e => { st.err = String(e.message || e); upd(); });
const safe = f => (...a) => { try { return f(...a); } catch (e) { st.err = String((e && e.message) || e); upd(); } };
const on = (n, f) => { handlers[n] = safe(f); bindAll(); };

// The server may send either separate arguments or ONE json string like "[1,579,...]". Accept both.
function norm(args) {
  if (args.length === 1 && typeof args[0] === "string" && args[0].trim()[0] === "[") {
    try { return JSON.parse(args[0]); } catch (e) {}
  }
  return args;
}

let cars = [], sel = -1, busy = false, resynced = false;
const C = 163.4; // ring circumference (r=26)
const clamp = v => Math.max(0, Math.min(100, +v || 0));
const imgOf = c => IMG_BASE + c.model + ".png";
function setImg(el, c) { el.onerror = () => { el.onerror = null; el.src = FALLBACK; }; el.src = imgOf(c); }

function render() {
  const list = $("list"); list.innerHTML = "";
  $("cnt").textContent = cars.length;
  $("stage").classList.toggle("blank", !cars.length);
  if (!cars.length) {
    list.innerHTML = '<div class="empty"><svg viewBox="0 0 24 24"><path d="M12 3 2 11h3v9h14v-9h3L12 3Z"/></svg>ยังไม่มีรถในโรงรถ</div>';
  }
  cars.forEach((c, i) => {
    const d = document.createElement("div");
    d.className = "car" + (i === sel ? " on" : "");
    const th = document.createElement("div"); th.className = "th";
    const im = document.createElement("img"); setImg(im, c); th.append(im);
    const t = document.createElement("div");
    const b = document.createElement("b"); b.textContent = c.name;
    const s = document.createElement("small"); s.textContent = "สภาพ " + c.hp + "% · น้ำมัน " + c.fuel + "%";
    t.append(b, s);
    d.append(th, t);
    d.onclick = () => select(i);
    list.append(d);
  });
  $("spawn").disabled = sel < 0 || busy;
  const on = list.querySelector(".car.on"); if (on) on.scrollIntoView({ block: "nearest" });
}

function select(i) {
  sel = i; const c = cars[i];
  if (!c) return render();
  $("nm").textContent = c.name;
  $("ghost").textContent = c.name;
  $("mdl").textContent = "MODEL " + c.model;
  const im = $("img"); setImg(im, c);
  im.classList.remove("swap"); void im.offsetWidth; im.classList.add("swap");
  $("hp").textContent = c.hp + "%";
  $("fuel").textContent = c.fuel + "%";
  $("r_hp").style.strokeDashoffset = C * (1 - clamp(c.hp) / 100);
  $("r_fuel").style.strokeDashoffset = C * (1 - clamp(c.fuel) / 100);
  ["spd", "acc", "brk", "hnd"].forEach(k => {
    $("b_" + k).style.width = clamp(c[k]) + "%";
    $("v_" + k).textContent = Math.round(clamp(c[k]));
  });
  render();
}

// ---- events from the server ----
on("garage:clear", () => { cars = []; sel = -1; st.add = 0; upd(); });
// garage:add -> [dbid, model, "name", fuel, hp, speed, accel, brake, handling]
on("garage:add", (...a) => {
  const [id, model, name, fuel, hp, spd, acc, brk, hnd] = norm(a);
  const car = { id: +id, model: +model, name: String(name), fuel: +fuel, hp: +hp, spd: +spd, acc: +acc, brk: +brk, hnd: +hnd };
  const k = cars.findIndex(x => x.id === car.id);
  if (k >= 0) cars[k] = car; else cars.push(car);
  st.add = cars.length; upd();
  // if the panel is already visible (add arrived after show) refresh it, and select a car so the button is enabled
  if ($("root").classList.contains("on")) { if (sel < 0) select(0); else render(); }
});
on("garage:show", (...a) => {
  const na = norm(a), v = na[0];
  const show = v === true || v === 1 || v === "1" || v === "true";
  st.show = show ? "on" : "off"; if (na[1] !== undefined) st.exp = na[1]; upd();
  // fewer cars than the server said it sent -> ask the server to send the list again (once per opening)
  if (show && na[1] !== undefined && cars.length < +na[1] && !resynced) { resynced = true; send("garage:ready", "1"); }
  if (!show) resynced = false;
  $("root").classList.toggle("on", show);
  setFocus(show);
  busy = false;
  if (show) { render(); if (cars.length) select(cars[sel] ? sel : 0); }
});

// ---- events to the server ----
function hide() { $("root").classList.remove("on"); setFocus(false); }
function closeUI() { hide(); send("garage:close", "1"); }
function spawn() {
  if (sel < 0 || busy || !cars[sel]) return;
  busy = true;
  st.spawn = "id " + cars[sel].id; upd();
  send("garage:spawn", String(cars[sel].id));
  hide();
}
$("spawn").onclick = spawn;
$("close").onclick = closeUI;
addEventListener("keydown", e => {
  if (!$("root").classList.contains("on")) return;
  if (e.key === "Escape") closeUI();
  else if (e.key === "Enter") spawn();
  else if (e.key === "ArrowDown" && cars.length) select(Math.min(cars.length - 1, sel + 1));
  else if (e.key === "ArrowUp" && cars.length) select(Math.max(0, sel - 1));
});

// keep trying until the game's cef object appears (max 60s)
if (!bindAll()) {
  let tries = 0;
  const t = setInterval(() => { if (bindAll() || ++tries > 600) clearInterval(t); }, 100);
}

// tell the server the page is loaded and listening, so it can send the car list at the right time
let announced = false;
function announce() { st.cef = getCef() ? "yes" : "no"; if (announced || !getCef()) { upd(); return; } announced = true; st.ready = "sent"; upd(); send("garage:ready", "1"); }
announce();
if (!announced) { const t2 = setInterval(() => { announce(); if (announced) clearInterval(t2); }, 100); }

// preview in a normal browser - ONLY with ?preview=1
if (PREVIEW && !getCef()) {
  cars = [
    { id: 0, model: 579, name: "Huntley",   fuel: 86,  hp: 100, spd: 70, acc: 60, brk: 55, hnd: 50 },
    { id: 1, model: 482, name: "Alpha Van", fuel: 100, hp: 72,  spd: 65, acc: 50, brk: 60, hnd: 55 },
    { id: 2, model: 411, name: "Infernus",  fuel: 40,  hp: 95,  spd: 95, acc: 90, brk: 80, hnd: 85 }
  ];
  document.body.style.background = "#222";
  $("root").classList.add("on"); render(); select(0);
}
upd();
</script>
</body>
</html>
