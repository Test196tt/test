<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phone</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none}
html,body{width:100%;height:100%;background:transparent;font-family:"Segoe UI",Tahoma,sans-serif;overflow:hidden}
/* ตัวเครื่องเดียวกับ twitter.html (ขนาด ขอบ รอยบาก แถบสถานะ ปุ่มโฮม) */
#phone{position:absolute;bottom:50px;right:50px;width:330px;height:680px;background:#000;border-radius:45px;border:10px solid #222;box-shadow:0 25px 50px -12px rgba(0,0,0,.8);overflow:hidden;display:none;flex-direction:column;color:#fff;z-index:100}
#phone.show{display:flex}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:28px;background:#222;border-bottom-left-radius:18px;border-bottom-right-radius:18px;z-index:102}
.status-bar{height:40px;flex:none;background:#000;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:12px 30px 0;font-size:13px;font-weight:500;z-index:101}
.body{position:relative;flex:1}
.home-indicator{flex:none;height:5px;width:110px;background:#fff;border-radius:10px;margin:15px auto 10px;opacity:.3;cursor:pointer}
.screen{position:absolute;inset:0;padding:14px 16px;background:#000;display:none;flex-direction:column}
.screen.on{display:flex}
#s-home{background:linear-gradient(160deg,#12151d,#000 70%)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 6px;margin-top:10px}
.app{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10px;cursor:pointer}
.ic{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;transition:transform .1s}
.app:active .ic{transform:scale(.9)}
h2{font-size:18px;margin:6px 0 10px}
.back{font-size:13px;color:#1da1f2;cursor:pointer;margin-bottom:4px}
.disp{background:#1c1c1e;border-radius:12px;min-height:46px;padding:10px;font-size:22px;text-align:center;letter-spacing:2px;margin-bottom:12px;word-break:break-all}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.k{height:52px;border-radius:50%;background:#1c1c1e;border:0;color:#fff;font-size:20px;cursor:pointer}
.k:active{background:#3a3a3c}
.go{background:#2ecc71}.del{background:#e74c3c55}
.err{color:#ff7675;font-size:12px;text-align:center;min-height:16px;margin-top:6px}
.row{display:flex;justify-content:space-between;padding:9px 12px;background:#1c1c1e;border-radius:10px;margin-bottom:6px;font-size:14px}
.row b{color:#55efc4}
.list{overflow:auto;flex:1}
.mecard{background:#1c1c1e;border-radius:16px;padding:26px 14px;text-align:center;margin-top:14px}.mecard .lb{font-size:12px;color:#9aa4ad;margin-bottom:8px}.mecard .nm{font-size:28px;font-weight:600;color:#55efc4;letter-spacing:3px;word-break:break-all}
#s-call{align-items:center;justify-content:space-between;padding:70px 16px 36px;background:linear-gradient(170deg,#16202b,#000 75%)}
.avatar{width:96px;height:96px;border-radius:50%;background:#2c3e50;display:flex;align-items:center;justify-content:center;font-size:48px;margin:0 auto 14px}
.cname{font-size:22px;font-weight:600;text-align:center;word-break:break-word}
.cnum{font-size:15px;color:#c9d1d9;text-align:center;margin-top:4px;letter-spacing:2px}
.cstat{font-size:14px;color:#9aa4ad;text-align:center;margin-top:6px;letter-spacing:1px}
.cbtns{display:flex;gap:46px;justify-content:center}
.cb{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;cursor:pointer;color:#ccc}
.cb i{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;font-style:normal}
.cb:active i{transform:scale(.92)}
.cb.ans i{background:#2ecc71}.cb.end i{background:#e74c3c}
.ring .avatar{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(46,204,113,.6)}100%{box-shadow:0 0 0 26px rgba(46,204,113,0)}}
#pill{position:absolute;top:70px;right:16px;width:220px;padding:10px 14px;background:rgba(18,20,26,.94);border:1px solid #333;border-radius:22px;color:#fff;display:none;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.6);pointer-events:none;z-index:200}
#pill.on{display:flex}
#pill .pi{width:34px;height:34px;border-radius:50%;background:#2ecc71;display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
#pill.r .pi{animation:pulse 1.2s infinite}
#pill .pt{min-width:0}
#pill .pn{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pill .ps{font-size:11px;color:#9aa4ad}
</style></head><body>
<div id="phone">
 <div class="notch"></div>
 <div class="status-bar"><span id="clock">--:--</span><div style="display:flex;gap:6px;align-items:center"><span style="font-size:10px;opacity:.8">LTE</span><span style="font-size:14px">&#128267;</span></div></div>
 <div class="body">
  <div class="screen on" id="s-home"><div class="grid" id="apps"></div></div>
  <div class="screen" id="s-pad">
   <div class="back" onclick="show('home')">&lsaquo; กลับ</div>
   <h2 id="pad-title">โทร</h2>
   <div class="disp" id="num">&nbsp;</div>
   <div class="pad" id="keys"></div>
   <div class="err" id="err"></div>
  </div>
  <div class="screen" id="s-call">
   <div style="width:100%">
    <div class="avatar">&#128100;</div>
    <div class="cname" id="c-name"></div>
    <div class="cnum" id="c-num"></div>
    <div class="cstat" id="c-stat"></div>
   </div>
   <div class="cbtns">
    <div class="cb ans" id="b-ans" onclick="act('answer')"><i>&#128222;</i>รับสาย</div>
    <div class="cb end" onclick="act('hangup')"><i>&#128245;</i><span id="b-end">วางสาย</span></div>
   </div>
  </div>
  <div class="screen" id="s-me">
   <div class="back" onclick="show('home')">&lsaquo; กลับ</div>
   <h2>เบอร์ของฉัน</h2>
   <div class="mecard"><div class="lb">หมายเลขโทรศัพท์</div><div class="nm" id="menum">-</div></div>
  </div>
  <div class="screen" id="s-price">
   <div class="back" onclick="show('home')">&lsaquo; กลับ</div>
   <h2>ราคาสินค้า</h2>
   <div class="list" id="prices"></div>
  </div>
 </div>
 <div class="home-indicator" onclick="act('close')"></div>
</div>

<div id="pill"><div class="pi">&#128222;</div><div class="pt"><div class="pn" id="p-name"></div><div class="ps" id="p-stat"></div></div></div>
<script>
// ---- สะพานเชื่อม CEF (ถ้าเปิดไฟล์ในเบราว์เซอร์ธรรมดาจะใช้ mock ให้ทดสอบหน้าตาได้) ----
// Android WebView ฉีด window.cef หลังโหลดหน้าเสร็จ (onPageFinished) จึงต้องหยิบมาใช้ตอนเรียก ไม่ใช่ตอนโหลดสคริปต์
var _q=[];
var C={
  emit:function(){var c=window.cef;if(c&&c.emit)c.emit.apply(c,arguments);else console.log('emit',[].slice.call(arguments))},
  set_focus:function(f){var c=window.cef;if(c&&c.set_focus)c.set_focus(f)},
  on:function(n,f){var c=window.cef;if(c&&c.on)c.on(n,f);else _q.push([n,f])}
};
(function wait(){if(window.cef&&window.cef.on){_q.forEach(function(x){window.cef.on(x[0],x[1])});_q=[]}else setTimeout(wait,50)})();
var $=function(i){return document.getElementById(i)};
var mode='call', buf='';
var cs=0, cnum='', cname='', csince=0, ctimer=null, cfocus=true;

var APPS=[
 {id:'call',    n:'โทร',      i:'📞',c:'#2ecc71'},
 {id:'sms',     n:'ข้อความ',  i:'💬',c:'#3498db'},
 {id:'contacts',n:'รายชื่อ',  i:'👤',c:'#95a5a6'},
 {id:'twitter', n:'Twitter',  i:'🐦',c:'#1da1f2'},
 {id:'gps',     n:'GPS',      i:'📍',c:'#e74c3c'},
 {id:'prices',  n:'ราคาสินค้า',i:'🏷️',c:'#f39c12'},
 {id:'transfer',n:'โอนเงิน',  i:'💸',c:'#16a085'},
 {id:'me',      n:'เบอร์ฉัน',  i:'📱',c:'#9b59b6'},
 {id:'ig',      n:'Instagram', i:'📷',c:'#e1306c'}
];
// ชื่อสินค้า (ลำดับต้องตรงกับที่ server ส่งมา) - ชื่อไทยอยู่ฝั่งเว็บเพื่อเลี่ยงปัญหา encoding
var ITEMS=['องุ่น','แตงโม','ข้าว','เห็ด','แร่เหลือง','แร่เขียว','แร่ฟ้า','แร่แดง','ฉลามโต'];

$('apps').innerHTML=APPS.map(function(a){
  return '<div class="app" onclick="tap(\''+a.id+'\')"><div class="ic" style="background:'+a.c+'">'+a.i+'</div>'+a.n+'</div>';
}).join('');
$('keys').innerHTML=['1','2','3','4','5','6','7','8','9','✖','0','✔'].map(function(k){
  var cl=k==='✔'?' go':k==='✖'?' del':'';
  return '<button class="k'+cl+'" onclick="key(\''+k+'\')">'+k+'</button>';
}).join('');

function show(s){
  ['home','pad','price','call','me'].forEach(function(x){$('s-'+x).classList.toggle('on',x===s)});
}
function act(a,p){if(a==='close'&&cs===2)return;C.emit('phone:act',a+'|'+(p||''));if(a==='close'&&C.set_focus)C.set_focus(false)}      // ส่งเป็นสตริงเดียว "action|ข้อมูล"
function tap(id){
  if(id==='call'||id==='sms'){mode=id;buf='';$('num').innerHTML='&nbsp;';$('err').textContent='';
    $('pad-title').textContent=id==='call'?'โทร':'ส่งข้อความ (ใส่เบอร์)';show('pad');}
  else if(id==='prices'){show('price')}
  else if(id==='me'){show('me')}
  else if(id==='ig'&&!(window.cef&&window.cef.emit)){window.open('instagram.html?open','_blank')}  // เปิดในเบราว์เซอร์ธรรมดา: เปิดหน้า IG เปิดหน้าเปล่า
  else act(id);
}
function key(k){
  if(k==='✖'){buf=buf.slice(0,-1)}
  else if(k==='✔'){if(buf.length)act(mode,buf);return}
  else if(buf.length<10){buf+=k}
  $('num').innerHTML=buf||'&nbsp;';
}
function fmt(n){return '$'+Number(n).toLocaleString('en-US')}

// ---- event จาก server ----
// phone:open  (ราคา 9 ค่า คั่นด้วย , )   phone:close   phone:error (รหัส)
function openPhone(prices){
  var p=String(prices||'').split(',');
  $('menum').textContent=(p[9]&&p[9]!=='0')?p[9]:'-';
  $('prices').innerHTML=ITEMS.map(function(n,i){return '<div class="row"><span>'+n+'</span><b>'+fmt(p[i]||0)+'</b></div>'}).join('');
  show(cs>0?'call':'home');$('phone').classList.add('show');
}
C.on('phone:open',openPhone);
// เปิดหน้าเปล่าในเบราว์เซอร์: เปิดลิงก์แล้วต่อท้าย ?demo  (ในเกมจะไม่ใช้)
if(/[?&]demo/.test(location.search))openPhone('150,120,80,200,500,700,900,1200,600,0987654321');
C.on('phone:close',function(){
  $('phone').classList.remove('show');$('pill').classList.remove('on');
  cs=0;clearInterval(ctimer);ctimer=null;if(C.set_focus)C.set_focus(false)});

// ---- สาย: phone:call  "state|ชื่อ|focus"   state 0=ว่าง 1=กำลังโทร 2=สายเข้า 3=กำลังคุย ----
function mmss(ms){var t=Math.floor(ms/1000),m=Math.floor(t/60),x=t%60;return ('0'+m).slice(-2)+':'+('0'+x).slice(-2)}
function statText(){
  if(cs===1)return 'กำลังโทร…';
  if(cs===2)return 'สายเรียกเข้า';
  if(cs===3)return mmss(Date.now()-csince);
  return '';
}
function renderCall(){
  var t=statText();
  $('c-name').textContent=cname;$('c-num').textContent=cnum;$('c-stat').textContent=t;
  $('p-name').textContent=cname+(cnum?' · '+cnum:'');$('p-stat').textContent=t;
  $('b-ans').style.display=(cs===2)?'flex':'none';
  $('b-end').textContent=(cs===2)?'ปฏิเสธ':'วางสาย';
  $('s-call').classList.toggle('ring',cs===2);
  $('pill').classList.toggle('r',cs===2);
}
C.on('phone:call',function(a){
  var p=String(a||'').split('|'),st=parseInt(p[0],10)||0;
  cname=p[1]||'';cnum=(p[2]&&p[2]!=='0')?p[2]:'';cfocus=(p[3]==='1');
  if(st===cs&&st!==0){}else if(st===3)csince=Date.now();
  cs=st;
  clearInterval(ctimer);ctimer=null;
  if(st===0){$('pill').classList.remove('on');if($('phone').classList.contains('show'))show('home');return}
  ctimer=setInterval(renderCall,500);renderCall();
  if(cfocus){$('pill').classList.remove('on');$('phone').classList.add('show');show('call')}
  else{$('phone').classList.remove('show');$('pill').classList.add('on')}
});
C.on('phone:error',function(code){
  var m={1:'เบอร์นี้ไม่ได้ออนไลน์อยู่',3:'คุณกำลังใช้สายอยู่',4:'สายไม่ว่าง'};
  $('err').textContent=m[code]||'ข้อมูลไม่ถูกต้อง'});

document.addEventListener('keydown',function(e){
  if(e.key==='Escape')act('close');
  else if(/^[0-9]$/.test(e.key)&&$('s-pad').classList.contains('on'))key(e.key);
  else if(e.key==='Backspace')key('✖');
  else if(e.key==='Enter'&&$('s-pad').classList.contains('on'))key('✔');
});
function fit(){$('phone').style.zoom=Math.min(1,(innerHeight-20)/710)}
fit();addEventListener('resize',fit);
document.addEventListener('click',function(e){if(e.target===document.body||e.target===document.documentElement)act('close')});
function tick(){var d=new Date();$('clock').textContent=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
tick();setInterval(tick,20000);
</script></body></html>
