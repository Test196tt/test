<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Airdrop</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,400;0,500;0,600;1,600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:transparent;overflow:hidden;font-family:Kanit,"Noto Sans Thai",Tahoma,sans-serif;user-select:none}
#hud{position:fixed;left:50%;top:8px;width:640px;height:62px;margin-left:-320px;transform-origin:50% 0;transform:scale(var(--k,1));display:flex;justify-content:center;gap:8px}
.c{--c:#ff8a1f;position:relative;width:152px;height:58px;border-radius:12px;background:linear-gradient(#262628,#1a1a1c);border:1px solid #ffffff14;box-shadow:0 4px 14px #0007;display:none;align-items:center;gap:6px;padding:0 8px 0 10px;overflow:hidden}
.c.on{display:flex;animation:in .45s cubic-bezier(.2,.9,.3,1.15) both}
.c.out{display:flex;animation:out .3s ease-in both}
.c::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c);box-shadow:0 0 10px var(--c)}
.c::after{content:"";position:absolute;inset:0;background:radial-gradient(90px 50px at 25% 40%,color-mix(in srgb,var(--c) 22%,transparent),transparent);pointer-events:none}
.ic{width:46px;height:46px;flex:none;z-index:1;filter:drop-shadow(0 3px 4px #0009)}
.tx{flex:1;min-width:0;z-index:1;text-align:center}
.nm{font:italic 600 13px/14px Kanit,sans-serif;letter-spacing:.5px;color:#f1f1f4;text-transform:uppercase}
.st{font:400 8.5px/11px Kanit,sans-serif;color:#a9a9b0;white-space:nowrap}
.tm{display:inline-block;margin-top:2px;min-width:62px;padding:0 8px;border-radius:9px;background:#ffffff12;font:600 14px/19px Kanit,sans-serif;color:#fff;letter-spacing:1px;font-variant-numeric:tabular-nums}
.bar{position:absolute;left:4px;right:0;bottom:0;height:3px;background:#ffffff10;z-index:1}
.bar i{display:block;height:100%;width:0;background:var(--c);box-shadow:0 0 6px var(--c);transition:width .9s linear}
.dots{display:flex;flex-direction:column;gap:3px;z-index:1}
.dots b{width:5px;height:5px;border-radius:50%;background:var(--c);opacity:.35}
.c.s1 .dots b{animation:dot 1.2s infinite}.c.s1 .dots b:nth-child(2){animation-delay:.2s}.c.s1 .dots b:nth-child(3){animation-delay:.4s}
.c.s2 .dots b,.c.s3 .dots b{opacity:1}
.c.s2{border-color:color-mix(in srgb,var(--c) 70%,transparent);animation:in .45s cubic-bezier(.2,.9,.3,1.15) both,glow 1.4s .5s infinite}
.c.s2 .tm,.c.s3 .tm{background:var(--c);color:#111}
.c.s2 .ic{animation:bob 1.1s ease-in-out infinite}
.c.s3 .tm{animation:blink .8s infinite}
.c.s2 .bar i,.c.s3 .bar i{width:100%!important}
@keyframes in{from{opacity:0;transform:translateY(-34px) scale(.85)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0;transform:translateY(-26px) scale(.9)}}
@keyframes glow{50%{box-shadow:0 0 18px color-mix(in srgb,var(--c) 70%,transparent),0 4px 14px #0007}}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes dot{50%{opacity:1}}
@keyframes blink{50%{opacity:.45}}
@media(prefers-reduced-motion:reduce){.c,.c *{animation:none!important}}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="sh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".32"/></linearGradient></defs></svg>
<div id="hud"></div>
<script>
const PREVIEW=false;
const VOL=.3; // ความดังเสียงแจ้งเตือนตอนพร้อมเก็บ (0 = ปิดเสียง)
const $=id=>document.getElementById(id);
const DEF={citizen:["PEOPLE","#ff8a1f"],agency:["AGENCY","#1fb8d8"],gang:["GANG","#e5262a"],family:["FAMILY","#35c01e"]};
const CRATE=`<svg class="ic" viewBox="0 0 64 64"><path d="M5 27C5 11 20 3 32 3S59 11 59 27Q51.5 21 45.5 27Q38.5 21 32 27Q25.5 21 18.5 27Q12.5 21 5 27Z" fill="var(--c)"/><path d="M32 3L18.5 25L32 25ZM32 3L45.5 25L59 27C59 20 56 14 50 9ZM32 3L5 27L18.5 25C12 17 12 11 20 7Z" fill="#fff" opacity=".22"/><path d="M5 27C5 11 20 3 32 3S59 11 59 27Q51.5 21 45.5 27Q38.5 21 32 27Q25.5 21 18.5 27Q12.5 21 5 27Z" fill="url(#sh)"/><path d="M32 3L18.5 26M32 3L45.5 26M32 3V26M32 3L5.5 26M32 3L58.5 26" stroke="#0003" stroke-width=".8" fill="none"/><path d="M5.5 27L21 43M18.5 26.5L22 43M32 27V43M45.5 26.5L42 43M58.5 27L43 43" stroke="#dfe2e8" stroke-opacity=".75" stroke-width=".9" fill="none"/><rect x="19" y="43" width="26" height="19" rx="3" fill="#5d6146"/><path d="M19 55H45V59A3 3 0 0 1 42 62H22A3 3 0 0 1 19 59Z" fill="var(--c)"/><rect x="19" y="43" width="26" height="19" rx="3" fill="url(#sh)"/><path d="M19 48H45" stroke="#0004" stroke-width="1.2"/><rect x="25" y="43" width="3" height="19" fill="#2b2d1f" opacity=".55"/><rect x="36" y="43" width="3" height="19" fill="#2b2d1f" opacity=".55"/><circle cx="26.5" cy="50.5" r="1" fill="#c9ccb4"/><circle cx="37.5" cy="50.5" r="1" fill="#c9ccb4"/></svg>`;
const cards={};
function card(k){
 if(cards[k])return cards[k];
 const d=DEF[k];if(!d)return null;
 const e=document.createElement("div");e.className="c";e.style.setProperty("--c",d[1]);
 e.innerHTML=CRATE+`<div class="tx"><div class="nm">${d[0]}</div><div class="st"></div><div class="tm">00:00:00</div></div><div class="dots"><b></b><b></b><b></b></div><div class="bar"><i></i></div>`;
 cards[k]={e,st:e.querySelector(".st"),tm:e.querySelector(".tm"),bar:e.querySelector(".bar i"),s:0,end:0,tot:0,k};
 return cards[k];
}
Object.keys(DEF).forEach(k=>{const c=card(k);$("hud").appendChild(c.e)});
const fmt=t=>{t=Math.max(0,Math.round(t));const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return[h,m,s].map(v=>String(v).padStart(2,"0")).join(":")};
function ding(){
 if(!VOL)return;
 try{
  AC=window.AC||(window.AC=new(window.AudioContext||window.webkitAudioContext)());
  if(AC.state=="suspended")AC.resume();
  const n=AC.currentTime;
  [[880,0],[1318.5,.12],[1760,.24]].forEach(([f,t])=>{const o=AC.createOscillator(),g=AC.createGain();o.type="sine";o.frequency.value=f;
   g.gain.setValueAtTime(.0001,n+t);g.gain.exponentialRampToValueAtTime(VOL,n+t+.01);g.gain.exponentialRampToValueAtTime(.0001,n+t+.4);
   o.connect(g);g.connect(AC.destination);o.start(n+t);o.stop(n+t+.45)});
 }catch(_){}
}
function setState(c,s,t){
 const was=c.s;
 if(s==1){c.end=Date.now()+t*1000;if(was!=1||t>c.tot)c.tot=Math.max(t,1)}
 if(s==was){if(s==1)draw(c);return}
 c.s=s;
 c.e.classList.remove("s1","s2","s3","out");
 if(s==0){if(was){c.e.classList.remove("on");c.e.classList.add("out");setTimeout(()=>{if(!c.s)c.e.classList.remove("out")},300)}return}
 c.e.classList.add("on","s"+s);
 if(s==2&&was!=2)ding();
 draw(c);
}
function draw(c){
 if(c.s==1){const t=(c.end-Date.now())/1000;c.tm.textContent=fmt(t);c.st.textContent="พร้อมให้เก็บในอีก";c.bar.style.width=Math.min(100,Math.max(0,(1-t/c.tot)*100))+"%"}
 else if(c.s==2){c.tm.textContent="READY";c.st.textContent="พร้อมให้เก็บแล้ว!"}
 else if(c.s==3){c.tm.textContent="PICKING";c.st.textContent="กำลังมีคนเก็บอยู่"}
}
setInterval(()=>{for(const k in cards)if(cards[k].s==1)draw(cards[k])},250);
// รับจากเซิร์ฟเวอร์: airdrop:update = {"c":[{"k":"citizen","s":1,"t":secs},...]}
// s: 0=ซ่อน 1=นับถอยหลัง 2=พร้อมเก็บ 3=กำลังเก็บ   k: citizen/agency/gang/family
function upd(o){if(o&&o.c)o.c.forEach(x=>{const c=card(x.k);if(c)setState(c,+x.s||0,+x.t||0)})}
const norm=(...a)=>{let x=a[0];if(typeof x=="string")try{x=JSON.parse(x)}catch(_){}return x};
let bound=false;
function bind(){
 if(bound)return true;
 if(!window.cef||!cef.on)return false;
 cef.on("airdrop:update",(...a)=>upd(norm(...a)));
 return bound=true;
}
if(!bind()){const iv=setInterval(()=>{if(bind())clearInterval(iv)},100);addEventListener("load",bind)}
function fit(){$("hud").style.setProperty("--k",Math.min(1,innerWidth*.96/640))}
addEventListener("resize",fit);fit();
if(PREVIEW||location.hash=="#preview"){
 const t0=Date.now();
 setInterval(()=>{
  const t=((Date.now()-t0)/1000)%40;
  const left=x=>Math.max(0,x-t);
  upd({c:[
   {k:"citizen",s:t<20?1:t<32?2:0,t:left(20)},
   {k:"agency",s:t<14?1:t<30?2:0,t:left(14)},
   {k:"gang",s:t<26?1:t<36?(t<33?2:3):0,t:left(26)},
   {k:"family",s:t<9?1:t<24?2:0,t:left(9)}]});
 },500);
}
</script></body></html>
