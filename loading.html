<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MELVY TOWN Loading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ruby:#1060f0;
    --ruby-deep:#0830b0;
    --ruby-glow:#4aa8ff;
    --paper:#ffffff;
    --track:rgba(3,8,24,.62);
  }
  html,body{
    margin:0;padding:0;width:100%;height:100%;
    background:transparent;overflow:hidden;
    font-family:"Kanit","Prompt","Noto Sans Thai",Tahoma,sans-serif;
    -webkit-user-select:none;user-select:none;
  }

  /* ---------- container (bottom-center, same spot as the old TextDraw bar) ---------- */
  #wrap{
    position:fixed;left:0;right:0;bottom:8%;
    display:-webkit-flex;display:flex;
    -webkit-justify-content:center;justify-content:center;
    pointer-events:none;
    opacity:0;visibility:hidden;
    -webkit-transform:translateY(10px);transform:translateY(10px);
    transition:opacity .25s ease .15s, transform .25s ease .15s, visibility 0s linear .4s;
  }
  #wrap.show{
    opacity:1;visibility:visible;
    -webkit-transform:translateY(0);transform:translateY(0);
    transition:opacity .18s ease, transform .22s ease, visibility 0s;
  }

  .stack{
    width:9vw;max-width:110px;min-width:72px;
  }

  /* ---------- the logo is the main progress indicator ---------- */
  .logo{position:relative;width:100%;line-height:0;}
  .logo img{display:block;}
  #base{
    width:100%;height:auto;
    -webkit-filter:grayscale(1) brightness(.55) drop-shadow(0 4px 6px rgba(0,0,0,.55));
    filter:grayscale(1) brightness(.55) drop-shadow(0 4px 6px rgba(0,0,0,.55));
    opacity:.9;
  }
  #reveal{
    position:absolute;left:0;top:0;height:100%;width:0%;
    overflow:hidden;
    transition:width .12s linear;
  }
  #full{
    max-width:none;height:100%;
    -webkit-filter:drop-shadow(0 4px 6px rgba(0,0,0,.45));
    filter:drop-shadow(0 4px 6px rgba(0,0,0,.45));
  }

  /* ---------- thin bar under the logo ---------- */
  .track{
    position:relative;height:6px;margin-top:4px;
    background:var(--track);
    border:1px solid var(--paper);
    border-radius:999px;
    overflow:hidden;
    box-shadow:0 3px 8px rgba(0,0,0,.45);
  }
  #fill{
    position:absolute;left:0;top:0;bottom:0;width:0%;
    border-radius:999px;
    background:-webkit-linear-gradient(top,var(--ruby-glow) 0%,var(--ruby) 55%,#0840c0 100%);
    background:linear-gradient(180deg,var(--ruby-glow) 0%,var(--ruby) 55%,#0840c0 100%);
    transition:width .12s linear;
    overflow:hidden;
  }
  #fill::after{
    content:"";position:absolute;left:0;top:0;right:0;bottom:0;
    background:repeating-linear-gradient(135deg,rgba(255,255,255,.28) 0,rgba(255,255,255,.28) 7px,rgba(255,255,255,0) 7px,rgba(255,255,255,0) 14px);
    background-size:20px 20px;
    -webkit-animation:slide .8s linear infinite;animation:slide .8s linear infinite;
  }
  @-webkit-keyframes slide{to{background-position:20px 0}}
  @keyframes slide{to{background-position:20px 0}}

  /* skip the width animation while the bar resets for a new job */
  #wrap.reset #reveal,#wrap.reset #fill{transition:none;}

  /* ---------- label row ---------- */
  .row{
    display:-webkit-flex;display:flex;
    -webkit-justify-content:space-between;justify-content:space-between;
    -webkit-align-items:baseline;align-items:baseline;
    margin-top:3px;padding:0 2px;
    color:var(--paper);
    text-shadow:0 2px 4px rgba(0,0,0,.75),0 0 2px rgba(0,0,0,.9);
    font-weight:600;font-size:9px;line-height:1.1;
  }
  .dots span{
    display:inline-block;opacity:.2;
    -webkit-animation:blink 1.2s infinite;animation:blink 1.2s infinite;
  }
  .dots span:nth-child(2){-webkit-animation-delay:.2s;animation-delay:.2s}
  .dots span:nth-child(3){-webkit-animation-delay:.4s;animation-delay:.4s}
  @-webkit-keyframes blink{0%,100%{opacity:.2}40%{opacity:1}}
  @keyframes blink{0%,100%{opacity:.2}40%{opacity:1}}
  #pct{font-weight:700;font-size:10px;font-variant-numeric:tabular-nums;}

  @media (prefers-reduced-motion:reduce){
    #fill::after,.dots span{-webkit-animation:none;animation:none}
    .dots span{opacity:1}
  }
</style>
</head>
<body>

<div id="wrap">
  <div class="stack">
    <div class="logo" id="logo">
      <img id="base" alt="">
      <div id="reveal"><img id="full" alt=""></div>
    </div>
    <div class="track"><div id="fill"></div></div>
    <div class="row">
      <span>กำลังโหลด<span class="dots"><span>.</span><span>.</span><span>.</span></span></span>
      <span id="pct">0%</span>
    </div>
  </div>
</div>

  var wrap   = document.getElementById('wrap');
  var logo   = document.getElementById('logo');
  var base   = document.getElementById('base');
  var full   = document.getElementById('full');
  var reveal = document.getElementById('reveal');
  var fill   = document.getElementById('fill');
  var pct    = document.getElementById('pct');
  var visible = false;

  base.src = LOGO;
  full.src = LOGO;

  // the colored logo has to keep the same pixel width as the grey one while the clip box grows
  function sync(){ full.style.width = logo.offsetWidth + 'px'; }
  base.onload = sync;
  window.addEventListener('resize', sync);
  sync();

  function set(p, show){
    p = Math.max(0, Math.min(100, Math.round(p)));

    if(show && !visible){
      // new job: snap back to empty without animating
      wrap.className = 'reset';
      reveal.style.width = '0%';
      fill.style.width = '0%';
      void wrap.offsetWidth;
    }

    reveal.style.width = p + '%';
    fill.style.width = p + '%';
    pct.textContent = p + '%';

    if(show){ wrap.className = 'show'; visible = true; }
    else    { wrap.className = '';     visible = false; }
  }

      var v = a[0];
      if(typeof v === 'string'){
        try { v = JSON.parse(v); } catch(e){ v = v.split(','); }
      }
      a = (v instanceof Array) ? v : [v];
    }
    var p = Number(a[0]);
    var show = (a[1] === undefined) ? 1 : Number(a[1]);
    set(isNaN(p) ? 0 : p, show === 1);
  }

  window.loadingUpdate = onUpdate;

  var tries = 0;
  (function register(){
    if(window.cef && typeof window.cef.on === 'function'){
      window.cef.on('loading:update', onUpdate);
      return;
    }
    if(tries++ < 50) setTimeout(register, 100);
  })();

  window.addEventListener('message', function(e){
    var d = e.data;
    if(d && d.event === 'loading:update') onUpdate(d.args !== undefined ? d.args : d.data);
  });

  // browser preview only: open speedo-style URL with ?demo=1
  if(/[?&]demo=1/.test(location.search)){
    var t0 = new Date().getTime();
    setInterval(function(){
      var t = (new Date().getTime() - t0) % 5600;
      if(t < 4000) set(t / 40, true);
      else if(t < 4100) set(100, true);
      else set(100, false);
    }, 100);
  }
})();
</script>
