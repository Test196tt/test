<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>BUNNING TOWN Menu</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --g:#22f022;            /* เขียวสว่าง (เส้น/ไฮไลต์) */
  --g2:#9ff59f;           /* เขียวอ่อน ตอนชี้เมาส์ */
  --d1:#1c9a45;           /* เขียวเข้ม ไล่สีการ์ด (บน) */
  --d2:#0b5126;           /* เขียวเข้ม ไล่สีการ์ด (ล่าง) */
  --panel:rgba(12,20,15,.95);
  --u:calc(100vh / 432);  /* 1 หน่วย = 1 พิกเซลของภาพตัวอย่าง (จอสูง 432) ปรับตามจอให้อัตโนมัติ */
  --k:1;                  /* ขนาดรวมของเมนู (1 = ปกติ, 1.2 = ใหญ่ขึ้น) */
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;overflow:hidden;
  -webkit-user-select:none;user-select:none;pointer-events:none;
  font-family:Kanit,"Noto Sans Thai","Segoe UI",Tahoma,Roboto,Arial,sans-serif}
#menu{position:fixed;left:50%;top:50%;width:calc(330*var(--u));
  transform:translate(-50%,-50%) scale(var(--k));opacity:0;transition:opacity .2s;
  background:var(--panel);border-radius:calc(9*var(--u));padding:calc(10*var(--u));
  border:calc(1*var(--u)) solid rgba(34,240,34,.28);
  box-shadow:0 calc(8*var(--u)) calc(30*var(--u)) rgba(0,0,0,.6),inset 0 0 calc(24*var(--u)) rgba(34,240,34,.06)}
#menu.on{opacity:1}
#menu.on .banner,#menu.on .card{animation:up .35s cubic-bezier(.2,.9,.3,1.1) both}
#menu.on .card:nth-child(1){animation-delay:.05s}#menu.on .card:nth-child(2){animation-delay:.09s}
#menu.on .card:nth-child(3){animation-delay:.13s}#menu.on .card:nth-child(4){animation-delay:.17s}
#menu.on .card:nth-child(5){animation-delay:.21s}#menu.on .card:nth-child(6){animation-delay:.25s}
@keyframes up{from{opacity:0;transform:translateY(calc(8*var(--u)))}to{opacity:1;transform:none}}

/* หัวเมนู */
.hd{display:flex;align-items:center;justify-content:space-between;height:calc(18*var(--u))}
.hd .ti{color:#eaffec;font-weight:700;font-size:calc(9.5*var(--u));letter-spacing:calc(.6*var(--u))}
.hd .ti b{color:var(--g);font-weight:700;margin-left:calc(4*var(--u))}
.hd .x{pointer-events:auto;cursor:pointer;display:flex;align-items:center;justify-content:center;
  width:calc(15*var(--u));height:calc(15*var(--u));border-radius:calc(4*var(--u));
  background:rgba(34,240,34,.14);border:calc(.8*var(--u)) solid rgba(34,240,34,.4);
  transition:filter .15s,background .15s,transform .1s}
.hd .x svg{width:calc(7*var(--u));height:calc(7*var(--u));stroke:#d9ffdd;stroke-width:3;stroke-linecap:round;fill:none;pointer-events:none}
.hd .x:hover{background:rgba(34,240,34,.32);filter:brightness(1.25)}
.hd .x:active{transform:scale(.92)}

/* แบนเนอร์ (โดเนท) */
.banner{position:relative;margin-top:calc(6*var(--u));height:calc(70*var(--u));border-radius:calc(6*var(--u));overflow:hidden;
  pointer-events:auto;cursor:pointer;
  background:linear-gradient(115deg,#0a4a21 0%,#18963f 55%,#0e6c2d 100%);
  border:calc(.8*var(--u)) solid rgba(120,255,140,.3);transition:filter .15s}
.banner:hover{filter:brightness(1.18)}
.banner .tag{position:absolute;left:calc(8*var(--u));top:calc(7*var(--u));font-size:calc(5*var(--u));font-weight:600;color:#caffd0;letter-spacing:calc(.8*var(--u));opacity:.85}
.banner .big{position:absolute;right:calc(10*var(--u));bottom:calc(14*var(--u));color:#fff;font-weight:700;font-size:calc(22*var(--u));line-height:1;letter-spacing:calc(.5*var(--u));text-shadow:0 calc(1.5*var(--u)) 0 rgba(0,0,0,.35)}
.banner .sub{position:absolute;right:calc(10*var(--u));bottom:calc(6*var(--u));color:#b8f5c0;font-size:calc(5.6*var(--u))}
.cb{position:absolute;border-radius:calc(4*var(--u));background:linear-gradient(145deg,#6dff8a,#16a845 60%,#0b6a2b);
  box-shadow:inset 0 0 0 calc(.8*var(--u)) rgba(255,255,255,.35),0 calc(3*var(--u)) calc(6*var(--u)) rgba(0,0,0,.35)}
.cb.a{left:calc(14*var(--u));top:calc(20*var(--u));width:calc(26*var(--u));height:calc(26*var(--u));transform:rotate(-14deg);animation:fl 3.2s ease-in-out infinite}
.cb.b{left:calc(52*var(--u));top:calc(30*var(--u));width:calc(20*var(--u));height:calc(20*var(--u));transform:rotate(18deg);animation:fl 2.8s .4s ease-in-out infinite}
.cb.c{left:calc(88*var(--u));top:calc(14*var(--u));width:calc(34*var(--u));height:calc(34*var(--u));transform:rotate(8deg);animation:fl 3.6s .2s ease-in-out infinite}
.cb.c::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:calc(5*var(--u));margin-left:calc(-2.5*var(--u));background:rgba(255,255,255,.55)}
.cb.c::before{content:"";position:absolute;top:50%;left:0;right:0;height:calc(5*var(--u));margin-top:calc(-2.5*var(--u));background:rgba(255,255,255,.55)}
.cb.d{left:calc(135*var(--u));top:calc(40*var(--u));width:calc(9*var(--u));height:calc(9*var(--u));transform:rotate(40deg);opacity:.85;animation:fl 2.4s ease-in-out infinite}
@keyframes fl{0%,100%{translate:0 0}50%{translate:0 calc(-3*var(--u))}}

/* หัวข้อย่อย */
.sec{display:flex;align-items:center;gap:calc(4*var(--u));margin:calc(8*var(--u)) 0 calc(4*var(--u));color:#d9ffdc;font-size:calc(6.5*var(--u));font-weight:700;letter-spacing:calc(.6*var(--u))}
.sec::before{content:"";width:calc(4*var(--u));height:calc(4*var(--u));border-radius:50%;background:var(--g);box-shadow:calc(7*var(--u)) 0 0 rgba(34,240,34,.45)}
.sec span{margin-left:calc(7*var(--u))}

/* การ์ดเมนู */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(6*var(--u))}
.card{position:relative;height:calc(46*var(--u));border-radius:calc(5*var(--u));overflow:hidden;
  background:linear-gradient(160deg,var(--d1),var(--d2));border:calc(.8*var(--u)) solid rgba(120,255,140,.25);
  transition:filter .15s,transform .12s,border-color .15s}
.card.b{pointer-events:auto;cursor:pointer}
.card.b:hover{filter:brightness(1.25);transform:translateY(calc(-1*var(--u)));border-color:var(--g2)}
.card.b:active{transform:scale(.97)}
.card .ic{position:absolute;left:calc(8*var(--u));top:calc(6*var(--u));width:calc(22*var(--u));height:calc(22*var(--u));fill:#d9ffdd;filter:drop-shadow(0 calc(2*var(--u)) calc(3*var(--u)) rgba(0,0,0,.35));pointer-events:none}
.card .t{position:absolute;left:calc(8*var(--u));bottom:calc(11*var(--u));color:#fff;font-weight:700;font-size:calc(8.5*var(--u));letter-spacing:calc(.4*var(--u));line-height:1;white-space:nowrap;text-shadow:0 calc(1*var(--u)) 0 rgba(0,0,0,.4)}
.card .s{position:absolute;left:calc(8*var(--u));bottom:calc(4*var(--u));color:#a9ecb4;font-size:calc(5*var(--u));line-height:1;white-space:nowrap}
.card.logo{background:linear-gradient(160deg,#0f1a13,#0a120d);display:flex;align-items:center;justify-content:center}
.card.logo img{width:78%;height:auto;display:block;filter:drop-shadow(0 calc(2*var(--u)) calc(4*var(--u)) rgba(0,0,0,.5))}
</style>
</head>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};

  // ===== ส่ง event กลับไปเซิร์ฟเวอร์ (ชื่อ event: menu:act , ข้อมูล: ["inv"|"anim"|"status"|"setting"|"donate"|"gps"]) =====
  function send(name,arg){
    var args=(arg===undefined)?[]:[arg];
    try{ if(window.cef&&typeof window.cef.emit==='function'){ window.cef.emit.apply(window.cef,[name].concat(args)); return true; } }catch(e){}
    try{ if(window.mp&&typeof window.mp.trigger==='function'){ window.mp.trigger.apply(window.mp,[name].concat(args)); return true; } }catch(e){}
    try{ window.dispatchEvent(new CustomEvent('menu:local',{detail:{name:name,args:args}})); }catch(e){}
    return false;
  }
  window.__menuSend=send;

  document.querySelectorAll('[data-k]').forEach(function(b){
    b.addEventListener('click',function(){ send('menu:act',b.getAttribute('data-k')); });
  });
  $('close').addEventListener('click',function(){ send('menu:close'); });
  window.addEventListener('keydown',function(e){ if(e.key==='Escape') send('menu:close'); });

  // เซิร์ฟเวอร์สั่งโชว์/ซ่อน: Cef_Emit(playerid,"menu:show","[1]")
  function show(on){ $('menu').classList.toggle('on',!!on); }
  window.addEventListener('cef:menu:show',function(e){ var d=e.detail; show(Array.isArray(d)?Number(d[0])===1:Number(d)===1); });
  window.__menuShow=show;
  if(/[?&]demo/.test(location.search)){document.body.style.background="#3b4a3f";show(true);}
})();
</script>
