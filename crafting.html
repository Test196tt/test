<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Crafting</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:transparent;font-family:'Kanit','Segoe UI','Tahoma',sans-serif;color:#fff}
:root{--b1:#1678c8;--b2:#0b5a96;--b3:#083f66;   /* น้ำเงินเดียวกับหลอดเลือด */
  --g1:#4a4a4a;--g2:#404040;--g3:#7a7a7a;--ln:#bdbdbd}
#wrap{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:none}
#wrap.on{display:flex;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
#panel{width:min(920px,96vw);height:min(540px,92vh);background:var(--g1);border-radius:10px;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.55)}

header{flex:none;height:46px;display:flex;align-items:center;gap:14px;padding:0 12px 0 14px;background:linear-gradient(90deg,var(--b1),var(--b2))}
.ttl{display:flex;align-items:center;gap:8px;font-size:22px;font-weight:500;letter-spacing:.3px;white-space:nowrap}
.tabs{display:flex;gap:6px;margin-left:auto}
.tab{padding:5px 14px;border-radius:14px;background:rgba(0,0,0,.25);font-size:12.5px;cursor:pointer;white-space:nowrap;transition:.15s}
.tab:hover{background:rgba(0,0,0,.4)}
.tab.on{background:#fff;color:var(--b2);font-weight:600}
#x{flex:none;width:30px;height:30px;border:0;border-radius:8px;background:rgba(0,0,0,.28);color:#fff;font-size:14px;cursor:pointer}
#x:hover{background:rgba(0,0,0,.5)}

main{flex:1;display:flex;min-height:0;padding:6px 6px 0;gap:0}
#list{flex:none;width:21%;display:flex;flex-direction:column;gap:5px;overflow-y:auto;padding-right:4px}
.row{flex:none;height:44px;display:flex;align-items:center;gap:8px;padding:0 10px;border-radius:9px;cursor:pointer;
  background:linear-gradient(90deg,var(--b1),var(--b2));border:2px solid transparent;position:relative;transition:.12s}
.row:hover{filter:brightness(1.12)}
.row.on{border-color:#fff;box-shadow:0 0 12px rgba(22,120,200,.8)}
.row.no{opacity:.45}
.row .ic{font-size:22px;line-height:1;flex:none}
.row .nm{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.row .tg{font-size:10px;padding:1px 6px;border-radius:6px;background:rgba(0,0,0,.35)}
.row .dot{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 6px #4ade80;flex:none}
.row .dot.bad{background:#ff5566;box-shadow:0 0 6px #ff5566}

.sep{flex:none;width:16px;background:#fff;margin:0 3px}
.sep.l{clip-path:polygon(0 0,38% 0,38% 40%,100% 50%,38% 60%,38% 100%,0 100%)}
.sep.r{clip-path:polygon(62% 0,100% 0,100% 100%,62% 100%,62% 60%,0 50%,62% 40%)}

#detail{flex:none;width:31%;background:var(--g2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:8px 12px;min-height:0}
.dia{flex:none;width:min(138px,22vh);height:min(138px,22vh);border:2px dashed var(--b1);border-radius:20px;transform:rotate(45deg);display:grid;place-items:center;margin:min(18px,3vh) 0 min(12px,2vh)}
.dia span{transform:rotate(-45deg);font-size:min(60px,9vh);line-height:1}
.dn{font-size:24px;font-weight:500;text-align:center}
.pill{width:100%;padding:7px 12px;border-radius:7px;background:#555;font-size:12.5px;text-align:center}
.pill em{font-style:normal;color:#7cc4ff;font-weight:600}
.desc{font-size:10.5px;color:#aaa;text-align:center}
#go{flex:none;min-width:70%;padding:9px 18px;border:0;border-radius:8px;background:linear-gradient(90deg,var(--b1),var(--b2));color:#fff;font:600 18px 'Kanit',sans-serif;cursor:pointer;transition:.15s}
#go:hover:not(:disabled){filter:brightness(1.15);box-shadow:0 0 16px rgba(22,120,200,.7)}
#go:disabled{background:#5d5d5d;color:#999;cursor:not-allowed;font-size:14px}
.empty{margin:auto;color:#999;text-align:center;font-size:14px}

#right{flex:1;min-width:0;position:relative;padding-top:6px;display:flex;flex-direction:column}
.rtab{position:absolute;left:50%;top:-8px;transform:translateX(-50%);z-index:2;padding:5px 34px;border-radius:9px 9px 0 0;background:#8a8a8a;
  font-size:17px;font-weight:500;white-space:nowrap}
#mats{flex:1;min-height:0;margin-top:26px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:7px;padding:2px 2px 8px}
.slot{border:1.5px dashed var(--ln);border-radius:7px;background:#4d4d4d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:0;padding:3px}
.slot.f{border:1.5px solid var(--c);background:linear-gradient(180deg,#575757,#474747)}
.gem{width:min(26px,4vh);height:min(26px,4vh);border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.85),var(--c) 48%,rgba(0,0,0,.45))}
.slot svg{width:min(34px,5vh);height:auto}
.sn{font-size:11px;line-height:1.1;text-align:center}
.sq{font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}
.ok{color:#4ade80}.bad{color:#ff6070}

footer{flex:none;height:42px;margin-top:0;background:var(--g3);display:flex;align-items:center;justify-content:flex-end;gap:60px;padding:0 56px 0 12px}
.mny{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:500}
.mny svg{width:34px;height:auto}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--b2);border-radius:3px}
</style>
</head>
<body>
<div id="wrap">
 <div id="panel">
  <header>
   <div class="ttl"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 20.5 14 10"/><path d="M20.5 20.5 10 10"/><path d="M14.5 6.5a3.2 3.2 0 1 1 4 4"/><path d="M4 4l5 5"/><path d="M3.5 7.5 7.5 3.5"/></svg>Crafting Table</div>
   <div class="tabs" id="tabs"></div>
   <button id="x">&#10005;</button>
  </header>
  <main>
   <div id="list"></div>
   <div class="sep l"></div>
   <div id="detail"></div>
   <div class="sep r"></div>
   <div id="right"><div class="rtab">ไอเทมที่ต้องการ</div><div id="mats"></div></div>
  </main>
  <footer>
   <div class="mny"><svg viewBox="0 0 40 24"><rect x="1" y="2" width="38" height="20" rx="3" fill="#3fa34d" stroke="#1d6b2a" stroke-width="2"/><circle cx="20" cy="12" r="6" fill="#1d6b2a"/><text x="20" y="16" text-anchor="middle" font-size="10" font-weight="700" fill="#c9f2cf" font-family="Arial">$</text></svg><b id="gm">0</b></div>
   <div class="mny"><svg viewBox="0 0 40 24"><rect x="1" y="2" width="38" height="20" rx="3" fill="#e0322f" stroke="#8f1412" stroke-width="2"/><circle cx="20" cy="12" r="6" fill="#8f1412"/><text x="20" y="16" text-anchor="middle" font-size="10" font-weight="700" fill="#ffd0cf" font-family="Arial">$</text></svg><b id="rm">0</b></div>
  </footer>
 </div>
</div>
<script>
const MAT={yel:['แร่เหลือง','#facc15'],red:['แร่แดง','#ef4444'],blue:['แร่ฟ้า','#38bdf8'],lime:['ปูน','#d4d4d8'],wire:['สายไฟ','#fb923c']};
// สูตรคราฟ (id ต้องตรงกับ StartSelectCraft ใน pawn)
const R={
 1:{n:'คาตานะ',i:'🗡️',g:'w',m:{yel:50,red:50,blue:40,lime:30},rm:3000,gm:10000},
 2:{n:'ไม้เบสบอล',i:'🏏',g:'w',m:{yel:40,red:35,blue:45,lime:25},rm:4500,gm:9500},
 3:{n:'มีด',i:'🔪',g:'w',m:{yel:60,red:70,blue:50,lime:35,wire:20},rm:6000,gm:15000},
 4:{n:'เกราะ',i:'🛡️',g:'i',m:{lime:10},rm:0,gm:1000},
 5:{n:'AED',i:'🩺',g:'i',m:{lime:10},rm:0,gm:1500},
 6:{n:'แหวนแก๊ง',i:'💍',g:'i',m:{yel:30,red:25,lime:5},rm:0,gm:1000},
 7:{n:'ยาปั้ม',i:'💊',g:'i',m:{lime:15},rm:0,gm:1000},
 8:{n:'กุญแจตู้เซฟ',i:'🔑',g:'i',m:{red:50,blue:50,yel:10,lime:15,wire:15},rm:1500,gm:80000,ch:60}
};
// อัพเกรด (id 1=ไม้เบสบอล 2=คาตานะ 3=มีด 4=กุญแจตู้เซฟ) ใช้วัตถุดิบเหมือนตอนคราฟ
const U={
 1:{r:2,max:5,ch:[90,70,50,30],dmg:[5,8,12,14,16]},
 2:{r:1,max:3,ch:[50,20],dmg:[5,9,14]},
 3:{r:3,max:4,ch:[60,45,30],dmg:[6,8,12,14]},
 4:{r:8,max:3,ch:[40,30]} // กุญแจตู้เซฟ (ไม่มีดาเมจ)
};
const TABS=[['w','คราฟอาวุธ'],['i','คราฟไอเทม'],['u','อัพเกรดอาวุธ']];
let S={m:{},rm:0,gm:0,t:[0,0,0,0]},tab='w',sel=null;
const $=id=>document.getElementById(id), fmt=n=>Number(n).toLocaleString('en-US');

function have(r){return Object.keys(r.m).every(k=>(S.m[k]||0)>=r.m[k])&&S.rm>=r.rm&&S.gm>=r.gm}
function tabs(){$('tabs').innerHTML=TABS.map(t=>`<div class="tab ${t[0]==tab?'on':''}" data-t="${t[0]}">${t[1]}</div>`).join('');
 document.querySelectorAll('.tab').forEach(e=>e.onclick=()=>{tab=e.dataset.t;sel=null;render()})}
function ids(){return tab=='u'?[1,2,3,4]:Object.keys(R).filter(k=>R[k].g==tab).map(Number)}
function render(){
 tabs();$('rm').textContent=fmt(S.rm);$('gm').textContent=fmt(S.gm);
 $('list').innerHTML=ids().map(id=>{
  const up=tab=='u',r=up?R[U[id].r]:R[id],t=S.t[id-1];
  const mark=up?(t?`<span class="tg">T${t}/${U[id].max}</span>`:''):`<span class="dot ${have(r)?'':'bad'}" title="${have(r)?'วัตถุดิบครบ':'วัตถุดิบไม่พอ'}"></span>`;
  return `<div class="row ${sel==id?'on':''} ${up&&!t?'no':''}" data-id="${id}"><span class="ic">${r.i}</span><span class="nm">${r.n}</span>${mark}</div>`}).join('');
 document.querySelectorAll('.row').forEach(e=>e.onclick=()=>{sel=+e.dataset.id;render()});
 detail();
}
const NOTE=c=>`<svg viewBox="0 0 40 24"><rect x="1" y="2" width="38" height="20" rx="3" fill="${c[0]}" stroke="${c[1]}" stroke-width="2"/><circle cx="20" cy="12" r="6" fill="${c[1]}"/></svg>`;
function slots(list){
 let h=list.map(m=>`<div class="slot f" style="--c:${m.c}">${m.note?NOTE(m.note):'<div class="gem"></div>'}<div class="sn">${m.n}</div><div class="sq ${m.has>=m.need?'ok':'bad'}">${fmt(m.has)}/${fmt(m.need)}</div></div>`);
 while(h.length<16)h.push('<div class="slot"></div>');
 $('mats').innerHTML=h.join('');
}
function detail(){
 const d=$('detail');
 if(!sel){d.innerHTML='<div class="empty">เลือกรายการทางซ้าย<br>เพื่อดูรายละเอียด</div>';slots([]);return}
 const up=tab=='u',u=U[sel],r=up?R[u.r]:R[sel],t=S.t[sel-1];
 let ok=have(r),label=up?'ยืนยันอัพเกรด':'ยืนยัน',extra='',chance=up?null:(r.ch||100);
 if(up){
  if(!t){ok=false;label='ไม่มีอาวุธในกระเป๋า'}
  else if(t>=u.max){ok=false;label='เทียร์สูงสุดแล้ว'}
  else{
   chance=u.ch[t-1];
   extra=u.dmg?`<div class="pill">DAMAGE <em>${u.dmg[t-1]} ➜ ${u.dmg[t]}</em> · เทียร์ ${t} ➜ ${t+1}</div>`:`<div class="pill">เทียร์ <em>${t} ➜ ${t+1}</em> · กุญแจตู้เซฟ</div>`;
  }
 }
 if(!ok&&label.indexOf('ยืนยัน')==0)label='วัตถุดิบไม่พอ';
 const m=Object.keys(r.m).map(k=>({n:MAT[k][0],c:MAT[k][1],need:r.m[k],has:S.m[k]||0}));
 if(r.rm)m.push({n:'เงินแดง',c:'#ff5566',need:r.rm,has:S.rm,note:['#e0322f','#8f1412']});
 m.push({n:'เงินเขียว',c:'#4ade80',need:r.gm,has:S.gm,note:['#3fa34d','#1d6b2a']});
 slots(m);
 d.innerHTML=`<div class="dia"><span>${r.i}</span></div><div class="dn">${up?'อัพเกรด ':''}${r.n}</div>
  <div class="pill">อัตราการสำเร็จ : <em>${chance==null?'-':chance}</em></div>${extra}
  <div class="desc">${up?'ใช้วัตถุดิบเท่ากับตอนคราฟ หากล้มเหลวอาจเสียวัตถุดิบ':'ใช้เวลาคราฟประมาณ 40 วินาที'}</div>
  <button id="go" ${ok?'':'disabled'}>${label}</button>`;
 $('go').onclick=()=>{if(ok)send(up?'crafting:upgrade':'crafting:craft',sel)};
}
/* debug overlay ถูกลบออกแล้ว */
function st(){}
st('page loaded');

/* ---- สะพานเชื่อม CEF (แบบเดียวกับ index.html / twitter.html ที่ใช้งานได้) ----
   Android WebView ฉีด window.cef หลังโหลดหน้าเสร็จ จึงต้องหยิบมาใช้ตอนเรียก ไม่ใช่ตอนโหลดสคริปต์ */
var _q=[];
var C={
 emit:function(){var c=window.cef;if(c&&c.emit){c.emit.apply(c,arguments);return true}return false},
 set_focus:function(f){var c=window.cef;if(c&&c.set_focus)c.set_focus(f)},
 on:function(n,f){var c=window.cef;if(c&&c.on)c.on(n,f);else _q.push([n,f])}
};
function send(e,a){var ok=C.emit(e,String(a));st((ok?'emit ':'emit FAIL ')+e)}
(function wait(){
 if(window.cef&&window.cef.on){
  _q.forEach(function(x){window.cef.on(x[0],x[1])});_q=[];
  st('cef bound');
  C.emit('crafting:ready','1');
 }else setTimeout(wait,50);
})();

/* ---- แปลงข้อมูลที่ server ส่งมา ----
   ในเกม: ["yel,red,blue,lime,wire,rm,gm,t1,t2,t3"]  (CSV)   พรีวิว/ทดสอบ: object หรือ JSON ก็ได้ */
function parse(a){
 try{
  if(Array.isArray(a)&&a.length==1)a=a[0];
  if(typeof a=='string'){
   var s=a.replace(/^\s+|\s+$/g,''),c=s.charAt(0);
   if(c=='{'||c=='['||c=='"')return parse(JSON.parse(s));
   var p=s.split(',').map(function(x){return Number(x)||0});
   if(p.length<10)return null;
   return {m:{yel:p[0],red:p[1],blue:p[2],lime:p[3],wire:p[4]},rm:p[5],gm:p[6],t:[p[7],p[8],p[9],p[10]||0]};
  }
  return (a&&typeof a=='object')?a:null;
 }catch(_){return null}
}
function openUI(a){
 var d=parse(a);
 if(!d){st('open: bad data '+String(a).slice(0,60));return}
 var was=$('wrap').classList.contains('on');
 S=Object.assign({m:{},rm:0,gm:0,t:[0,0,0,0]},d);
 if(!was)sel=null;
 render();$('wrap').classList.add('on');
 st('opened');
 send('crafting:shown',1);
}
function hide(){$('wrap').classList.remove('on')}
function closeUI(){hide();C.set_focus(false);send('crafting:close',1)}
$('x').onclick=closeUI;
addEventListener('keydown',function(e){if(e.key=='Escape')closeUI()});

C.on('crafting:open',function(){st('GOT open event');openUI(arguments[0])});
C.on('crafting:close',hide);
window.craftingOpen=openUI;window.craftingClose=hide;

/* โหมดทดลองในเบราว์เซอร์: เปิดไฟล์แล้วต่อท้าย ?demo (ในเกมไม่ใช้) */
if(/[?&](demo|preview)/.test(location.search)||location.protocol=='file:'){
 document.body.style.background='#1c1c22 radial-gradient(circle at 30% 30%,#10304d,#111)';
 openUI({m:{yel:60,red:30,blue:50,lime:40,wire:25},rm:5000,gm:90000,t:[2,1,0,1]});
}
</script>
</body>
</html>
