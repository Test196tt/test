<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gacha</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--g1:#2c2d31;--g2:#222326;--g3:#17181a;--gl:#3d3e44;--red:#e0243a;--red2:#8e1423;--tx:#ececee;--mu:#9a9ca3;--gold:#ffc83d}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:transparent;font-family:Kanit,"Noto Sans Thai",Tahoma,sans-serif;color:var(--tx);overflow:hidden;user-select:none}
#app{display:none;position:fixed;inset:0;align-items:center;justify-content:center}
#app.on{display:flex}
.wrap{position:relative;width:380px;transform:scale(var(--k,1))}
#app.on .wrap{animation:gIn .24s cubic-bezier(.2,.9,.3,1.1) both}
#app.out .wrap{animation:gOut .18s ease-in both}
@keyframes gIn{from{opacity:0;transform:translateY(20px) scale(calc(var(--k,1)*.95))}to{opacity:1;transform:scale(var(--k,1))}}
@keyframes gOut{to{opacity:0;transform:translateY(12px) scale(calc(var(--k,1)*.97))}}
@media(prefers-reduced-motion:reduce){#app .wrap{animation:none!important}}
.win{background:var(--g1);border:1px solid var(--gl);border-radius:12px;overflow:hidden;box-shadow:0 14px 50px #000a}
.top{display:flex;align-items:center;gap:8px;padding:9px 14px;background:linear-gradient(90deg,var(--red),var(--red2));font-weight:600;font-size:14px;letter-spacing:.3px}
.top svg{width:16px;height:16px}
.top .x{margin-left:auto;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;cursor:pointer;background:#0004;font-size:13px}
.top .x:hover{background:#000a}
.body{padding:8px;display:flex;flex-direction:column;gap:8px}
.info{display:flex;align-items:center;gap:12px;padding:10px;background:var(--g3);border-radius:10px}
.ico{width:58px;height:58px;flex:none;display:grid;place-items:center;background:var(--g2);border:1px solid var(--red2);border-radius:9px}
.ico img{width:70%;height:70%;object-fit:contain}
.info h3{font-size:16px;font-weight:600;color:var(--red)}
.info p{font-size:10px;color:var(--mu);margin-top:2px}
.pill{margin-left:auto;white-space:nowrap;padding:5px 12px;border-radius:14px;background:var(--g2);border:1px solid var(--gl);font-size:11px}
.pill b{color:var(--tx);font-weight:600;margin:0 3px}
.ctl{display:flex;gap:6px;align-items:stretch}
.qty{flex:1;display:flex;align-items:center;background:var(--g3);border-radius:8px;overflow:hidden}
.qty button{border:0;background:var(--gl);color:var(--tx);font:600 11px Kanit,sans-serif;padding:0 10px;height:100%;cursor:pointer}
.qty button:hover{background:var(--red2)}
.qty input{flex:1;min-width:0;width:100%;text-align:center;background:transparent;border:0;outline:0;color:var(--tx);font:500 13px Kanit,sans-serif;user-select:text}
.qty input::-webkit-inner-spin-button{display:none}
.btn{border:0;border-radius:8px;padding:9px 14px;font:500 13px Kanit,sans-serif;color:#fff;cursor:pointer;white-space:nowrap}
.btn.cc{background:var(--gl)}.btn.cc:hover{background:#55565d}
.btn.go{background:linear-gradient(180deg,var(--red),var(--red2))}.btn.go:hover{filter:brightness(1.2)}
.btn[disabled]{opacity:.45;pointer-events:none}
.box{background:var(--g3);border-radius:10px;overflow:hidden}
.bh{display:flex;align-items:baseline;gap:8px;padding:8px 12px;background:var(--g2)}
.bh b{color:var(--red);font-size:13px;font-weight:600}.bh span{font-size:9px;color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px}
.c{position:relative;height:84px;border-radius:9px;background:var(--g2);border:1px solid var(--red2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.c svg{width:34px;height:34px}
.c .n{font-size:11px;font-weight:500}
.c .r{font-size:9px;color:var(--mu)}
.c.m svg{color:#62d27a}
.c.car{grid-column:span 2;border-color:var(--gold);background:linear-gradient(180deg,#2e2417,var(--g2))}
.c.car svg{color:var(--gold);width:46px;height:34px}
.c.car .n{color:var(--gold)}
.c.hit{border-color:var(--red);box-shadow:0 0 14px #e0243a99;background:#3a1a20}
.c.car.hit{border-color:var(--gold);box-shadow:0 0 16px #ffc83daa}
.c.won{animation:pop .5s ease 2}
@keyframes pop{50%{transform:scale(1.08)}}
.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#000a;border-radius:12px;z-index:5}
.ov.on{display:flex}
.res{width:280px;background:var(--g1);border:1px solid var(--red);border-radius:12px;padding:14px;text-align:center;box-shadow:0 8px 30px #000c}
.res h4{font-size:15px;color:var(--red);margin-bottom:8px}
.res .l{display:flex;justify-content:space-between;font-size:12px;padding:4px 8px;background:var(--g3);border-radius:6px;margin-bottom:4px}
.res .l.car{color:var(--gold);border:1px solid var(--gold)}
.res .t{font-size:12px;color:var(--mu);margin:8px 0 10px}.res .t b{color:#62d27a}
.res .big{color:var(--gold);font-weight:600;font-size:13px;margin-bottom:6px}
</style></head><body>
<div id="app"><div class="wrap">
 <div class="win">
  <div class="top"><svg viewBox="0 0 20 20"><path d="M10 1l8 4v10l-8 4-8-4V5z" fill="#fff"/><path d="M10 10L2 5M10 10l8-5M10 10v9" stroke="#8e1423" stroke-width="1.4" fill="none"/></svg>เปิดใช้งาน กาชาปองสายเติม<div class="x" id="close">&#10005;</div></div>
  <div class="body">
   <div class="info">
    <div class="ico"><img id="gi" src="items/gacha_topup.png" onerror="this.onerror=null;this.src=PH"></div>
    <div><h3>กาชาปองสายเติม</h3><p>ประเภทสุ่มของที่ได้รับ</p></div>
    <div class="pill">มีอยู่<b id="cnt">0</b>ชิ้น</div>
   </div>
   <div class="ctl">
    <div class="qty"><button id="min">MIN</button><input id="q" type="number" value="1" min="1"><button id="max">MAX</button></div>
    <button class="btn cc" id="cancel">ยกเลิก</button>
    <button class="btn go" id="go">เริ่มสุ่ม</button>
   </div>
   <div class="box">
    <div class="bh"><b>รางวัลทั้งหมด</b><span>โอกาสสุ่มของแต่ละรางวัล</span></div>
    <div class="grid" id="grid"></div>
   </div>
  </div>
 </div>
 <div class="ov" id="ov"><div class="res" id="res"></div></div>
</div></div>
<script>
// ต้องตรงกับฝั่งเซิร์ฟเวอร์ (ms_gacha_topup.inc): index 0-3 = เงินสุ่มง่าย, 4-5 = ปานกลาง, 6 = รถ
const R=[
 {n:"$2,000",t:"m",r:17.5},{n:"$3,000",t:"m",r:17.5},{n:"$4,000",t:"m",r:17.5},{n:"$5,000",t:"m",r:17.5},
 {n:"$6,000",t:"m",r:12.5},{n:"$7,000",t:"m",r:12.5},
 {n:"รถ EVO (ID 405)",t:"car",r:5}
];
const VAL=[2000,3000,4000,5000,6000,7000,0];
const MAXBATCH=50;
const PH="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><rect x="6" y="6" width="36" height="36" rx="9" fill="#2c2d31" stroke="#e0243a" stroke-width="2"/><path d="M24 13l9 11-9 11-9-11z" fill="#e0243a"/></svg>');
const MONEY='<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="9" width="26" height="14" rx="2"/><circle cx="16" cy="16" r="3.5"/><path d="M7 12v.1M25 20v.1" stroke-linecap="round"/></svg>';
const CAR='<svg viewBox="0 0 48 32" fill="currentColor"><path d="M6 20l4-8c.6-1.2 1.8-2 3.2-2h17c1.2 0 2.3.6 3 1.600L38 18l4 1.500c1 .4 1.600 1.300 1.600 2.400V24c0 .6-.4 1-1 1h-2.100a5 5 0 0 0-9.800 0H17.300a5 5 0 0 0-9.800 0H5c-.6 0-1-.4-1-1v-2.500c0-.6.8-1.300 2-1.500zm9-8l-3 6h9v-6zm12 0v6h8l-3.500-5.200c-.4-.5-.9-.8-1.500-.8z"/><circle cx="12.500" cy="25" r="3.200"/><circle cx="35.500" cy="25" r="3.200"/></svg>';
const $=id=>document.getElementById(id);
let count=0,busy=false,sp=null,t0=0,pending=null,K=1,ct,guard;
const fmt=n=>n.toLocaleString("en-US");
function fit(){const w=document.querySelector(".wrap");K=Math.min(1,(innerHeight-12)/w.offsetHeight,(innerWidth-12)/w.offsetWidth);w.style.setProperty("--k",K)}
const send=(e,v)=>{try{cef.emit(e,v)}catch(_){console.log(e,v);if(location.hash=="#preview")fake(e,v)}};
function drawGrid(){
 $("grid").innerHTML=R.map((o,i)=>`<div class="c ${o.t=="car"?"car":"m"}" data-i="${i}">${o.t=="car"?CAR:MONEY}<span class="n">${o.n}</span><span class="r">${o.r}%</span></div>`).join("");
}
function mark(i){document.querySelectorAll(".c").forEach(el=>el.classList.toggle("hit",+el.dataset.i==i))}
function maxQ(){return Math.max(1,Math.min(count,MAXBATCH))}
function setQ(v){v=Math.floor(+v)||1;$("q").value=Math.max(1,Math.min(v,maxQ()))}
function setCount(c){count=Math.max(0,+c||0);$("cnt").textContent=count;setQ($("q").value);$("go").disabled=busy||count<1}
const openUI=()=>{clearTimeout(ct);$("app").classList.remove("out");$("app").classList.add("on");fit()};
const closeUI=()=>{if(!$("app").classList.contains("on"))return;stopSpin();$("ov").classList.remove("on");$("app").classList.add("out");ct=setTimeout(()=>$("app").classList.remove("on","out"),180)};
function stopSpin(){clearInterval(sp);sp=null;busy=false;pending=null;clearTimeout(guard);mark(-1);$("go").disabled=count<1}
function start(){
 if(busy||count<1)return;
 setQ($("q").value);busy=true;pending=null;t0=Date.now();$("go").disabled=true;
 let i=0;sp=setInterval(()=>mark(i++%R.length),80);
 guard=setTimeout(stopSpin,6000); // เซิร์ฟเวอร์ไม่ตอบ ปลดล็อกปุ่ม
 send("gacha:start",$("q").value);
}
function showResult(list,left){
 clearTimeout(guard);
 const wait=Math.max(0,1300-(Date.now()-t0));
 setTimeout(()=>{
  clearInterval(sp);sp=null;
  const got=list.filter(x=>x[1]>0);
  const best=got.length?Math.max(...got.map(x=>x[0])):0;
  mark(best);
  const el=document.querySelector(`.c[data-i="${best}"]`);if(el)el.classList.add("won");
  let total=0,n=0,car=0,h="";
  got.forEach(([i,c])=>{n+=c;if(i==6)car=c;else total+=VAL[i]*c});
  h+=car?'<h4>ยินดีด้วย!</h4><div class="big">คุณได้รับรถ EVO x'+car+'</div>':'<h4>ผลการสุ่ม</h4>';
  got.sort((a,b)=>b[0]-a[0]).forEach(([i,c])=>{h+=`<div class="l ${i==6?"car":""}"><span>${R[i].n}</span><span>x${c}</span></div>`});
  h+=`<div class="t">เปิด ${n} ชิ้น | ได้เงินรวม <b>$${fmt(total)}</b></div><button class="btn go" id="okb">ตกลง</button>`;
  $("res").innerHTML=h;$("ov").classList.add("on");
  $("okb").onclick=()=>{$("ov").classList.remove("on");if(el)el.classList.remove("won");stopSpin();setCount(left)};
  busy=false;
 },wait);
}
$("min").onclick=()=>setQ(1);
$("max").onclick=()=>setQ(maxQ());
$("q").addEventListener("change",()=>setQ($("q").value));
$("go").onclick=start;
$("cancel").onclick=()=>send("gacha:close","");
$("close").onclick=()=>send("gacha:close","");
addEventListener("keydown",e=>{if(e.key=="Escape"&&!busy)send("gacha:close","")});
const A=(a,b)=>{if(typeof a=="string"&&a[0]=="[")try{a=JSON.parse(a)}catch(_){}return Array.isArray(a)?a:[a,b]};
let bound=false;
function bind(){
 if(bound)return true;
 if(!window.cef||!cef.on)return false;
 cef.on("gacha:open",(a,b)=>{const x=A(a,b);stopSpin();$("ov").classList.remove("on");$("q").value=1;setCount(x[0]);openUI()});
 cef.on("gacha:count",(a,b)=>setCount(A(a,b)[0]));
 cef.on("gacha:result",(a,b)=>{ // ["idx:จำนวน,idx:จำนวน","คงเหลือ"]
  const x=A(a,b);
  const list=String(x[0]||"").split(",").filter(Boolean).map(s=>s.split(":").map(Number));
  showResult(list,+x[1]||0);
 });
 cef.on("gacha:close",closeUI);
 return bound=true;
}
if(!bind()){const iv=setInterval(()=>{if(bind())clearInterval(iv)},100);addEventListener("load",bind)}
addEventListener("resize",fit);
drawGrid();
// โหมดตัวอย่างนอกเกม: เปิดไฟล์ด้วย #preview
function fake(e,v){
 if(e=="gacha:close"){closeUI();setTimeout(()=>{setCount(count);openUI()},900)}
 if(e=="gacha:start"){
  const n=Math.min(+v,count),o={};
  for(let k=0;k<n;k++){const r=Math.random()*100;const i=r<5?6:r<30?4+(Math.random()<.5):Math.floor(Math.random()*4);o[i]=(o[i]||0)+1}
  count-=n;
  showResult(Object.entries(o).map(([i,c])=>[+i,c]),count);
 }
}
if(location.hash=="#preview"){setCount(10);openUI()}
</script></body></html>
