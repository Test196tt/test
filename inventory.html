<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inventory</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bl:#00a000;--bl2:#006b00;--bl3:#22f022;--grad:linear-gradient(90deg,#00a000,#22f022);--gradv:linear-gradient(180deg,#22f022,#00a000);--g0:#202020;--g1:#272727;--g2:#2d2d2d;--tx:#f2f2f2;--mu:#a4a4a4}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:transparent;font-family:Kanit,"Noto Sans Thai",Tahoma,sans-serif;color:var(--tx);overflow:hidden;user-select:none}
#app{display:none;position:fixed;inset:0;align-items:center;justify-content:center}
#app.on{display:flex}
.wrap{transform:scale(var(--k,1))}
#app.on .wrap{animation:inIn .24s cubic-bezier(.2,.9,.3,1.1) both}
#app.out .wrap{animation:inOut .18s ease-in both}
@keyframes inIn{from{opacity:0;transform:translateY(20px) scale(calc(var(--k,1)*.95))}to{opacity:1;transform:scale(var(--k,1))}}
@keyframes inOut{to{opacity:0;transform:translateY(12px) scale(calc(var(--k,1)*.97))}}
@media(prefers-reduced-motion:reduce){#app .wrap{animation:none!important}}
.wrap{position:relative;display:grid;grid-template-columns:62px 372px;gap:6px;align-items:stretch}

/* ---- คีย์ลัด 7 ช่อง (ซ้าย) ---- */
.side{display:flex;flex-direction:column;gap:5px;padding:5px;background:var(--g0);border-radius:12px;filter:drop-shadow(0 10px 24px #000a)}
.h{position:relative;flex:1;min-height:50px;background:var(--g0);border:1px solid var(--g2);border-radius:9px;display:grid;place-items:center;cursor:pointer;overflow:hidden}
.h:hover,.h.on{border-color:var(--bl)}
.h .p{color:#3b3b3b;font-size:30px;font-weight:600;line-height:1}
.h img{width:60%;height:60%;object-fit:contain;pointer-events:none}
.h em{position:absolute;top:0;left:0;width:26px;height:26px;background:var(--bl);clip-path:polygon(0 0,100% 0,0 100%);
  font:700 11px/16px Kanit,sans-serif;font-style:normal;padding-left:6px;color:#fff}

/* ---- แผงหลัก ---- */
.win{filter:drop-shadow(0 10px 24px #000a)}
.in{background:var(--g0);border-radius:12px;overflow:hidden;
  clip-path:polygon(0 0,calc(100% - 40px) 0,calc(100% - 30px) 14px,100% 14px,100% 100%,0 100%)}
.top{display:flex;align-items:center;gap:9px;padding:10px 14px 4px}
.lg{height:36px;display:flex;align-items:center;flex:none}
.lg img{height:100%;width:auto;display:block}
.tt{display:flex;flex-direction:column;line-height:1.05}
.tt b{font-size:14px;font-weight:600;letter-spacing:.6px}
.tt span{font-size:8px;font-weight:500;color:var(--mu);letter-spacing:.7px}
.top .x{margin:14px 6px 0 auto;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;cursor:pointer;background:var(--g2);color:var(--mu);font-size:12px}
.top .x:hover{background:var(--bl);color:#fff}
.body{padding:6px 10px 10px}
.gw{display:flex;gap:6px}
.grid{flex:1;min-width:0;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;height:349px;overflow-y:hidden}
.s{position:relative;height:54px;background:var(--g0);border:1px solid var(--g1);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;touch-action:none}
.s:hover{border-color:var(--bl2)}
.s.sel{border-color:var(--bl);box-shadow:0 0 10px #00a00066}
.s img{width:28px;height:28px;object-fit:contain;pointer-events:none;margin-top:6px}
.s .q{position:absolute;top:3px;width:100%;text-align:center;font-size:8.5px;font-weight:600;color:#fff;letter-spacing:.3px}
.s .n{font-size:8.5px;margin-top:1px;max-width:94%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#e8e8e8}
.s.m{border-color:#00a00055;background:linear-gradient(180deg,#032a06,var(--g0))}
.s.e{cursor:default}.s.e:hover{border-color:var(--g1)}

/* แถบเลื่อนฟ้าด้านขวา */
.sb{width:12px;display:flex;flex-direction:column;align-items:center;gap:3px}
.a{width:12px;height:12px;display:grid;place-items:center;color:var(--bl);cursor:pointer;font-size:9px;line-height:1}.a:hover{color:var(--bl3)}
.trk{position:relative;flex:1;width:3px;background:#161616;border-radius:2px}
.th{position:absolute;left:0;right:0;top:0;height:30px;background:var(--gradv);border-radius:2px}

.wt{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 2px 0;font-size:11px;color:var(--mu)}
.bar{width:150px;height:5px;background:#161616;border-radius:3px;overflow:hidden}.bar div{height:100%;background:var(--grad);width:0}
.btn{background:var(--grad);color:#fff;border:0;border-radius:6px;padding:6px 16px;font:500 12px Kanit,sans-serif;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.15)}
.pop{position:absolute;z-index:5;display:none;padding:4px;background:var(--g0);border:1px solid var(--bl);border-radius:9px;box-shadow:0 6px 20px #000a}
.pop.on{display:flex}
.ghost{position:fixed;z-index:20;width:46px;height:46px;margin:-23px 0 0 -23px;pointer-events:none;opacity:.9;filter:drop-shadow(0 4px 8px #000a)}
</style></head><body>

const SFX={on:true,vol:.5};   // on=false ปิดเสียงทั้งหมด, vol 0-1 ปรับความดัง
let ac,nb;
function actx(){
 if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(_){return null}}
 if(ac.state==="suspended")ac.resume().catch(()=>{});
 return ac;
}
function noise(c){
 if(!nb){nb=c.createBuffer(1,c.sampleRate*.5,c.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
 return nb;
}
function whoosh(up){ // เสียงลมวูบ: เปิด = ไล่ความถี่ขึ้น, ปิด = ไล่ลง
 const c=actx();if(!c)return;const t=c.currentTime,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
 s.buffer=noise(c);f.type="bandpass";f.Q.value=1.1;
 f.frequency.setValueAtTime(up?450:2600,t);f.frequency.exponentialRampToValueAtTime(up?2800:380,t+.24);
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(SFX.vol*.55,t+.06);g.gain.exponentialRampToValueAtTime(.001,t+.28);
 s.connect(f);f.connect(g);g.connect(c.destination);s.start(t);s.stop(t+.3);
}
function tone(f1,f2,dur,type,v,delay){ // เสียงคลิก/ติ๊ก
 const c=actx();if(!c)return;const t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();
 o.type=type||"sine";o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);
 g.gain.setValueAtTime(SFX.vol*v,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
 o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.02);
}
const SND={
 open(){whoosh(true);tone(880,1320,.08,"sine",.28,.14)},
 close(){whoosh(false);tone(520,360,.07,"sine",.2,.02)},
 sel(){tone(1300,1100,.035,"triangle",.2)},
 hot(){tone(700,1150,.1,"sine",.3);tone(1150,1500,.08,"sine",.18,.07)},

};

function fit(){

}
function place(){
 const p=$("pop"),el=sel>=0&&$("grid").querySelector(`[data-s="${sel}"]`);
 if(!el){p.classList.remove("on");return}
 const r=el.getBoundingClientRect(),g=$("grid").getBoundingClientRect(),w=document.querySelector(".wrap").getBoundingClientRect();
 if(r.top<g.top-2||r.bottom>g.bottom+2){p.classList.remove("on");return}
 p.classList.add("on");
 const pw=p.offsetWidth*K,ph=p.offsetHeight*K,left=r.right+6*K+pw>g.right+40*K?r.left-pw-6*K:r.right+6*K;
 p.style.left=((left-w.left)/K)+"px";p.style.top=((r.top-w.top+(r.height-ph)/2)/K)+"px";
}
let gridKey="";

function draw(){

const hAt=(x,y)=>{const el=document.elementFromPoint(x,y);return el&&el.closest("[data-h]")};
$("grid").addEventListener("pointerdown",e=>{const s=e.target.closest("[data-s]");if(s&&e.button==0)drag={s:+s.dataset.s,x:e.clientX,y:e.clientY,g:null,h:null}});
document.addEventListener("pointermove",e=>{
 if(!drag)return;
 if(!drag.g){
  if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<6)return;
  const it=items.find(o=>o.s==drag.s);if(!it)return;
  drag.g=document.createElement("div");drag.g.className="ghost";drag.g.innerHTML=img(it.i);document.body.appendChild(drag.g);
  sel=drag.s;$("pop").classList.remove("on");
 }
 drag.g.style.left=e.clientX+"px";drag.g.style.top=e.clientY+"px";
 const h=hAt(e.clientX,e.clientY);
 if(h!==drag.h){if(drag.h)drag.h.classList.remove("on");if(h)h.classList.add("on");drag.h=h}
});
document.addEventListener("pointerup",e=>{
 if(!drag)return;
 const d=drag;drag=null;
 if(!d.g)return;
 d.g.remove();if(d.h)d.h.classList.remove("on");
 const h=hAt(e.clientX,e.clientY);
 if(h)send("inv:hotkey",d.s+"|"+h.dataset.h);
 skip=true;setTimeout(()=>skip=false,0);draw();
});
document.addEventListener("pointercancel",()=>{if(drag){if(drag.g)drag.g.remove();if(drag.h)drag.h.classList.remove("on");drag=null;draw()}});
document.addEventListener("click",e=>{
 if(skip||e.target.closest(".a"))return;
 const s=e.target.closest("[data-s]"),h=e.target.closest("[data-h]");
 if(s){sel=+s.dataset.s;play("sel")}
 else if(h&&sel>=0)send("inv:hotkey",sel+"|"+h.dataset.h);
 else if(!e.target.closest(".pop"))sel=-1;
 draw();
});
document.addEventListener("dblclick",e=>{const s=e.target.closest("[data-s]");if(s)send("inv:use",s.dataset.s)});
$("use").onclick=()=>{if(sel>=0)send("inv:use",String(sel))};
$("grid").addEventListener("scroll",()=>{place();arrows()});
$("close").onclick=()=>send("inv:close","");
$("up").onclick=()=>$("grid").scrollBy({top:-63,behavior:"smooth"});
$("dn").onclick=()=>$("grid").scrollBy({top:63,behavior:"smooth"});
$("grid").addEventListener("wheel",e=>{$("grid").scrollBy({top:e.deltaY>0?63:-63,behavior:"smooth"})});
addEventListener("keydown",e=>{if(e.key=="Escape")send("inv:close","")});
// รับจากเซิร์ฟเวอร์: items = "slot:index:qty;..."  hotkeys = "idx,idx,..." (-1 = ว่าง)
function load(a,b){
 items=(a||"").split(";").filter(Boolean).map(r=>{const p=r.split(":");return{s:+p[0],i:Math.min(+p[1],IT.length-1),q:+p[2]}});
 hot=(b||"").split(",").map(Number);
 if(!items.some(o=>o.s==sel))sel=-1;
 draw();
}
const arg=(a,b)=>{if(typeof a=="string"&&a[0]=="[")try{a=JSON.parse(a)}catch(_){}if(Array.isArray(a)){b=a[1];a=a[0]}return[a,b]};
let bound=false;
function bind(){
 if(bound)return true;
 if(!window.cef||!cef.on)return false;
 cef.on("inv:open",(a,b)=>{load(...arg(a,b));openUI()});
 cef.on("inv:update",(a,b)=>load(...arg(a,b)));
 cef.on("inv:close",closeUI);
 return bound=true;
}
if(!bind()){const iv=setInterval(()=>{if(bind())clearInterval(iv)},100);addEventListener("load",bind)}
addEventListener("resize",fit);
