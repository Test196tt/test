<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inventory</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--g:#13c455;--g2:#0e9a42;--g3:#52e88a;--tx:#f2f2f2;--mu:#a4a4a4;--pn:rgba(14,15,13,.80);--ln:rgba(0,0,0,.38)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:transparent;font-family:Kanit,"Noto Sans Thai",Tahoma,sans-serif;color:var(--tx);overflow:hidden;user-select:none}
#app{display:none;position:fixed;inset:0;align-items:center;justify-content:center}
#app.on{display:flex}
.wrap{transform:scale(var(--k,1))}
#app.on .wrap{animation:inIn .24s cubic-bezier(.2,.9,.3,1.1) both}
#app.out .wrap{animation:inOut .18s ease-in both}
@keyframes inIn{from{opacity:0;transform:translateY(20px) scale(calc(var(--k,1)*.95))}to{opacity:1;transform:scale(var(--k,1))}}
@keyframes inOut{to{opacity:0;transform:translateY(12px) scale(calc(var(--k,1)*.97))}}
@media(prefers-reduced-motion:reduce){#app .wrap{animation:none!important}}
.wrap{position:relative;display:grid;grid-template-columns:64px 480px;gap:12px;align-items:stretch}

/* ---- คีย์ลัด 7 ช่อง (ซ้าย) ---- */
.side{display:flex;flex-direction:column;background:var(--pn);border-radius:8px;overflow:hidden;filter:drop-shadow(0 10px 24px #0008)}
.h{position:relative;flex:1;border-bottom:1px solid var(--ln);display:grid;place-items:center;cursor:pointer}
.h:last-child{border-bottom:0}
.h:hover,.h.on{background:rgba(19,196,85,.16)}
.h b{position:absolute;top:6px;left:8px;font-size:10px;font-weight:500;color:#d0d0d0}
.h img{width:56%;height:56%;object-fit:contain;pointer-events:none}

/* ---- แผงหลัก ---- */
.win{filter:drop-shadow(0 10px 24px #0008)}
.in{border-radius:8px;overflow:hidden;background:var(--pn)}
.top{display:flex;align-items:center;gap:14px;padding:12px 14px;background:var(--g);color:#fff}
.top>svg{width:20px;height:20px;flex:none}
.tt{display:flex;flex-direction:column;line-height:1.1;margin-right:auto}
.tt b{font-size:15px;font-weight:600;letter-spacing:1.3px}
.tt span{font-size:11px;font-weight:400;opacity:.85;margin-top:3px}
.x{width:26px;height:26px;display:grid;place-items:center;cursor:pointer;margin-left:2px}
.x svg{width:20px;height:20px}.x:hover{transform:scale(1.12)}
.body{position:relative}
.gw{display:flex;position:relative}
.grid{flex:1;min-width:0;display:grid;grid-template-columns:repeat(6,1fr);height:432px;overflow-y:hidden;margin-right:10px;
  background-image:linear-gradient(var(--ln) 1px,transparent 1px),linear-gradient(90deg,var(--ln) 1px,transparent 1px);background-size:100% 72px,calc(100%/6) 100%;background-position:0 -1px,-1px 0}
.s{position:relative;height:72px;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:none;border:1px solid transparent}
.s:hover{background:rgba(255,255,255,.07)}
.s.sel{background:rgba(19,196,85,.2);border-color:var(--g)}
.s img{width:38px;height:38px;object-fit:contain;pointer-events:none;margin-bottom:6px}
.s .q{position:absolute;top:4px;right:6px;font-size:9px;font-weight:600;color:#fff}
.s .n{position:absolute;left:4px;right:4px;bottom:4px;text-align:center;font-size:8.5px;color:#dcdcdc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s.m{background:rgba(19,196,85,.1)}
.s.e{cursor:default}.s.e:hover{background:none}

/* แถบเลื่อนสีเขียวขวาสุด */
.sb{position:absolute;right:2px;top:0;bottom:0;width:5px}
.a{display:none}
.trk{position:absolute;inset:0;width:5px}
.th{position:absolute;left:0;right:0;top:0;height:30px;background:var(--g);border-radius:3px}

.ft{display:flex;align-items:center;gap:14px;padding:0 14px;height:56px;background:rgba(20,21,19,.92)}
.srch{display:flex;align-items:center;gap:8px;width:190px;height:34px;padding:0 12px;background:rgba(0,0,0,.45);border-left:3px solid var(--g)}
.srch svg{width:15px;height:15px;flex:none;color:#ddd}
.srch input{flex:1;min-width:0;background:none;border:0;outline:0;color:#eee;font:500 11px Kanit,sans-serif;letter-spacing:.8px;text-transform:uppercase;user-select:text}
.srch input::placeholder{color:#aaa}
.wt{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:11px;font-weight:500;color:#ddd}
.wt svg{width:15px;height:15px;color:#ddd}
.bar{width:140px;height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}.bar div{height:100%;background:var(--g);width:0}
.btn{background:var(--g);color:#fff;border:0;border-radius:6px;padding:6px 16px;font:600 12px Kanit,sans-serif;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.12)}
.pop{position:absolute;z-index:5;display:none;padding:4px;background:#161715;border:1px solid var(--g);border-radius:8px;box-shadow:0 6px 20px #000a}
.pop.on{display:flex}
.ghost{position:fixed;z-index:20;width:46px;height:46px;margin:-23px 0 0 -23px;pointer-events:none;opacity:.9;filter:drop-shadow(0 4px 8px #000a)}
</style></head><body>
<div id="app"><div class="wrap">
 <div class="side" id="side"></div>
 <div class="win"><div class="in">
  <div class="top"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 3h6a1.5 1.5 0 0 1 1.5 1.5V7h-2V5h-5v2h-2V4.5A1.5 1.5 0 0 1 9 3z"/><path d="M3 9a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v3H3z"/><path d="M3 13.5h7V15h4v-1.5h7V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
   <div class="tt"><b>INVENTORY</b><span>ช่องเก็บของ</span></div>
   <div class="x" id="close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5l14 14M19 5L5 19"/></svg></div>
  </div>
  <div class="body">
   <div class="gw"><div class="grid" id="grid"></div>
    <div class="sb"><div class="a" id="up"></div><div class="trk"><div class="th" id="th"></div></div><div class="a" id="dn"></div></div></div>
   <div class="ft">
    <label class="srch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" placeholder="SEARCH" autocomplete="off"></label>
    <div class="wt"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 7a4 4 0 0 1 8 0h-2.2a1.8 1.8 0 0 0-3.6 0zM6 9h12l3 11H3z"/></svg><div class="bar"><div id="fill"></div></div><span id="cnt">0.0 / 50.0 KG</span></div>
   </div>
  </div>
 </div></div>
 <div class="pop" id="pop"><button class="btn" id="use">ใช้ไอเทม</button></div>
</div></div>
<script>
const IT=[["ไม่พบข้อมูล","item_0","u"],["ปูน","item_1","u"],["สายไฟ","item_2","u"],["องุ่น","item_3","f"],["แตงโม","item_4","f"],["ข้าว","item_5","f"],["เห็ด","item_6","f"],["แร่เหลือง","item_7","u"],["แร่เขียว","item_8","u"],["แร่ฟ้า","item_9","u"],["แร่แดง","item_10","u"],["แร่","item_11","u"],["สนับ","item_12","w"],["ไม้สนุ๊ก","item_13","w"],["ไม้เบสบอล","item_14","w"],["ไม้กอล์ฟ","item_15","w"],["คาตานะ","item_16","w"],["มีด","Ko","w"],["ไม้เบสบอลเทียร์2","item_14","w"],["ไม้เบสบอลเทียร์3","item_14","w"],["ไม้เบสบอลเทียร์4","item_14","w"],["ไม้เบสบอลเทียร์5","item_14","w"],["คาตานะเทียร์2","item_16","w"],["คาตานะเทียร์3","item_16","w"],["มีดเทียร์2","Ko","w"],["มีดเทียร์3","Ko","w"],["มีดเทียร์4","Ko","w"],["มือถือ","item_17","u"],["ตะกร้า","item_0","u"],["พิซซ่า","item_18","f"],["น้ำเปล่า","item_19","f"],["วิทยุ","reo","u"],["เกราะ","ga","u"],["aed","aed","u"],["แหวนแก๊ง","va","s"],["ยาปั้ม","ya","u"],["ปืนยิงสตั้น","te","w"],["Boombox","boom","u"],["ฉลาม","sar","u"],["อาหารฉลาม","ag","f"],["ฉลามโต","sar","u"],["โทเคนฮาโลวีน","hallo","u"],["แฟชั่นฟักทอง","funk","s"],["กุญแจตู้เซฟ","safekey","u"],["กุญแจตู้เซฟเทียร์2","safekey","u"],["กุญแจตู้เซฟเทียร์3","safekey","u"],["เงิน","money","m"],["เงินแดง","redmoney","m"],["กาชาปองสายฟรี","gacha_free","u"],["เบ็ดตกปลา","item_49","u"],["เหยื่อ","item_50","u"],["ปลาทู","item_51","u"],["ปลาเหลือง","item_52","u"],["ปลาส้ม","item_53","u"],["เต่า","item_54","u"],["ปลาฉลาม","item_55","u"],["กาชาปองสายเติม","gacha_topup","u"],["แฟชั่นวงเวทไฟ","firecircle","s"],["อุปกรณ์งัดตู้เซฟ","safekit","u"],["กัญชา","cannabis","u"]];
const MAXSLOT=40,IMG="items/",ROWS=5,PREVIEW=false;
const PH="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><rect x="6" y="6" width="36" height="36" rx="9" fill="#121212" stroke="#12b84f" stroke-width="2"/><path d="M24 13l9 11-9 11-9-11z" fill="#12b84f"/></svg>');
let items=[],hot=[],sel=-1,Q="";const MAXW=50,WSTACK=0.5; // น้ำหนักต่อ 1 ช่อง (กก.) ปรับได้

const fmt=n=>n>=1e9?(n/1e9).toFixed(2).replace(/\.?0+$/,"")+"B":n>=1e6?(n/1e6).toFixed(2).replace(/\.?0+$/,"")+"M":n.toLocaleString("en-US");
const isM=o=>IT[o.i][2]=="m";
const $=id=>document.getElementById(id);
const img=i=>`<img src="${IMG}${IT[i][1]}.png" onerror="this.onerror=null;this.src=PH">`;
// ---------- เสียง (สร้างด้วย Web Audio ไม่ต้องมีไฟล์) ----------
const SFX={on:true,vol:.5};   // on=false ปิดเสียงทั้งหมด, vol 0-1 ปรับความดัง
let ac,nb;
function actx(){
 if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(_){return null}}
 if(ac.state==="suspended")ac.resume().catch(()=>{});
 return ac;
}
function noise(c){
 if(!nb){nb=c.createBuffer(1,c.sampleRate*.5,c.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
 return nb;
}
function whoosh(up){ // เสียงลมวูบ: เปิด = ไล่ความถี่ขึ้น, ปิด = ไล่ลง
 const c=actx();if(!c)return;const t=c.currentTime,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
 s.buffer=noise(c);f.type="bandpass";f.Q.value=1.1;
 f.frequency.setValueAtTime(up?450:2600,t);f.frequency.exponentialRampToValueAtTime(up?2800:380,t+.24);
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(SFX.vol*.55,t+.06);g.gain.exponentialRampToValueAtTime(.001,t+.28);
 s.connect(f);f.connect(g);g.connect(c.destination);s.start(t);s.stop(t+.3);
}
function tone(f1,f2,dur,type,v,delay){ // เสียงคลิก/ติ๊ก
 const c=actx();if(!c)return;const t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();
 o.type=type||"sine";o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);
 g.gain.setValueAtTime(SFX.vol*v,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
 o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.02);
}
const SND={
 open(){whoosh(true);tone(880,1320,.08,"sine",.28,.14)},
 close(){whoosh(false);tone(520,360,.07,"sine",.2,.02)},
 sel(){tone(1300,1100,.035,"triangle",.2)},
 hot(){tone(700,1150,.1,"sine",.3);tone(1150,1500,.08,"sine",.18,.07)},
 use(){tone(620,940,.09,"triangle",.28)}
};
const play=n=>{if(SFX.on)try{SND[n]()}catch(_){}};
document.addEventListener("pointerdown",()=>actx(),{once:true}); // ปลดล็อกเสียงเมื่อแตะครั้งแรก
let ct;
const openUI=()=>{play("open");clearTimeout(ct);$("app").classList.remove("out");$("app").classList.add("on");fit()};
const closeUI=()=>{if(!$("app").classList.contains("on"))return;play("close");sel=-1;place();$("app").classList.add("out");ct=setTimeout(()=>$("app").classList.remove("on","out"),180)};
const send=(e,v)=>{if(e=="inv:hotkey")play("hot");else if(e=="inv:use")play("use");try{cef.emit(e,v)}catch(_){console.log(e,v);if(PREVIEW&&e=="inv:close"){closeUI();setTimeout(openUI,900)}}};
const hslot=k=>`<div class="h" data-h="${k}"><b>${k}</b>${hot[k-1]>=0?img(hot[k-1]):''}</div>`;
let K=1;
function fit(){
 const w=document.querySelector(".wrap");
 K=Math.min(1,(innerHeight-12)/w.offsetHeight,(innerWidth-12)/w.offsetWidth);
 w.style.setProperty("--k",K);
}
function place(){
 const p=$("pop"),el=sel>=0&&$("grid").querySelector(`[data-s="${sel}"]`);
 if(!el){p.classList.remove("on");return}
 const r=el.getBoundingClientRect(),g=$("grid").getBoundingClientRect(),w=document.querySelector(".wrap").getBoundingClientRect();
 if(r.top<g.top-2||r.bottom>g.bottom+2){p.classList.remove("on");return}
 p.classList.add("on");
 const pw=p.offsetWidth*K,ph=p.offsetHeight*K,left=r.right+6*K+pw>g.right+40*K?r.left-pw-6*K:r.right+6*K;
 p.style.left=((left-w.left)/K)+"px";p.style.top=((r.top-w.top+(r.height-ph)/2)/K)+"px";
}
let gridKey="";
const arrows=()=>{
 const g=$("grid"),th=$("th"),h=th.parentNode.clientHeight,over=g.scrollHeight>g.clientHeight+1;
 $("up").style.opacity=g.scrollTop<=1?.3:1;$("dn").style.opacity=g.scrollTop+g.clientHeight>=g.scrollHeight-1?.3:1;
 th.style.display=over?"block":"none";
 if(over){const th_h=Math.max(18,g.clientHeight/g.scrollHeight*h);th.style.height=th_h+"px";th.style.top=(g.scrollTop/(g.scrollHeight-g.clientHeight)*(h-th_h))+"px"}
};
function draw(){
 const g=$("grid"),vis=items.filter(o=>!Q||IT[o.i][0].toLowerCase().includes(Q)),key=Q+"|"+vis.map(o=>o.s+":"+o.i+":"+o.q).join(";");
 if(key!==gridKey){ // สร้างตารางใหม่เฉพาะตอนข้อมูลเปลี่ยน ไม่งั้นการเลื่อนจะถูกรีเซ็ต
  gridKey=key;
  let h=vis.map(o=>`<div class="s ${o.s==sel?"sel":""}${isM(o)?" m":""}" data-s="${o.s}" title="${o.q}"><span class="q">${fmt(o.q)}</span>${img(o.i)}<span class="n">${IT[o.i][0]}</span></div>`).join("");
  if(!Q)for(let k=items.length;k<Math.max(MAXSLOT+items.filter(isM).length,36);k++)h+='<div class="s e"></div>';
  const st=g.scrollTop;g.innerHTML=h;g.scrollTop=st;
 }else g.querySelectorAll(".s[data-s]").forEach(el=>el.classList.toggle("sel",+el.dataset.s==sel));
 const used=items.filter(o=>!isM(o)).length; // เงิน/เงินแดงไม่นับเป็นช่อง
 const wt=Math.min(MAXW,used*WSTACK);$("cnt").textContent=wt.toFixed(1)+" / "+MAXW.toFixed(1)+" KG";$("fill").style.width=(wt/MAXW*100)+"%";
 $("side").innerHTML=[1,2,3,4,5,6,7].map(hslot).join("");
 arrows();place();
}
let drag=null,skip=false;
const hAt=(x,y)=>{const el=document.elementFromPoint(x,y);return el&&el.closest("[data-h]")};
$("grid").addEventListener("pointerdown",e=>{const s=e.target.closest("[data-s]");if(s&&e.button==0)drag={s:+s.dataset.s,x:e.clientX,y:e.clientY,g:null,h:null}});
document.addEventListener("pointermove",e=>{
 if(!drag)return;
 if(!drag.g){
  if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<6)return;
  const it=items.find(o=>o.s==drag.s);if(!it)return;
  drag.g=document.createElement("div");drag.g.className="ghost";drag.g.innerHTML=img(it.i);document.body.appendChild(drag.g);
  sel=drag.s;$("pop").classList.remove("on");
 }
 drag.g.style.left=e.clientX+"px";drag.g.style.top=e.clientY+"px";
 const h=hAt(e.clientX,e.clientY);
 if(h!==drag.h){if(drag.h)drag.h.classList.remove("on");if(h)h.classList.add("on");drag.h=h}
});
document.addEventListener("pointerup",e=>{
 if(!drag)return;
 const d=drag;drag=null;
 if(!d.g)return;
 d.g.remove();if(d.h)d.h.classList.remove("on");
 const h=hAt(e.clientX,e.clientY);
 if(h)send("inv:hotkey",d.s+"|"+h.dataset.h);
 skip=true;setTimeout(()=>skip=false,0);draw();
});
document.addEventListener("pointercancel",()=>{if(drag){if(drag.g)drag.g.remove();if(drag.h)drag.h.classList.remove("on");drag=null;draw()}});
document.addEventListener("click",e=>{
 if(skip||e.target.closest(".a"))return;
 const s=e.target.closest("[data-s]"),h=e.target.closest("[data-h]");
 if(s){sel=+s.dataset.s;play("sel")}
 else if(h&&sel>=0)send("inv:hotkey",sel+"|"+h.dataset.h);
 else if(!e.target.closest(".pop"))sel=-1;
 draw();
});
document.addEventListener("dblclick",e=>{const s=e.target.closest("[data-s]");if(s)send("inv:use",s.dataset.s)});
$("use").onclick=()=>{if(sel>=0)send("inv:use",String(sel))};
$("grid").addEventListener("scroll",()=>{place();arrows()});
$("q").oninput=e=>{Q=e.target.value.trim().toLowerCase();sel=-1;$("grid").scrollTop=0;draw()};
$("close").onclick=()=>send("inv:close","");
$("up").onclick=()=>$("grid").scrollBy({top:-72,behavior:"smooth"});
$("dn").onclick=()=>$("grid").scrollBy({top:72,behavior:"smooth"});
$("grid").addEventListener("wheel",e=>{$("grid").scrollBy({top:e.deltaY>0?72:-72,behavior:"smooth"})});
addEventListener("keydown",e=>{if(e.key=="Escape")send("inv:close","")});
// รับจากเซิร์ฟเวอร์: items = "slot:index:qty;..."  hotkeys = "idx,idx,..." (-1 = ว่าง)
function load(a,b){
 items=(a||"").split(";").filter(Boolean).map(r=>{const p=r.split(":");return{s:+p[0],i:Math.min(+p[1],IT.length-1),q:+p[2]}});
 hot=(b||"").split(",").map(Number);
 if(!items.some(o=>o.s==sel))sel=-1;
 draw();
}
const arg=(a,b)=>{if(typeof a=="string"&&a[0]=="[")try{a=JSON.parse(a)}catch(_){}if(Array.isArray(a)){b=a[1];a=a[0]}return[a,b]};
let bound=false;
function bind(){
 if(bound)return true;
 if(!window.cef||!cef.on)return false;
 cef.on("inv:open",(a,b)=>{load(...arg(a,b));openUI()});
 cef.on("inv:update",(a,b)=>load(...arg(a,b)));
 cef.on("inv:close",closeUI);
 return bound=true;
}
if(!bind()){const iv=setInterval(()=>{if(bind())clearInterval(iv)},100);addEventListener("load",bind)}
addEventListener("resize",fit);
if(PREVIEW||location.hash=="#preview"){ // โหมดตัวอย่างเฉพาะตอนเปิดดูนอกเกม
 load("1498:46:1250000;1499:47:80000;0:3:12;1:29:5;2:16:1;3:42:1;4:10:40;5:30:8;6:36:1;7:34:1;8:4:20;9:5:15;10:6:9;11:31:1;12:32:2;13:27:1;14:1:100;15:2:60;16:7:5;17:8:5;18:9:5;19:11:30;20:12:1;21:13:1;22:14:1;23:15:1;24:33:1;25:35:3;26:50:1;27:51:12;28:52:7;29:53:3;30:54:1;31:55:2;32:49:1;33:56:1","3,16,-1,42,-1,30,-1");openUI();
}
</script></body></html>
