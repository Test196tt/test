<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inventory</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--g1:#2c2d31;--g2:#222326;--g3:#17181a;--gl:#3d3e44;--red:#e0243a;--red2:#8e1423;--tx:#ececee;--mu:#9a9ca3}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:transparent;font-family:Kanit,"Noto Sans Thai",Tahoma,sans-serif;color:var(--tx);overflow:hidden;user-select:none}
#app{display:none;position:fixed;inset:0;align-items:center;justify-content:center}
#app.on{display:flex}
.wrap{transform:scale(var(--k,1))}
#app.on .wrap{animation:inIn .24s cubic-bezier(.2,.9,.3,1.1) both}
#app.out .wrap{animation:inOut .18s ease-in both}
@keyframes inIn{from{opacity:0;transform:translateY(20px) scale(calc(var(--k,1)*.95))}to{opacity:1;transform:scale(var(--k,1))}}
@keyframes inOut{to{opacity:0;transform:translateY(12px) scale(calc(var(--k,1)*.97))}}
@media(prefers-reduced-motion:reduce){#app .wrap{animation:none!important}}
.wrap{position:relative;display:grid;grid-template-columns:48px 360px 28px;gap:12px;align-items:start}
.side{display:flex;flex-direction:column;gap:5px;margin-top:34px}
.h{position:relative;width:44px;height:44px;background:var(--g2);border:1px solid var(--gl);border-radius:9px;display:grid;place-items:center;cursor:pointer}
.h:hover,.h.on{border-color:var(--red)}
.h .p{color:var(--red);font-size:22px;font-weight:300;line-height:1}
.h img{width:62%;height:62%;object-fit:contain;pointer-events:none}
.h em{position:absolute;top:-4px;left:-4px;min-width:18px;height:18px;padding:0 5px 0 4px;border-radius:9px 4px 9px 4px;background:var(--red);font:600 10px/18px Kanit,sans-serif;font-style:normal;text-align:center}
.win{background:var(--g1);border:1px solid var(--gl);border-radius:12px;overflow:hidden;box-shadow:0 14px 50px #000a}
.top{display:flex;align-items:center;gap:8px;padding:9px 14px;background:linear-gradient(90deg,var(--red),var(--red2));font-weight:600;font-size:14px;letter-spacing:.5px}
.top svg{width:20px;height:20px}.top .x{margin-left:auto;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;cursor:pointer;background:#0004;font-size:13px}
.top .x:hover{background:#000a}
.body{padding:8px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;height:310px;overflow-y:hidden}
.s{position:relative;height:58px;background:var(--g3);border:1px solid transparent;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.s{touch-action:none}.s:hover{border-color:var(--red2)}.s.sel{border-color:var(--red);box-shadow:0 0 12px #e0243a55}
.s img{width:30px;height:30px;object-fit:contain;pointer-events:none;margin-top:5px}
.s .q{position:absolute;top:3px;width:100%;text-align:center;font-size:9px;color:var(--mu)}
.s .n{font-size:9px;margin-top:1px;max-width:94%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s.e{cursor:default}.s.e:hover{border-color:transparent}
.btn{background:var(--red);color:#fff;border:0;border-radius:6px;padding:6px 16px;font:500 12px Kanit,sans-serif;cursor:pointer;white-space:nowrap}
.btn:hover{background:#ff3a50}
.pop{position:absolute;z-index:5;display:none;padding:4px;background:var(--g2);border:1px solid var(--red);border-radius:9px;box-shadow:0 6px 20px #000a}
.pop.on{display:flex}
.wt{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px 4px;font-size:11px;color:var(--mu)}
.bar{width:150px;height:5px;background:var(--g3);border-radius:3px;overflow:hidden}.bar div{height:100%;background:var(--red);width:0}
.ghost{position:fixed;z-index:20;width:46px;height:46px;margin:-23px 0 0 -23px;pointer-events:none;opacity:.9;filter:drop-shadow(0 4px 8px #000a)}
.arr{display:flex;flex-direction:column;justify-content:space-between;height:310px;margin-top:44px}
.a{width:28px;height:28px;display:grid;place-items:center;color:var(--red);cursor:pointer;font-size:18px}.a:hover{color:#ff5468}
.bot{grid-column:2;display:flex;justify-content:center;gap:8px}
</style></head><body>
<div id="app"><div class="wrap">
 <div class="side" id="side"></div>
 <div class="win">
  <div class="top"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2l3 7 7 .6-5.3 4.7L18.3 22 12 18.2 5.7 22l1.6-7.7L2 9.6 9 9z"/></svg>INVENTORY<div class="x" id="close">&#10005;</div></div>
  <div class="body">
   <div class="grid" id="grid"></div>
   <div class="wt"><span id="cnt">ช่องเก็บของ 0/30</span><div style="display:flex;align-items:center;gap:8px"><div class="bar"><div id="fill"></div></div></div></div>
  </div>
 </div>
 <div class="arr"><div class="a" id="up">&#9650;</div><div class="a" id="dn">&#9660;</div></div>
  <div class="pop" id="pop"><button class="btn" id="use">ใช้ไอเทม</button></div>
</div></div>
<script>
const IT=[["ไม่พบข้อมูล","item_0","u"],["ปูน","item_1","u"],["สายไฟ","item_2","u"],["องุ่น","item_3","f"],["แตงโม","item_4","f"],["ข้าว","item_5","f"],["เห็ด","item_6","f"],["แร่เหลือง","item_7","u"],["แร่เขียว","item_8","u"],["แร่ฟ้า","item_9","u"],["แร่แดง","item_10","u"],["แร่","item_11","u"],["สนับ","item_12","w"],["ไม้สนุ๊ก","item_13","w"],["ไม้เบสบอล","item_14","w"],["ไม้กอล์ฟ","item_15","w"],["คาตานะ","item_16","w"],["มีด","Ko","w"],["ไม้เบสบอลเทียร์2","item_14","w"],["ไม้เบสบอลเทียร์3","item_14","w"],["ไม้เบสบอลเทียร์4","item_14","w"],["ไม้เบสบอลเทียร์5","item_14","w"],["คาตานะเทียร์2","item_16","w"],["คาตานะเทียร์3","item_16","w"],["มีดเทียร์2","Ko","w"],["มีดเทียร์3","Ko","w"],["มีดเทียร์4","Ko","w"],["มือถือ","item_17","u"],["พิซซ่า","item_18","f"],["น้ำเปล่า","item_19","f"],["วิทยุ","reo","u"],["เกราะ","ga","u"],["aed","aed","u"],["แหวนแก๊ง","va","s"],["ยาปั้ม","ya","u"],["ปืนยิงสตั้น","te","w"],["Boombox","boom","u"],["ฉลาม","sar","u"],["อาหารฉลาม","ag","f"],["ฉลามโต","sar","u"],["โทเคนฮาโลวีน","hallo","u"],["แฟชั่นฟักทอง","funk","s"]];
const MAXSLOT=30,IMG="items/",ROWS=5,PREVIEW=false;
const PH="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><rect x="6" y="6" width="36" height="36" rx="9" fill="#2c2d31" stroke="#e0243a" stroke-width="2"/><path d="M24 13l9 11-9 11-9-11z" fill="#e0243a"/></svg>');
let items=[],hot=[],sel=-1;
const $=id=>document.getElementById(id);
const img=i=>`<img src="${IMG}${IT[i][1]}.png" onerror="this.onerror=null;this.src=PH">`;
let ct;
const openUI=()=>{clearTimeout(ct);$("app").classList.remove("out");$("app").classList.add("on");fit()};
const closeUI=()=>{if(!$("app").classList.contains("on"))return;sel=-1;place();$("app").classList.add("out");ct=setTimeout(()=>$("app").classList.remove("on","out"),180)};
const send=(e,v)=>{try{cef.emit(e,v)}catch(_){console.log(e,v);if(PREVIEW&&e=="inv:close"){closeUI();setTimeout(openUI,900)}}};
const hslot=k=>`<div class="h" data-h="${k}"><em>${k}</em>${hot[k-1]>=0?img(hot[k-1]):'<span class="p">+</span>'}</div>`;
let K=1;
function fit(){
 const w=document.querySelector(".wrap");
 K=Math.min(1,(innerHeight-12)/w.offsetHeight,(innerWidth-12)/w.offsetWidth);
 w.style.setProperty("--k",K);
}
function place(){
 const p=$("pop"),el=sel>=0&&$("grid").querySelector(`[data-s="${sel}"]`);
 if(!el){p.classList.remove("on");return}
 const r=el.getBoundingClientRect(),g=$("grid").getBoundingClientRect(),w=document.querySelector(".wrap").getBoundingClientRect();
 if(r.top<g.top-2||r.bottom>g.bottom+2){p.classList.remove("on");return}
 p.classList.add("on");
 const pw=p.offsetWidth*K,ph=p.offsetHeight*K,left=r.right+6*K+pw>g.right+40*K?r.left-pw-6*K:r.right+6*K;
 p.style.left=((left-w.left)/K)+"px";p.style.top=((r.top-w.top+(r.height-ph)/2)/K)+"px";
}
function draw(){
 let h=items.map(o=>`<div class="s ${o.s==sel?"sel":""}" data-s="${o.s}">${img(o.i)}<span class="q">${o.q}</span><span class="n">${IT[o.i][0]}</span></div>`).join("");
 for(let k=items.length;k<ROWS*5;k++)h+='<div class="s e"></div>';
 const st=$("grid").scrollTop;$("grid").innerHTML=h;$("grid").scrollTop=st;
 $("cnt").textContent="ช่องเก็บของ "+items.length+"/"+MAXSLOT;$("fill").style.width=Math.min(100,items.length/MAXSLOT*100)+"%";
 $("side").innerHTML=[1,2,3,4,5,6,7].map(hslot).join("");
 place();
}
let drag=null,skip=false;
const hAt=(x,y)=>{const el=document.elementFromPoint(x,y);return el&&el.closest("[data-h]")};
$("grid").addEventListener("pointerdown",e=>{const s=e.target.closest("[data-s]");if(s&&e.button==0)drag={s:+s.dataset.s,x:e.clientX,y:e.clientY,g:null,h:null}});
document.addEventListener("pointermove",e=>{
 if(!drag)return;
 if(!drag.g){
  if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<6)return;
  const it=items.find(o=>o.s==drag.s);if(!it)return;
  drag.g=document.createElement("div");drag.g.className="ghost";drag.g.innerHTML=img(it.i);document.body.appendChild(drag.g);
  sel=drag.s;$("pop").classList.remove("on");
 }
 drag.g.style.left=e.clientX+"px";drag.g.style.top=e.clientY+"px";
 const h=hAt(e.clientX,e.clientY);
 if(h!==drag.h){if(drag.h)drag.h.classList.remove("on");if(h)h.classList.add("on");drag.h=h}
});
document.addEventListener("pointerup",e=>{
 if(!drag)return;
 const d=drag;drag=null;
 if(!d.g)return;
 d.g.remove();if(d.h)d.h.classList.remove("on");
 const h=hAt(e.clientX,e.clientY);
 if(h)send("inv:hotkey",d.s+"|"+h.dataset.h);
 skip=true;setTimeout(()=>skip=false,0);draw();
});
document.addEventListener("pointercancel",()=>{if(drag){if(drag.g)drag.g.remove();if(drag.h)drag.h.classList.remove("on");drag=null;draw()}});
document.addEventListener("click",e=>{
 if(skip)return;
 const s=e.target.closest("[data-s]"),h=e.target.closest("[data-h]");
 if(s)sel=+s.dataset.s;
 else if(h&&sel>=0)send("inv:hotkey",sel+"|"+h.dataset.h);
 else if(!e.target.closest(".pop"))sel=-1;
 draw();
});
document.addEventListener("dblclick",e=>{const s=e.target.closest("[data-s]");if(s)send("inv:use",s.dataset.s)});
$("use").onclick=()=>{if(sel>=0)send("inv:use",String(sel))};
$("grid").addEventListener("scroll",place);
$("close").onclick=()=>send("inv:close","");
$("up").onclick=()=>$("grid").scrollBy({top:-63,behavior:"smooth"});
$("dn").onclick=()=>$("grid").scrollBy({top:63,behavior:"smooth"});
$("grid").addEventListener("wheel",e=>{$("grid").scrollBy({top:e.deltaY>0?63:-63,behavior:"smooth"})});
addEventListener("keydown",e=>{if(e.key=="Escape")send("inv:close","")});
// รับจากเซิร์ฟเวอร์: items = "slot:index:qty;..."  hotkeys = "idx,idx,..." (-1 = ว่าง)
function load(a,b){
 items=(a||"").split(";").filter(Boolean).map(r=>{const p=r.split(":");return{s:+p[0],i:Math.min(+p[1],IT.length-1),q:+p[2]}});
 hot=(b||"").split(",").map(Number);
 if(!items.some(o=>o.s==sel))sel=-1;
 draw();
}
const arg=(a,b)=>{if(typeof a=="string"&&a[0]=="[")try{a=JSON.parse(a)}catch(_){}if(Array.isArray(a)){b=a[1];a=a[0]}return[a,b]};
let bound=false;
function bind(){
 if(bound)return true;
 if(!window.cef||!cef.on)return false;
 cef.on("inv:open",(a,b)=>{load(...arg(a,b));openUI()});
 cef.on("inv:update",(a,b)=>load(...arg(a,b)));
 cef.on("inv:close",closeUI);
 return bound=true;
}
if(!bind()){const iv=setInterval(()=>{if(bind())clearInterval(iv)},100);addEventListener("load",bind)}
addEventListener("resize",fit);
if(PREVIEW||location.hash=="#preview"){ // โหมดตัวอย่างเฉพาะตอนเปิดดูนอกเกม
 load("0:3:12;1:28:5;2:16:1;3:41:1;4:10:40;5:29:8;6:35:1;7:33:1;8:4:20;9:5:15;10:6:9;11:30:1;12:31:2;13:27:1;14:1:100;15:2:60;16:7:5;17:8:5;18:9:5;19:11:30;20:12:1;21:13:1;22:14:1;23:15:1;24:32:1;25:34:3","3,16,-1,41,-1,29,-1");openUI();
}
</script></body></html>
