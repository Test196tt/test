<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>announce</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#1e6bff;
    --red-glow:rgba(30,107,255,.65);
    --bg:rgba(14,18,28,.88);
    --text:#ffffff;
    --grey:#9aa0a8;
  }
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;pointer-events:none;user-select:none}
  body{font-family:"Prompt","Sarabun","Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif}

  .wrap{position:fixed;left:0;right:0;top:20px;display:flex;justify-content:center;padding:0 24px}

  /* แคปซูลหลัก */
  .banner{
    --c:var(--red);--g:var(--red-glow);
    position:relative;display:flex;align-items:center;gap:14px;
    max-width:min(760px,90vw);min-height:34px;padding:6px 30px 6px 14px;
    background:var(--bg);border-radius:999px;
    box-shadow:0 4px 18px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.06);
    color:var(--text);font-size:13px;font-weight:500;line-height:1.35;letter-spacing:.2px;
    text-shadow:0 1px 2px rgba(0,0,0,.7);
    opacity:0;transform:translateY(-80px);
  }
  /* วงเล็บ ( ) ซ้าย-ขวา แบบในรูป */
  .banner::before,.banner::after{
    content:"";position:absolute;top:-3px;bottom:-3px;width:22px;
    border:3px solid var(--c);
    filter:drop-shadow(0 0 5px var(--g));
  }
  .banner::before{left:-8px;border-right:none;border-radius:999px 0 0 999px}
  .banner::after {right:-8px;border-left:none;border-radius:0 999px 999px 0}

  /* ไอคอนโทรโข่งในวงกลมเรืองแสง */
  .icon{flex:0 0 auto;width:66px;height:48px;margin:-14px 0 -14px 2px;display:grid;place-items:center;filter:drop-shadow(0 0 6px var(--g))}
  .icon img{max-width:100%;max-height:100%;object-fit:contain}
  .text{flex:1 1 auto;text-align:center;word-break:break-word}

  /* แอดมินประกาศ = น้ำเงินเรืองกะพริบ ; อัตโนมัติ = น้ำเงินนิ่ง (ธีมเดียวกัน) */
  .banner.admin::before,.banner.admin::after{animation:pulse 1.3s ease-in-out infinite}
  .banner.admin{box-shadow:0 4px 22px rgba(30,107,255,.28), 0 4px 18px rgba(0,0,0,.55), inset 0 0 0 1px rgba(30,107,255,.35)}
  .banner.auto{--c:#4d8fff;--g:rgba(77,143,255,.45)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

  .banner.in {animation:slideIn .5s cubic-bezier(.2,.9,.3,1) forwards}
  .banner.out{animation:slideOut .4s ease-in forwards}
  @keyframes slideIn {from{opacity:0;transform:translateY(-80px)}to{opacity:1;transform:translateY(0)}}
  @keyframes slideOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-80px)}}
</style>
</head>

<script>
(function () {
  var banner = document.getElementById('banner');
  var textEl = document.getElementById('text');
  var queue = [], busy = false;

  function next() {
    if (busy || !queue.length) return;
    busy = true;
    var m = queue.shift();
    textEl.textContent = m.text;
    banner.className = 'banner ' + (m.kind === 1 ? 'admin' : 'auto');
    void banner.offsetWidth;
    banner.classList.add('in');

    var hold = Math.min(12000, Math.max(5000, 2500 + m.text.length * 90));
    setTimeout(function () {
      banner.classList.remove('in');
      banner.classList.add('out');
      setTimeout(function () { busy = false; next(); }, 450);
    }, hold);
  }

  function show(text, kind) {
    if (Array.isArray(text)) { kind = text[1]; text = text[0]; }
    text = String(text == null ? '' : text).trim();
    if (!text) return;
    queue.push({ text: text, kind: Number(kind) === 1 ? 1 : 0 });
    next();
  }
  window.announceShow = show;

  function bind() {
    if (window.cef && typeof window.cef.on === 'function') {
      window.cef.on('announce:show', show);
      return true;
    }
    return false;
  }
  if (!bind()) {
    var t = setInterval(function () { if (bind()) clearInterval(t); }, 200);
  }
