<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hotbar</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--blue:#1d6fd0;--blue2:#15509b}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:transparent;overflow:hidden;font-family:Kanit,"Noto Sans Thai",Tahoma,sans-serif;user-select:none}
#hud{position:fixed;left:50%;bottom:8px;width:340px;height:60px;margin-left:-170px;transform-origin:50% 100%;transform:scale(var(--k,1))}
#in{position:absolute;inset:0;opacity:0;display:flex;gap:4px;padding:5px;background:linear-gradient(#1b1b1f,#0e0e11);border:2px solid var(--blue);border-radius:9px;box-shadow:0 0 0 1px #0008}
#in.on{animation:bIn .45s cubic-bezier(.2,.9,.3,1.1) both}
#in.off{animation:bOut .3s ease-in both}
.s{position:relative;flex:1;border-radius:6px;background:#2c2c2f;border:1px solid #3a3a3e;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;transition:transform .12s,border-color .12s}
.s:hover{border-color:var(--blue)}
.s.use{animation:pop .28s ease-out;border-color:#2aa8ff;box-shadow:0 0 10px #1d6fd066}
.s.empty .ic{opacity:0}
.k{position:absolute;left:0;top:0;width:18px;height:18px;background:linear-gradient(135deg,#2aa8ff,#1d6fd0);clip-path:polygon(0 0,100% 0,0 100%);color:#fff;font:600 9px/10px Kanit,sans-serif;padding:1px 0 0 3px}
.ic{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1;color:#e8e8ec;text-align:center;font-weight:500}
.ic img{max-width:78%;max-height:78%;object-fit:contain;pointer-events:none}
@keyframes bIn{from{opacity:0;transform:translateY(40px) scale(.85)}to{opacity:1;transform:none}}
@keyframes bOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(24px) scale(.9)}}
@keyframes pop{0%{transform:scale(1.18)}100%{transform:scale(1)}}
@media(prefers-reduced-motion:reduce){#in{animation:none!important}#in.on{opacity:1}}
</style></head><body>
<div id="hud"><div id="in"></div></div>
<script>
const PREVIEW=false;
const $=id=>document.getElementById(id);
const IMGBASE="items/"; // โฟลเดอร์รูปเดียวกับ inventory.html (ไฟล์ items/item_N.png)
const IMGMAP={"ไม่พบข้อมูล":"item_0","ปูน":"item_1","สายไฟ":"item_2","องุ่น":"item_3","แตงโม":"item_4","ข้าว":"item_5","เห็ด":"item_6","แร่เหลือง":"item_7","แร่เขียว":"item_8","แร่ฟ้า":"item_9","แร่แดง":"item_10","แร่":"item_11","สนับ":"item_12","ไม้สนุ๊ก":"item_13","ไม้เบสบอล":"item_14","ไม้กอล์ฟ":"item_15","คาตานะ":"item_16","มีด":"Ko","ไม้เบสบอลเทียร์2":"item_14","ไม้เบสบอลเทียร์3":"item_14","ไม้เบสบอลเทียร์4":"item_14","ไม้เบสบอลเทียร์5":"item_14","คาตานะเทียร์2":"item_16","คาตานะเทียร์3":"item_16","มีดเทียร์2":"Ko","มีดเทียร์3":"Ko","มีดเทียร์4":"Ko","มือถือ":"item_17","ตะกร้า":"item_0","พิซซ่า":"item_18","น้ำเปล่า":"item_19","วิทยุ":"reo","เกราะ":"ga","aed":"aed","แหวนแก๊ง":"va","ยาปั้ม":"ya","ปืนยิงสตั้น":"te","Boombox":"boom","ฉลาม":"sar","อาหารฉลาม":"ag","ฉลามโต":"sar","โทเคนฮาโลวีน":"hallo","แฟชั่นฟักทอง":"funk","กุญแจตู้เซฟ":"safekey","กุญแจตู้เซฟเทียร์2":"safekey","กุญแจตู้เซฟเทียร์3":"safekey","เงิน":"money","เงินแดง":"redmoney","กาชาปองสายฟรี":"gacha_free","เบ็ดตกปลา":"item_49","เหยื่อ":"item_50","ปลาทู":"item_51","ปลาเหลือง":"item_52","ปลาส้ม":"item_53","เต่า":"item_54","ปลาฉลาม":"item_55","กาชาปองสายเติม":"gacha_topup","แฟชั่นวงเวทไฟ":"firecircle","อุปกรณ์งัดตู้เซฟ":"safekit"};
const KEYS=["1","2","3","4","5","6","7"];
let shown=false,K=1;
const el=$("in");
el.innerHTML=KEYS.map((k,i)=>`<div class="s empty" data-i="${i+1}"><span class="k">${k}</span><div class="ic"></div></div>`).join("");
el.addEventListener("click",e=>{const s=e.target.closest(".s");if(s&&!s.classList.contains("empty")&&window.cef&&cef.emit)cef.emit("hotbar:slot"+s.dataset.i)});
addEventListener("keydown",e=>{ // เบราว์เซอร์โฟกัสอยู่ตอนแถบเปิด: กด 1-7 = ใช้ช่อง, Esc/Alt = ปิด
 if(!shown)return;
 if(/^[1-7]$/.test(e.key)){use(+e.key);if(window.cef&&cef.emit)cef.emit("hotbar:slot"+e.key)}
 else if(e.key=="Escape"||e.key=="Alt"){e.preventDefault();if(window.cef&&cef.emit)cef.emit("hotbar:close")}
});
function fit(){K=Math.min(1,innerWidth*.96/340,innerHeight*.3/60);$("hud").style.setProperty("--k",K)}
function icon(s,d){ // d.i = ลิงก์รูป หรือ อีโมจิ/ตัวอักษร ถ้าไม่มีใช้ 2 ตัวแรกของชื่อ
 const box=s.querySelector(".ic");
 if(!d||!d.n){s.classList.add("empty");box.innerHTML="";s.title="";return}
 s.classList.remove("empty");s.title=d.n;
 let v=d.i||"";
 if(IMGMAP[d.n])v=IMGBASE+IMGMAP[d.n]+".png"; // ชื่อไอเทมตรงกับตาราง -> ใช้ชื่อไฟล์จริง
 if(!/^(https?:|\/|\.|file:|data:)|\.(png|webp|jpg|svg)$/i.test(v)&&(!v||/item_\d+|:/.test(v))){ // ไม่ได้ส่งลิงก์รูปมา (ว่าง/ชื่อ sprite) -> หาจากชื่อไอเทม
  const mm=/item_\d+/.exec(v),key=mm?mm[0]:IMGMAP[d.n];
  if(key)v=IMGBASE+key+".png";
 }
 const fb=[...d.n.split("_").pop()].slice(0,2).join("").toUpperCase();
 box.textContent="";
 if(/^(https?:|\/|\.|file:|data:)|\.(png|webp|jpg|svg)$/i.test(v)){const im=new Image();im.draggable=false;im.onerror=()=>{im.onerror=null;im.src=PH};im.src=v;box.appendChild(im)}
 else box.textContent=v||fb;
}
// รับจากเซิร์ฟเวอร์: hotbar:update = {"show":1,"slots":[{"n":"ชื่อไอเทม","i":"ลิงก์รูป"}, ...7 ช่อง]}
function upd(o){
 if(o.slots)[...el.children].forEach((s,i)=>icon(s,o.slots[i]));
 if(o.show&&!shown){shown=true;sfx("open");fit();el.classList.remove("off");el.classList.add("on")}
 else if(o.show===0&&shown||o.show===false&&shown){shown=false;sfx("close");el.classList.remove("on");el.classList.add("off")}
}
// hotbar:use = [slot] -> เล่นอนิเมชั่นกดช่อง (เรียกตอนผู้เล่นกดปุ่มลัด)
const PH="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><rect x="6" y="6" width="36" height="36" rx="9" fill="#202020" stroke="#1d6fd0" stroke-width="2"/><path d="M24 13l9 11-9 11-9-11z" fill="#1d6fd0"/></svg>');
// ---------- เสียง (สร้างด้วย Web Audio ไม่ต้องมีไฟล์) ----------
const SFX={on:true,vol:.5};   // on=false ปิดเสียงทั้งหมด, vol 0-1 ปรับความดัง
let ac,nb;
function actx(){
 if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(_){return null}}
 if(ac.state==="suspended")ac.resume().catch(()=>{});
 return ac;
}
function noise(c){
 if(!nb){nb=c.createBuffer(1,c.sampleRate*.5,c.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
 return nb;
}
function whoosh(up){ // เสียงลมวูบ: เปิด = ไล่ความถี่ขึ้น, ปิด = ไล่ลง
 const c=actx();if(!c)return;const t=c.currentTime,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
 s.buffer=noise(c);f.type="bandpass";f.Q.value=1.1;
 f.frequency.setValueAtTime(up?450:2600,t);f.frequency.exponentialRampToValueAtTime(up?2800:380,t+.24);
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(SFX.vol*.55,t+.06);g.gain.exponentialRampToValueAtTime(.001,t+.28);
 s.connect(f);f.connect(g);g.connect(c.destination);s.start(t);s.stop(t+.3);
}
function tone(f1,f2,dur,type,v,delay){ // เสียงคลิก/ติ๊ก
 const c=actx();if(!c)return;const t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();
 o.type=type||"sine";o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);
 g.gain.setValueAtTime(SFX.vol*v,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
 o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.02);
}
const SND={
 open(){whoosh(true);tone(880,1320,.08,"sine",.28,.14)},
 close(){whoosh(false);tone(520,360,.07,"sine",.2,.02)},
 sel(){tone(1300,1100,.035,"triangle",.2)},
 hot(){tone(700,1150,.1,"sine",.3);tone(1150,1500,.08,"sine",.18,.07)},
 use(){tone(620,940,.09,"triangle",.28)}
};
const play=n=>{if(SFX.on)try{SND[n]()}catch(_){}};
document.addEventListener("pointerdown",()=>actx(),{once:true}); // ปลดล็อกเสียงเมื่อแตะครั้งแรก
const sfx=t=>play(t=="select"?"use":t);
function use(n){const s=el.children[n-1];if(!s)return;if(!s.classList.contains("empty"))sfx("select");s.classList.remove("use");void s.offsetWidth;s.classList.add("use")}
const norm=(...a)=>{let x=a[0];if(typeof x=="string")try{x=JSON.parse(x)}catch(_){}return x};
let bound=false;
function bind(){
 if(bound)return true;
 if(!window.cef||!cef.on)return false;
 cef.on("hotbar:update",(...a)=>upd(norm(...a)));
 cef.on("hotbar:use",(...a)=>use(+norm(...a)));
 if(cef.emit)cef.emit("hotbar:ready");
 return bound=true;
}
if(!bind()){const iv=setInterval(()=>{if(bind())clearInterval(iv)},100);addEventListener("load",bind)}
addEventListener("resize",fit);fit();
if(PREVIEW||location.hash=="#preview"){
 const demo=[{n:"มีดซามูไร",i:"🗡️"},{n:"มีด",i:"🔪"},{n:"หมวกกันน็อค",i:"🪖"},{n:"หินเขียว",i:"💎"},{n:"พิซซ่า",i:"🍕"},{n:"เนื้อ",i:"🥩"},null];
 let t0=Date.now(),last=-1;
 setInterval(()=>{
  const c=((Date.now()-t0)/1000)%9;
  upd({show:c<7?1:0,slots:demo});
  const u=Math.floor(c/1.1)+1;if(c<7&&u!==last&&u<=6){last=u;use(u)}if(c<1)last=-1;
 },120);
}
</script></body></html>
