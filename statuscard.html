<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MELVY TOWN status card</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--b1:#2aa8ff;--b2:#1d6fd0;--b3:#0f3f7a;--navy:#0e0e11;--glow:rgba(42,168,255,.5)}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:transparent;font-family:'Kanit',sans-serif;min-height:100vh;overflow:hidden}
.wrap{--card-scale:.55;position:fixed;top:14px;left:50%;transform:translateX(-50%) scale(var(--card-scale));transform-origin:top center;width:520px;display:flex;flex-direction:column;gap:10px;z-index:9999}

/* ---------- บัตร ---------- */
.card{position:relative;width:520px;height:340px;animation:in .35s cubic-bezier(.22,1,.36,1) both}
.frame{position:absolute;left:0;top:0;width:520px;height:340px;overflow:visible}
.frame path{vector-effect:non-scaling-stroke}
.bg{position:absolute;left:0;top:0;width:520px;height:340px;background-size:cover;background-position:center;opacity:.2;pointer-events:none;
 clip-path:polygon(10px 24px,300px 24px,318px 48px,510px 48px,510px 310px,480px 336px,30px 336px,10px 316px)}
.tab{position:absolute;left:46px;top:6px;width:96px;height:30px;display:flex;align-items:center;justify-content:center;
 font:900 13px 'Orbitron',sans-serif;color:#fff;letter-spacing:1px;
 background:linear-gradient(180deg,#1d6fd0,#12284a);border:2px solid var(--b1);border-top-width:2px;
 clip-path:polygon(0 0,100% 0,88% 100%,12% 100%);filter:drop-shadow(0 0 6px var(--glow))}
.title{position:absolute;left:250px;top:8px;width:262px;height:44px;padding:4px 0 0 34px;
 background:linear-gradient(180deg,#12284a,#0e0e11);border:2px solid var(--b1);
 clip-path:polygon(0 0,100% 0,100% 100%,22px 100%,0 0);filter:drop-shadow(0 0 6px var(--glow))}
.title h3{font-size:19px;font-weight:700;color:#fff;line-height:1.15}
.title small{display:block;font-size:8.5px;color:#7fcfff;margin-top:-2px;letter-spacing:.3px}
.acts{position:absolute;top:-4px;right:-10px;display:flex;gap:6px;z-index:5}
.dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;cursor:pointer;
 background:#12284a;border:1px solid var(--b1);transition:.15s}
.dot:hover{transform:scale(1.12)}.dot.on{background:var(--b1)}
.dot.x{background:#e0393e;border-color:#ff7a7e}

.photo{position:absolute;left:24px;top:62px;width:158px;height:196px;border:2px solid var(--b1);border-radius:14px;cursor:pointer;
 background:radial-gradient(circle at 50% 40%,#12284a,#0e0e11 80%);box-shadow:0 0 10px var(--glow),inset 0 0 14px rgba(29,111,208,.35);
 display:flex;align-items:center;justify-content:center;overflow:hidden}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.ph{display:flex;flex-direction:column;align-items:center;gap:8px;color:#fff;font-weight:700;font-size:13px}
.ph i{font-size:26px;color:#e6f1ff}
.photo.has .ph{display:none}.photo.has img{display:block}
.share{position:absolute;left:24px;top:272px;width:158px;height:32px;border:none;border-radius:8px;cursor:pointer;color:#fff;
 font:700 11px 'Kanit',sans-serif;background:linear-gradient(180deg,#2aa8ff,#1d6fd0 55%,#0f3f7a);box-shadow:inset 0 1px 1px rgba(255,255,255,.4),0 0 8px var(--glow);
 display:flex;align-items:center;justify-content:center;gap:6px}
.share:hover{filter:brightness(1.12)}

.grid{position:absolute;left:204px;top:64px;width:290px;display:grid;grid-template-columns:1fr 1fr;gap:7px 12px}
.f{display:flex;flex-direction:column;gap:2px;min-width:0}.f.w{grid-column:span 2}
.f label{font-size:9px;color:#9fd3ff;font-weight:600;padding-left:2px}
.f b{display:block;height:27px;line-height:27px;padding:0 10px;font-size:12px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
 background:linear-gradient(90deg,#1d6fd0,#12284a 70%,#0e0e11);border:1px solid #1d6fd0;border-radius:7px 14px 7px 7px;text-shadow:0 1px 2px #000}
.f b.num{font-family:'Orbitron',sans-serif;font-size:11px;color:#9fd8ff}
.f b.g{color:#3df08a;border-color:#1c9a5a}.f b.r{color:#ff6b78;border-color:#a8333c}
.f b em{font-style:normal;color:#ff6b78}
.money.hide{display:none}


/* ---------- แผงย่อย ---------- */
.panel{display:none;width:520px;align-self:flex-start;margin-left:0;padding:2px;border-radius:14px;background:linear-gradient(180deg,var(--b1),var(--b3));animation:in .25s both}
.panel.show{display:block}
.pin{background:linear-gradient(135deg,#151518,#0e0e11);border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.ph2{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(29,111,208,.4);padding-bottom:6px;font-size:12px;font-weight:700;color:#7fcfff}
.ph2 i.cl{cursor:pointer;color:#8aa}
.row{display:flex;justify-content:space-between;align-items:center;background:#0e0e11;border:1px solid #15304f;padding:7px 12px;border-radius:9px}
.row div{display:flex;flex-direction:column}.row .n{font-size:12px;font-weight:600;color:#e6e9ef}.row .d{font-size:9.5px;color:#8b93a1}
.btn{background:linear-gradient(180deg,#2aa8ff,#1d6fd0 55%,#0f3f7a);border:none;border-radius:7px;padding:5px 11px;color:#fff;font:700 10.5px 'Kanit',sans-serif;cursor:pointer;display:flex;align-items:center;gap:4px;box-shadow:inset 0 1px 1px rgba(255,255,255,.35)}
.btn:hover{filter:brightness(1.12)}
.urlrow{display:none;gap:6px}.urlrow.show{display:flex}
.urlrow input{flex:1;min-width:0;background:#0e0e11;color:#fff;border:1px solid var(--b2);border-radius:8px;padding:6px 10px;font:11px 'Kanit',sans-serif;outline:none;user-select:text;-webkit-user-select:text}
.plist{display:flex;flex-direction:column;gap:6px;max-height:160px;overflow-y:auto;padding-right:4px}
.plist::-webkit-scrollbar{width:4px}.plist::-webkit-scrollbar-thumb{background:var(--b3);border-radius:4px}
.pi{display:flex;justify-content:space-between;align-items:center;background:#0e0e11;border:1px solid #15304f;padding:6px 12px;border-radius:8px;cursor:pointer;transition:.15s}
.pi:hover{border-color:var(--b1);transform:translateX(3px)}
.pm{display:flex;align-items:center;gap:8px;color:#fff;font-size:12px;font-weight:600}
.pid{font:700 9.5px 'Orbitron',sans-serif;color:#7fcfff;background:rgba(29,111,208,.22);border:.5px solid var(--b3);padding:1px 6px;border-radius:4px}
.empty{font-size:10px;color:#8b93a1;text-align:center;padding:10px 0}
.ct{color:#7fcfff;font-weight:700;font-size:13px}.cx{color:#e6e9ef;font-size:11px}
.ca{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn.no{background:#151518;color:#ff6b78;border:1px solid #66333a;justify-content:center;padding:8px}.ca .btn{justify-content:center;padding:8px}
@keyframes in{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="wrap">

 <div class="card" id="idCardBox">
  <svg class="frame" viewBox="0 0 520 340">
   <defs><linearGradient id="fg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12284a"/><stop offset="1" stop-color="#0e0e11"/></linearGradient></defs>
   <path d="M10 24H300L318 48H510V310L480 336H30L10 316Z" fill="url(#fg)" stroke="#2aa8ff" stroke-width="2.5" style="filter:drop-shadow(0 0 6px rgba(42,168,255,.6))"/>
   <path d="M18 32H296L314 56H502" fill="none" stroke="rgba(42,168,255,.25)" stroke-width="1"/>
  </svg>
  <div class="bg" id="cardBgOverlay"></div>

  <div class="tab" id="cardCitizenId">ID 0</div>
  <div class="title"><h3>บัตรประจำตัวประชาชน</h3><small>Identification Card</small></div>
  <div class="acts">
   <div class="dot" id="btnSettingsToggle" onclick="toggleSettings()" title="ตั้งค่ารูปภาพ"><i class="fa-solid fa-gear"></i></div>
   <div class="dot x" onclick="hideCard()" title="ปิด (ESC)"><i class="fa-solid fa-xmark"></i></div>
  </div>

  <div class="photo" id="photoBox" onclick="if(ownerView)askLink('photo')">
   <div class="ph" id="photoPlaceholder"><i class="fa-solid fa-camera"></i><span>ใส่รูปภาพ</span></div>
   <img id="cardPhoto" alt="">
  </div>
  <button class="share" id="btnShareCard" onclick="openShareModal()"><i class="fa-solid fa-share-nodes"></i> ยื่นให้ผู้อื่นดู</button>

  <div class="grid">
   <div class="f w"><label>ชื่อ - นามสกุล</label><b id="cardName">-</b></div>
   <div class="f"><label>อายุ</label><b id="cardAge">-</b></div>
   <div class="f"><label>เพศ</label><b id="cardGender">-</b></div>
   <div class="f"><label>วันเกิด</label><b id="cardBirth">-</b></div>
   <div class="f"><label>เบอร์โทร</label><b class="num" id="cardPhone">-</b></div>
  </div>

 </div>

 <div class="panel" id="settingsPanel"><div class="pin">
  <div class="ph2"><span><i class="fa-solid fa-link"></i> ตั้งค่ารูปภาพบัตรด้วยลิงก์</span><i class="fa-solid fa-xmark cl" onclick="toggleSettings()"></i></div>
  <div class="row"><div><span class="n">รูปประจำตัว</span><span class="d">วางลิงก์รูปถ่ายหน้าตรงของตัวละคร</span></div><button class="btn" onclick="askLink('photo')"><i class="fa-solid fa-link"></i> ใส่ลิงก์รูป</button></div>
  <div class="row"><div><span class="n">พื้นหลังบัตร</span><span class="d">วางลิงก์รูปลายพื้นหลังของบัตร</span></div><button class="btn" onclick="askLink('bg')"><i class="fa-solid fa-link"></i> ใส่ลิงก์รูป</button></div>
  <div class="urlrow" id="linkRow"><input id="linkIn" type="text" placeholder="วางลิงก์รูป https://..." onkeydown="if(event.key==='Enter')applyLocalLink()"><button class="btn" onclick="applyLocalLink()"><i class="fa-solid fa-check"></i> ตกลง</button></div>
 </div></div>

 <div class="panel" id="sharePanel"><div class="pin">
  <div class="ph2"><span><i class="fa-solid fa-users"></i> เลือกผู้เล่นที่ต้องการแสดงบัตรให้ดู</span><i class="fa-solid fa-xmark cl" onclick="closeShareModal()"></i></div>
  <div class="plist" id="nearbyPlayerList"></div>
 </div></div>

 <div class="panel" id="confirmPanel"><div class="pin" style="padding:16px">
  <div class="ct"><i class="fa-solid fa-address-card"></i> มีผู้เล่นต้องการแสดงบัตรให้คุณดู</div>
  <div class="cx" id="confirmText">ต้องการดูบัตรประชาชนหรือไม่?</div>
  <div class="ca"><button class="btn" onclick="acceptCardRequest()">ยืนยันดูบัตร</button><button class="btn no" onclick="declineCardRequest()">ปฏิเสธ</button></div>
 </div></div>
</div>

<script>
let pendingKind='',ownerView=true;
function $(id){return document.getElementById(id)}
function num(v){return Number(v||0).toLocaleString()}
function emit(name){const a=[].slice.call(arguments,1);try{if(typeof cef!=='undefined'&&cef&&typeof cef.emit==='function'){cef.emit.apply(cef,[name].concat(a));return true}}catch(e){}return false}
function eventArgs(e){let d=e.detail;try{if(typeof d==='string')d=JSON.parse(d)}catch(_){d=[]}return Array.isArray(d)?d:[d]}

function closePanels(){['settingsPanel','sharePanel','confirmPanel'].forEach(i=>$(i).classList.remove('show'));$('btnSettingsToggle').classList.remove('on')}
function toggleSettings(){if(!ownerView)return;$('sharePanel').classList.remove('show');const p=$('settingsPanel');p.classList.toggle('show');$('btnSettingsToggle').classList.toggle('on',p.classList.contains('show'))}

function setCardPhoto(url){
  const img=$('cardPhoto'),box=$('photoBox');
  if(!url){img.removeAttribute('src');box.classList.remove('has');return}
  img.onload=()=>box.classList.add('has');img.onerror=()=>box.classList.remove('has');img.src=url;
}
function setCardBackground(url){$('cardBgOverlay').style.backgroundImage=url?'url('+JSON.stringify(String(url))+')':'none'}

function askLink(kind){
  if(emit('status:'+kind))return;
  pendingKind=kind;$('settingsPanel').classList.add('show');$('linkRow').classList.add('show');$('linkIn').focus();
}
function applyLocalLink(){
  const i=$('linkIn'),u=i.value.trim();
  if(!/^https?:\/\/\S+$/i.test(u))return;
  pendingKind==='photo'?setCardPhoto(u):setCardBackground(u);
  i.value='';$('linkRow').classList.remove('show');
}

function setOwnerMode(o){
  ownerView=!!o;
  $('btnSettingsToggle').style.display=ownerView?'flex':'none';
  $('btnShareCard').style.display=ownerView?'':'none';
  document.querySelectorAll('.money').forEach(e=>e.classList.toggle('hide',!ownerView));
  $('photoBox').style.cursor=ownerView?'pointer':'default';
}

function calcAge(s){
  const m=/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/.exec(String(s||'').trim());
  if(!m)return '-';
  let y=+m[3];if(y>2400)y-=543;
  const n=new Date();let a=n.getFullYear()-y;
  if(n.getMonth()+1<+m[2]||(n.getMonth()+1===+m[2]&&n.getDate()<+m[1]))a--;
  return a>=0&&a<150?a+' ปี':'-';
}


// [id,ชื่อ,เพศ,วันเกิด,เงิน,เงินแดง,ฆ่า,ตาย,ชั่วโมง,coin,โทร,รูป,พื้นหลัง,viewer]
function fillStatus(a){
  const G=['-','ชาย','หญิง'];
  setOwnerMode(!Number(a[13]));closePanels();
  $('cardCitizenId').innerText='ID '+(a[0]||0);
  $('cardName').innerText=a[1]||'-';
  $('cardGender').innerText=G[+a[2]]||'-';
  $('cardBirth').innerText=a[3]||'-';
  $('cardAge').innerText=calcAge(a[3]);
  $('cardPhone').innerText=a[10]||'-';
  setCardPhoto(a[11]||'');setCardBackground(a[12]||'');
  $('idCardBox').style.display='block';
}

function hideCard(){$('idCardBox').style.display='none';closePanels();emit('status:close')}

function openShareModal(){
  if(!ownerView)return;
  $('settingsPanel').classList.remove('show');$('btnSettingsToggle').classList.remove('on');
  $('nearbyPlayerList').innerHTML='<div class="empty">กำลังค้นหาผู้เล่นใกล้เคียง...</div>';
  $('sharePanel').classList.add('show');
  if(!emit('status:nearby'))renderNearbyPlayers([[3,'Demo Player'],[7,'Another Person']]);
}
function closeShareModal(){$('sharePanel').classList.remove('show')}

function renderNearbyPlayers(players){
  const list=$('nearbyPlayerList');list.innerHTML='';
  if(!players||!players.length){list.innerHTML='<div class="empty">ไม่พบผู้เล่นอื่นในบริเวณใกล้เคียง</div>';return}
  players.forEach(p=>{
    const it=document.createElement('div');it.className='pi';it.onclick=()=>selectTargetPlayer(p[0]);
    const m=document.createElement('div');m.className='pm';
    const pill=document.createElement('span');pill.className='pid';pill.textContent='ID: '+p[0];
    const nm=document.createElement('span');nm.textContent=p[1];
    m.appendChild(pill);m.appendChild(nm);
    const b=document.createElement('button');b.className='btn';b.textContent='ยื่นให้ดู';
    it.appendChild(m);it.appendChild(b);list.appendChild(it);
  });
}
function selectTargetPlayer(id){closeShareModal();emit('status:show_to',String(id))}
function acceptCardRequest(){$('confirmPanel').classList.remove('show');emit('status:accept')}
function declineCardRequest(){$('confirmPanel').classList.remove('show');$('idCardBox').style.display='none';emit('status:decline')}

window.addEventListener('cef:status:data',e=>fillStatus(eventArgs(e)));
window.addEventListener('cef:status:shared',e=>{const a=eventArgs(e);a[13]=1;fillStatus(a)});
window.addEventListener('cef:status:photo',e=>setCardPhoto(String(eventArgs(e)[0]||'')));
window.addEventListener('cef:status:bg',e=>setCardBackground(String(eventArgs(e)[0]||'')));
window.addEventListener('cef:status:nearby',e=>renderNearbyPlayers(eventArgs(e)));
window.addEventListener('cef:status:confirm',e=>{
  const a=eventArgs(e);closePanels();$('idCardBox').style.display='none';
  $('confirmText').textContent=String(a[1]||'Player')+' ต้องการแสดงบัตรประชาชนให้คุณดู ต้องการยืนยันหรือไม่?';
  $('confirmPanel').classList.add('show');
});

document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;e.preventDefault();
  if($('confirmPanel').classList.contains('show')){declineCardRequest();return}
  if($('sharePanel').classList.contains('show')){closeShareModal();return}
  if($('settingsPanel').classList.contains('show')){$('settingsPanel').classList.remove('show');$('btnSettingsToggle').classList.remove('on');return}
  hideCard();
});

if(location.hash==='#test'){
  document.body.style.background='#1b1d22';
  fillStatus([12,'Somchai Rakdee',1,'01/05/1998',152000,25000,34,12,126,50,'0891234','','',0]);
}
</script>
</body>
</html>
