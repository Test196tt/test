<title>Melvy Town Speedo</title>

<style>
:root{
  --s:.26;               /* ขนาดรวม (0.26 ≈ กว้าง 266px) ปรับตามต้องการ */
  --bottom:6px;          /* ระยะจากขอบล่าง */
}
html,body{margin:0;height:100%;background:transparent;overflow:hidden;pointer-events:none;
  -webkit-user-select:none;user-select:none}
#sp{position:fixed;left:50%;bottom:var(--bottom);width:1024px;height:369px;
  transform:translateX(-50%) scale(var(--s));transform-origin:50% 100%;opacity:0;transition:opacity .25s}
#sp.on{opacity:1}
#sp>*{position:absolute}
#base{left:0;top:0;width:1024px;height:369px}
.seg{opacity:0;transition:opacity .15s}
.seg.lit{opacity:1}
.warn{animation:blink .6s infinite alternate}
@keyframes blink{from{opacity:1}to{opacity:.35}}
.num{color:#fff;font-family:"Orbitron","Arial Black",Impact,sans-serif;font-weight:800;text-align:center;
  line-height:1;text-shadow:0 3px 6px rgba(0,0,0,.7)}
#spd{left:82px;width:270px;top:118px;font-size:92px}
#gear{left:678px;width:270px;top:118px;font-size:92px}
#sp .tire{background:#ff1f33;border-radius:3px;opacity:0;transition:opacity .1s}
#sp .tire.pop{opacity:1}
</style>

  <div class="tire" id="t-rl" style="left:431px;top:243px;width:13px;height:25px"></div>
  <div class="tire" id="t-rr" style="left:577px;top:243px;width:14px;height:25px"></div>
  <div class="num" id="spd">0</div>
  <div class="num" id="gear">N</div>
</div>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var L=[].slice.call(document.querySelectorAll('.seg[data-side=left]'));
  var R=[].slice.call(document.querySelectorAll('.seg[data-side=right]'));
  function clamp(v){v=Number(v);return isNaN(v)?0:Math.max(0,Math.min(100,v))}
  function bar(segs,val){
    var n=segs.length;segs.forEach(function(el,i){el.classList.toggle('lit',val>(n-1-i)*10)});
  }
  // speedo:update -> [speed, gear(0=N,1-6), fuel(0-100), health(0-100), show, tires(bitmask: 1=หลังขวา 2=หน้าขวา 4=หลังซ้าย 8=หน้าซ้าย)]
  function apply(speed,gear,fuel,hp,show,tires){
    speed=Math.max(0,Math.round(Number(speed)||0));
    gear=Math.round(Number(gear)||0);
    fuel=clamp(fuel);hp=clamp(hp);
    $('spd').textContent=speed;
    $('gear').textContent=gear<=0?'N':gear;
    bar(L,fuel);bar(R,hp);
    tires=Number(tires)||0;
    $('t-rr').classList.toggle('pop',(tires&1)>0);
    $('t-fr').classList.toggle('pop',(tires&2)>0);
    $('t-rl').classList.toggle('pop',(tires&4)>0);
    $('t-fl').classList.toggle('pop',(tires&8)>0);
    L.forEach(function(el){el.classList.toggle('warn',fuel<=15)});
    R.forEach(function(el){el.classList.toggle('warn',hp<=25)});
    if(show!==undefined)$('sp').classList.toggle('on',Number(show)===1);
  }
  window.addEventListener('cef:speedo:update',function(e){if(Array.isArray(e.detail))apply.apply(null,e.detail)});
  if(/[?&]demo/.test(location.search)){
    var t=0;setInterval(function(){t++;var sp=Math.round(130*Math.abs(Math.sin(t/12)));
      apply(sp,sp<5?0:Math.min(6,1+Math.floor(sp/25)),70-(t%70),80,1)},250);
  }
})();
</script>
