<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PVP ARENA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --red:#1f6bff; --red-hi:#4d94ff; --red-dk:#0b2f9e;
  --bg:#070708; --panel:#0e0e11; --panel2:#15151a; --line:#2a2a31;
  --txt:#f4f4f6; --mut:#8c8c96; --blk:#1b1b20;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;background:transparent;overflow:hidden;font-family:'Kanit','Sarabun',system-ui,sans-serif;color:var(--txt)}
.hidden{display:none!important}

/* ---------- ฉากหลัง + หน้าต่างหลัก ---------- */
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center,rgba(10,40,130,.35) 0%,rgba(0,0,0,.88) 70%)}
#panel{position:relative;width:min(900px,94vw);max-height:92vh;background:linear-gradient(160deg,#101014 0%,#09090b 100%);
  border:1px solid var(--line);border-top:3px solid var(--red);border-radius:6px;
  box-shadow:0 0 0 1px #000,0 20px 70px rgba(31,107,255,.28),inset 0 0 60px rgba(31,107,255,.05);
  display:flex;flex-direction:column;overflow:hidden}
#panel::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.05;
  background:repeating-linear-gradient(135deg,#fff 0 2px,transparent 2px 14px)}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line);position:relative}
.logo{display:flex;align-items:baseline;gap:10px;font-weight:800;letter-spacing:3px;font-size:clamp(20px,3.4vw,28px)}
.logo b{color:var(--red-hi);text-shadow:0 0 14px rgba(77,148,255,.6)}
.logo small{font-size:12px;font-weight:500;letter-spacing:2px;color:var(--mut)}
#btnClose{width:42px;height:42px;border:1px solid var(--line);background:var(--blk);color:var(--txt);font-size:22px;cursor:pointer;border-radius:4px;font-family:inherit}
#btnClose:active{background:var(--red)}
main{position:relative;padding:20px;overflow-y:auto;min-height:0}
.view{animation:in .22s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h2{font-size:15px;font-weight:600;letter-spacing:2px;color:var(--mut);margin-bottom:14px}
h2 span{color:var(--red-hi)}

/* ---------- ปุ่ม ---------- */
.btn{font-family:inherit;font-weight:700;letter-spacing:1px;font-size:16px;color:var(--txt);cursor:pointer;
  border:1px solid var(--line);background:var(--blk);padding:0 22px;min-height:50px;border-radius:4px;
  transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.98)}
.btn.red{background:linear-gradient(180deg,var(--red-hi),var(--red) 60%,var(--red-dk));border-color:var(--red-hi);
  box-shadow:0 0 18px rgba(31,107,255,.45)}
.btn.ghost:hover,.btn.ghost:active{border-color:var(--red);color:var(--red-hi)}
.btn[disabled]{opacity:.35;pointer-events:none}
.row{display:flex;gap:12px;flex-wrap:wrap}

/* ---------- หน้าหลัก ---------- */
.big{flex:1 1 260px;min-height:190px;border:1px solid var(--line);background:var(--panel2);border-radius:6px;cursor:pointer;
  position:relative;overflow:hidden;padding:22px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;transition:.18s;font-family:inherit;color:var(--txt);text-align:left}
.big::after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;
  background:radial-gradient(circle,rgba(31,107,255,.55),transparent 65%);transition:.2s}
.big:hover,.big:active{border-color:var(--red);transform:translateY(-3px)}
.big:hover::after{transform:scale(1.25)}
.big .ico{font-size:46px;line-height:1;margin-bottom:auto;z-index:1}
.big .t{font-size:26px;font-weight:800;letter-spacing:2px;z-index:1}
.big .d{font-size:13px;color:var(--mut);z-index:1}

/* ---------- เลือกโหมด ---------- */
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.mode{border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:20px 8px;text-align:center;cursor:pointer;transition:.15s;font-family:inherit;color:var(--txt)}
.mode .n{font-size:clamp(28px,6vw,44px);font-weight:800;letter-spacing:2px}
.mode .n i{color:var(--red-hi);font-style:normal;margin:0 6px;font-size:.6em}
.mode .s{font-size:12px;color:var(--mut);margin-top:4px}
.mode.on{border-color:var(--red-hi);background:linear-gradient(180deg,rgba(31,107,255,.25),rgba(31,107,255,.05));box-shadow:0 0 22px rgba(31,107,255,.35)}

/* ---------- รายการห้อง ---------- */
#rooms{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow-y:auto;margin-bottom:16px}
.room{display:flex;align-items:center;gap:14px;border:1px solid var(--line);background:var(--panel2);border-radius:5px;padding:12px 14px}
.room .id{font-weight:800;font-size:18px;color:var(--red-hi);min-width:46px}
.room .mid{flex:1;min-width:0}
.room .mid .h{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.room .mid .m{font-size:12px;color:var(--mut)}
.badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;border:1px solid var(--line);color:var(--mut)}
.badge.wait{color:#3ddc84;border-color:#1f6b43}
.badge.play{color:var(--red-hi);border-color:var(--red-dk)}
.room .btn{min-height:40px;font-size:14px;padding:0 16px}
.empty{padding:36px 10px;text-align:center;color:var(--mut)}

/* ---------- ล็อบบี้ ---------- */
.lobbyTop{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.lobbyTop .info{font-size:14px;color:var(--mut)}
.lobbyTop .info b{color:var(--txt);font-size:18px;letter-spacing:1px}
.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch;margin-bottom:18px}
.vs{display:flex;align-items:center;font-weight:800;font-size:22px;color:var(--mut);letter-spacing:2px}
.team{border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:12px;min-height:210px}
.team.red{border-top:3px solid var(--red-hi)}
.team.blk{border-top:3px solid #55555f}
.team .ttl{font-weight:800;letter-spacing:2px;margin-bottom:10px;display:flex;justify-content:space-between}
.team.red .ttl{color:var(--red-hi)} .team.blk .ttl{color:#c7c7d1}
.slot{height:48px;border:1px dashed var(--line);border-radius:4px;margin-bottom:8px;display:flex;align-items:center;padding:0 12px;color:var(--mut);font-size:14px;cursor:pointer;gap:8px}
.slot.fill{border-style:solid;color:var(--txt);cursor:default;background:var(--blk);font-weight:500}
.slot.me{border-color:var(--red-hi);box-shadow:inset 0 0 14px rgba(31,107,255,.25)}
.slot.empty-slot:active{border-color:var(--red-hi);color:var(--red-hi)}
.crown{color:#ffc83d}
.tip{font-size:12px;color:var(--mut);text-align:center;margin-top:10px}

/* ---------- HUD ระหว่างสู้ ---------- */
#hud{position:fixed;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;align-items:stretch;
  filter:drop-shadow(0 6px 18px rgba(0,0,0,.7));pointer-events:none}
#hud .side{min-width:112px;padding:6px 16px;text-align:center;background:rgba(10,10,12,.88);border:1px solid var(--line)}
#hud .side.a{border-top:3px solid var(--red-hi);border-radius:5px 0 0 5px}
#hud .side.b{border-top:3px solid #66666f;border-radius:0 5px 5px 0}
#hud .lbl{font-size:11px;letter-spacing:2px;color:var(--mut)}
#hud .num{font-size:30px;font-weight:800;line-height:1.05}
#hud .a .num{color:var(--red-hi)}
#hud .tot{font-size:11px;color:var(--mut)}
#hud .mid{display:flex;align-items:center;padding:0 12px;background:#000;border-top:3px solid #000;font-weight:800;color:var(--mut);letter-spacing:2px}
#hud .side.mine .lbl::after{content:" (คุณ)";color:var(--txt)}

/* ---------- แบนเนอร์ผลแพ้ชนะ ---------- */
#banner{position:fixed;left:0;right:0;top:34%;text-align:center;pointer-events:none;animation:pop .5s ease}
#banner .t{font-size:clamp(46px,10vw,96px);font-weight:800;letter-spacing:8px;text-shadow:0 0 40px currentColor}
#banner .s{font-size:clamp(14px,2.4vw,22px);letter-spacing:4px;color:var(--mut)}
#banner.win .t{color:#3ddc84} #banner.lose .t{color:#ff4d5e} #banner.draw .t{color:#ffc83d}
@keyframes pop{from{opacity:0;transform:scale(1.4)}to{opacity:1;transform:none}}

@media (max-width:640px){
  .teams{grid-template-columns:1fr}.vs{justify-content:center}
  .modes{gap:8px}
  .room{flex-wrap:wrap}
}
</style>
</head>
<body>

<div id="overlay" class="hidden">
  <div id="panel">
    <header>
      <div class="logo"><b>PVP</b>ARENA <small>TEAM VS TEAM</small></div>
      <button id="btnClose" aria-label="ปิด">&#10005;</button>
    </header>
    <main>

      <!-- หน้าหลัก -->
      <section id="vMain" class="view">
        <h2><span>//</span> เลือกโหมด</h2>
        <div class="row">
          <button class="big" id="goCreate"><div class="ico">&#9876;</div><div class="t">สร้างห้อง</div><div class="d">เลือก 1v1 / 2v2 / 3v3 แล้วรอคู่ต่อสู้</div></button>
          <button class="big" id="goJoin"><div class="ico">&#9889;</div><div class="t">เข้าร่วม</div><div class="d">เลือกห้องที่เปิดรออยู่แล้วบุกเลย</div></button>
        </div>
      </section>

      <!-- สร้างห้อง -->
      <section id="vCreate" class="view hidden">
        <h2><span>//</span> สร้างห้อง : เลือกจำนวนผู้เล่นต่อทีม</h2>
        <div class="modes">
          <button class="mode on" data-n="1"><div class="n">1<i>VS</i>1</div><div class="s">ดวลเดี่ยว</div></button>
          <button class="mode" data-n="2"><div class="n">2<i>VS</i>2</div><div class="s">ทีมละ 2 คน</div></button>
          <button class="mode" data-n="3"><div class="n">3<i>VS</i>3</div><div class="s">ทีมละ 3 คน</div></button>
        </div>
        <div class="row">
          <button class="btn ghost" data-back>&#8592; ย้อนกลับ</button>
          <button class="btn red" id="doCreate" style="flex:1">สร้างห้อง</button>
        </div>
      </section>

      <!-- เข้าร่วม -->
      <section id="vJoin" class="view hidden">
        <h2><span>//</span> ห้องที่เปิดอยู่</h2>
        <div id="rooms"></div>
        <div class="row">
          <button class="btn ghost" data-back>&#8592; ย้อนกลับ</button>
          <button class="btn ghost" id="doRefresh" style="flex:1">&#8635; รีเฟรช</button>
        </div>
      </section>

      <!-- ล็อบบี้ -->
      <section id="vLobby" class="view hidden">
        <div class="lobbyTop">
          <div class="info">ห้อง <b id="lbId">#1</b> &nbsp;·&nbsp; <span id="lbMode">1 VS 1</span> &nbsp;·&nbsp; เจ้าของห้อง <b id="lbHost" style="font-size:14px"></b></div>
          <span class="badge wait" id="lbState">รอผู้เล่น</span>
        </div>
        <div class="teams">
          <div class="team red"><div class="ttl"><span>ทีม A</span><span id="cntA">0/1</span></div><div id="slotsA"></div></div>
          <div class="vs">VS</div>
          <div class="team blk"><div class="ttl"><span>ทีม B</span><span id="cntB">0/1</span></div><div id="slotsB"></div></div>
        </div>
        <div class="row">
          <button class="btn ghost" id="doLeave">ออกจากห้อง</button>
          <button class="btn red" id="doStart" style="flex:1">เริ่มเกม</button>
        </div>
        <div class="tip" id="lbTip">แตะช่องว่างเพื่อย้ายทีม · เริ่มอัตโนมัติเมื่อสองทีมเต็ม</div>
      </section>

    </main>
  </div>
</div>

<!-- HUD ระหว่างสู้ -->
<div id="hud" class="hidden">
  <div class="side a" id="hudA"><div class="lbl">A</div><div class="num" id="hudAn">0</div><div class="tot" id="hudAt">/0</div></div>
  <div class="mid">VS</div>
  <div class="side b" id="hudB"><div class="lbl">B</div><div class="num" id="hudBn">0</div><div class="tot" id="hudBt">/0</div></div>
</div>

<div id="banner" class="hidden"><div class="t" id="bnT"></div><div class="s" id="bnS"></div></div>

<script>
(function(){
  'use strict';

  /* ================= สะพานคุยกับเกม =================
     ส่งออก : emit('pvp:act','create:2')  -> เซิร์ฟเวอร์ได้ payload ["create:2"]
     รับเข้า: on('pvp:room', fn)           -> เซิร์ฟเวอร์ Cef_Emit(..., "pvp:room", "[\"...\"]")
     ถ้า menu.html เดิมของคุณเรียกต่างจากนี้ (เช่น cef.emit / cef.on) ให้แก้แค่สองฟังก์ชันนี้ */
  function getC(){ return window.cef || null; }   // หาใหม่ทุกครั้ง เผื่อไคลเอนต์ inject ทีหลังหน้าโหลด
  function emit(name, arg){
    try{
      var C = getC();
      if (C && typeof C.emit === 'function')       return C.emit(name, arg);
      if (C && typeof C.emit_event === 'function') return C.emit_event(name, arg);
      if (C && typeof C.send === 'function')       return C.send(name, arg);
      if (window.parent && window.parent !== window) window.parent.postMessage({event:name, args:[arg]}, '*');
    }catch(e){ console.log('emit error', e); }
  }
  var handlers = {}, bound = {};
  function bindAll(){
    var C = getC(); if (!C) return;
    Object.keys(handlers).forEach(function(k){
      if (bound[k]) return;
      try{
        if (typeof C.on === 'function')          { C.on(k, handlers[k]); bound[k] = 1; }
        else if (typeof C.listen === 'function') { C.listen(k, handlers[k]); bound[k] = 1; }
      }catch(e){ console.log('on error', e); }
    });
  }
  function on(name, fn){ handlers[name] = fn; bindAll(); }
  setInterval(bindAll, 300);                       // ผูก handler ที่ค้างเมื่อ cef โผล่มาทีหลัง
  window.addEventListener('message', function(ev){
    var d = ev.data; if (!d || !d.event || !handlers[d.event]) return;
    handlers[d.event].apply(null, d.args || []);
  });
  // โหมดตัวอย่างเปิดเฉพาะตอนเปิดไฟล์ในเบราว์เซอร์ตรงๆ (file:) หรือใส่ ?demo ห้ามเปิดในเกมจริง
  var DEMO = !getC() && (location.protocol === 'file:' || /[?&]demo/.test(location.search));

  /* ================= ตัวช่วย ================= */
  function $(id){ return document.getElementById(id); }
  function nm(s){ return String(s||'').replace(/_/g,' '); }
  function esc(s){ return nm(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  var views = ['vMain','vCreate','vJoin','vLobby'];
  function show(v){ views.forEach(function(x){ $(x).classList.toggle('hidden', x !== v); }); }

  var S = { mode:1, room:null, myName:'' };

  /* ================= ปุ่ม ================= */
  $('goCreate').onclick = function(){ show('vCreate'); };
  $('goJoin').onclick   = function(){ show('vJoin'); emit('pvp:act','list'); };
  document.querySelectorAll('[data-back]').forEach(function(b){ b.onclick = function(){ show('vMain'); }; });
  document.querySelectorAll('.mode').forEach(function(b){
    b.onclick = function(){
      document.querySelectorAll('.mode').forEach(function(x){ x.classList.remove('on'); });
      b.classList.add('on'); S.mode = +b.getAttribute('data-n');
    };
  });
  $('doCreate').onclick  = function(){ emit('pvp:act','create:'+S.mode); };
  $('doRefresh').onclick = function(){ emit('pvp:act','list'); };
  $('doLeave').onclick   = function(){ emit('pvp:act','leave'); };
  $('doStart').onclick   = function(){ emit('pvp:act','start'); };
  $('btnClose').onclick  = function(){ emit('pvp:close','1'); if (DEMO) $('overlay').classList.add('hidden'); };
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') $('btnClose').onclick(); });

  /* ================= รายการห้อง ================= */
  on('pvp:rooms', function(str){
    var box = $('rooms'); box.innerHTML = '';
    var list = String(str||'').split(';').filter(Boolean);
    if (!list.length){ box.innerHTML = '<div class="empty">ยังไม่มีห้องที่เปิดอยู่ ลองสร้างห้องใหม่ดู</div>'; return; }
    list.forEach(function(it){
      var p = it.split(':'), id = +p[0], per = +p[1], host = p[2], a = +p[3], b = +p[4], st = +p[5];
      var waiting = (st === 1), full = (a >= per && b >= per);
      var el = document.createElement('div'); el.className = 'room';
      el.innerHTML = '<div class="id">#'+(id+1)+'</div>'
        + '<div class="mid"><div class="h">'+esc(host)+'</div><div class="m">'+per+' VS '+per+' · A '+a+'/'+per+' · B '+b+'/'+per+'</div></div>'
        + '<span class="badge '+(waiting?'wait':'play')+'">'+(waiting?'รอผู้เล่น':'กำลังสู้')+'</span>';
      var btn = document.createElement('button'); btn.className = 'btn red'; btn.textContent = 'เข้าร่วม';
      if (!waiting || full) btn.disabled = true;
      btn.onclick = function(){ emit('pvp:act','join:'+id); };
      el.appendChild(btn); box.appendChild(el);
    });
  });

  /* ================= ล็อบบี้ ================= */
  function renderSlots(boxId, names, per, team, myTeam, host){
    var box = $(boxId); box.innerHTML = '';
    for (var i = 0; i < per; i++){
      var d = document.createElement('div');
      if (names[i]){
        d.className = 'slot fill' + (names[i] === S.myName ? ' me' : '');
        d.innerHTML = (names[i] === host ? '<span class="crown">&#9733;</span>' : '') + esc(names[i]);
      } else {
        d.className = 'slot empty-slot';
        d.textContent = (myTeam === team) ? 'ว่าง' : '+ ย้ายมาทีมนี้';
        (function(t){ d.onclick = function(){ if (myTeam !== t) emit('pvp:act','team:'+t); }; })(team);
      }
      box.appendChild(d);
    }
  }
  on('pvp:room', function(str){
    if (!str || str === 'none'){ S.room = null; show('vMain'); return; }
    var p = String(str).split('|');
    var r = { id:+p[0], per:+p[1], st:+p[2], host:p[3], isHost:+p[4] === 1, team:+p[5],
              a:(p[6]||'').split(',').filter(Boolean), b:(p[7]||'').split(',').filter(Boolean) };
    S.myName = p[8] || S.myName; S.room = r;
    $('lbId').textContent = '#' + (r.id + 1);
    $('lbMode').textContent = r.per + ' VS ' + r.per;
    $('lbHost').textContent = nm(r.host);
    $('cntA').textContent = r.a.length + '/' + r.per;
    $('cntB').textContent = r.b.length + '/' + r.per;
    renderSlots('slotsA', r.a, r.per, 0, r.team, r.host);
    renderSlots('slotsB', r.b, r.per, 1, r.team, r.host);
    var badge = $('lbState');
    badge.className = 'badge ' + (r.st === 1 ? 'wait' : 'play');
    badge.textContent = r.st === 1 ? 'รอผู้เล่น' : (r.st === 2 ? 'กำลังเริ่ม' : 'กำลังสู้');
    var canStart = r.isHost && r.st === 1 && r.a.length >= 1 && r.a.length === r.b.length;
    $('doStart').disabled = !canStart;
    $('doStart').style.display = r.isHost ? '' : 'none';
    $('doLeave').disabled = r.st !== 1;
    $('lbTip').textContent = r.isHost
      ? 'แตะช่องว่างเพื่อย้ายทีม · กดเริ่มเกมได้เมื่อสองทีมมีคนเท่ากัน หรือรอให้เต็มแล้วเริ่มเอง'
      : 'แตะช่องว่างเพื่อย้ายทีม · รอเจ้าของห้องเริ่ม หรือเริ่มอัตโนมัติเมื่อสองทีมเต็ม';
    show('vLobby');
  });

  /* ================= เปิด/ปิด + HUD ================= */
  on('pvp:show', function(v){
    v = +v;
    $('overlay').classList.toggle('hidden', v !== 1);
    $('hud').classList.toggle('hidden', v !== 2);
    if (v === 0){ $('banner').classList.add('hidden'); }
    if (v === 2){ $('banner').classList.add('hidden'); }
  });
  on('pvp:hud', function(str){
    var p = String(str||'').split('|'), my = +p[4];
    $('hudAn').textContent = p[0]; $('hudBn').textContent = p[1];
    $('hudAt').textContent = '/' + p[2]; $('hudBt').textContent = '/' + p[3];
    $('hudA').classList.toggle('mine', my === 0);
    $('hudB').classList.toggle('mine', my === 1);
  });
  on('pvp:end', function(str){
    var p = String(str||'').split('|'), win = +p[0], my = +p[1], b = $('banner');
    b.className = (win === -1) ? 'draw' : (win === my ? 'win' : 'lose');
    $('bnT').textContent = (win === -1) ? 'เสมอ' : (win === my ? 'ชนะ' : 'แพ้');
    $('bnS').textContent = (win === -1) ? 'DRAW' : (win === 0 ? 'ทีม A ชนะ' : 'ทีม B ชนะ');
  });

  /* ================= โหมดตัวอย่าง (เปิดไฟล์นี้ในเบราว์เซอร์) ================= */
  if (DEMO){
    $('overlay').classList.remove('hidden');
    handlers['pvp:rooms']('0:2:Somchai_K:1:0:1;1:3:Mike_Wolf:3:3:3;');
    document.getElementById('goJoin').addEventListener('click', function(){});
    window.__demoLobby = function(){ handlers['pvp:room']('0|2|1|Somchai_K|1|0|Somchai_K,Ton_Z|Mike_W|Somchai_K'); };
    window.__demoHud = function(){ handlers['pvp:show'](2); handlers['pvp:hud']('2|1|2|2|0|2'); };
  }
})();
</script>
