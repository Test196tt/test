<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boombox</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#00e676;--g2:#00b050;--gd:#0a3d22;--bg:#050805;--card:#0b110c;--line:#12301d;--tx:#d8f5e2;--mut:#6f9a80;--red:#ff5252}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;background:transparent;font-family:'Sarabun','Noto Sans Thai',system-ui,sans-serif;color:var(--tx);overflow:hidden}
#wrap{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55)}
#wrap.on{display:flex}
.box{width:min(92vw,400px);background:linear-gradient(160deg,#0d160f,var(--bg));border:1px solid var(--g2);border-radius:18px;box-shadow:0 0 0 1px #000,0 0 28px rgba(0,230,118,.22);padding:16px;animation:in .22s ease-out}
@keyframes in{from{transform:translateY(14px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.led{width:10px;height:10px;border-radius:50%;background:#2a3a2f;box-shadow:0 0 0 2px #000}
.led.on{background:var(--g);box-shadow:0 0 10px var(--g)}
.led.warn{background:#ffd54f;box-shadow:0 0 10px #ffd54f;animation:bl 1s infinite}
.led.err{background:var(--red);box-shadow:0 0 10px var(--red)}
@keyframes bl{50%{opacity:.25}}
h1{flex:1;font-size:18px;letter-spacing:3px;color:var(--g);font-weight:700}
h1 small{font-size:11px;letter-spacing:1px;color:var(--mut);font-weight:400;margin-left:6px}
.x{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--g);font-size:16px;cursor:pointer}
.x:active{background:var(--gd)}
.disp{background:#000;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.eq{display:flex;align-items:flex-end;gap:4px;height:54px;margin-bottom:10px}
.eq i{flex:1;background:linear-gradient(to top,var(--g2),var(--g));border-radius:2px;height:8%;opacity:.35}
.eq.play i{opacity:1;animation:eq .9s ease-in-out infinite}
@keyframes eq{0%,100%{height:12%}50%{height:96%}}
.lbl{font-size:11px;color:var(--mut);letter-spacing:1px;margin-bottom:2px}
.song{font-size:15px;font-weight:600;color:var(--g);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{font-size:12px;color:var(--mut);margin-top:4px;min-height:16px}
.st.err{color:var(--red)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.b{padding:13px 8px;border-radius:12px;border:1px solid var(--g2);background:var(--card);color:var(--g);font:600 14px 'Sarabun',sans-serif;cursor:pointer;transition:.12s}
.b:active{transform:scale(.97);background:var(--gd)}
.b.main{background:linear-gradient(135deg,var(--g2),var(--g));color:#021a0c;border-color:var(--g)}
.b.full{grid-column:1/3}
.b.dng{border-color:#6b2a2a;color:var(--red)}
.b[disabled]{opacity:.3;pointer-events:none}
.hint{margin-top:10px;font-size:11px;color:var(--mut);text-align:center}
</style>
</head>
<body>
<div id="wrap">
  <div class="box">
    <div class="top">
      <span class="led" id="led"></span>
      <h1>BOOMBOX<small>ลำโพง</small></h1>
      <button class="x" id="bx">✕</button>
    </div>
    <div class="disp">
      <div class="eq" id="eq"></div>
      <div class="lbl">NOW PLAYING</div>
      <div class="song" id="song">-</div>
      <div class="st" id="st"></div>
    </div>
    <div class="grid">
      <button class="b main full" id="bplace">สะพายลำโพง</button>
      <button class="b main" id="bsearch">ค้นหาเพลง</button>
      <button class="b" id="bstop">หยุดเพลง</button>
      <button class="b dng full" id="bpick">เก็บลำโพง</button>
    </div>
    <div class="hint">พิมพ์ชื่อเพลง หรือวางลิงก์ YouTube ในช่องที่เด้งขึ้นมา</div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const C=window.cef;
const emit=(n,...a)=>{try{C.emit(n,...a)}catch(e){console.log('emit',n,a)}};
const eq=$('eq');for(let i=0;i<14;i++){const b=document.createElement('i');b.style.animationDelay=(i*0.07)+'s';b.style.animationDuration=(0.6+(i%5)*0.15)+'s';eq.appendChild(b)}
const ERR={E_SERVER:'ติดต่อเซิร์ฟเวอร์เพลงไม่ได้',E_TIMEOUT:'โหลดเพลงนานเกินไป ลองใหม่อีกครั้ง',E_BAD:'เซิร์ฟเวอร์เพลงตอบกลับผิดรูปแบบ'};
// payload จากเซิร์ฟเวอร์ = "placed|state|title"  state: 0 ว่าง, 1 กำลังค้นหา, 2 กำลังเล่น, 3 ผิดพลาด
function render(s){
  const p=String(s).split('|'),placed=p[0]==='1',st=+p[1]||0,title=p.slice(2).join('|');
  const led=$('led'),stx=$('st'),song=$('song');
  led.className='led'+(st===2?' on':st===1?' warn':st===3?' err':placed?' on':'');
  eq.className='eq'+(st===2?' play':'');
  stx.className='st'+(st===3?' err':'');
  song.textContent=st===2?(title||'-'):'-';
  stx.textContent=!placed?'ยังไม่ได้สะพายลำโพง':st===1?'กำลังค้นหา / โหลดเพลง... (10-30 วินาที)':st===2?'กำลังเล่นเพลง':st===3?(ERR[title]||title||'เกิดข้อผิดพลาด'):'พร้อมใช้งาน ยังไม่ได้เปิดเพลง';
  $('bplace').style.display=placed?'none':'';
  $('bpick').style.display=placed?'':'none';
  $('bsearch').disabled=!placed;$('bstop').disabled=!placed;
}
const show=on=>$('wrap').classList.toggle('on',on);
if(C&&C.on){
  C.on('boombox:open',s=>{render(s);show(true)});
  C.on('boombox:state',s=>render(s));
  C.on('boombox:close',()=>show(false));
}
$('bx').onclick=()=>emit('boombox:close');
$('bplace').onclick=()=>emit('boombox:place');
$('bpick').onclick=()=>emit('boombox:pickup');
$('bsearch').onclick=()=>emit('boombox:search');
$('bstop').onclick=()=>emit('boombox:stop');
// ทดสอบในเบราว์เซอร์ปกติ: เปิดหน้านี้แล้วพิมพ์ใน console เช่น __t('1|2|ชื่อเพลง')
window.__t=s=>{render(s);show(true)};
if(!C)window.__t('1|2|Demo Song - Artist');
</script>
</body>
</html>
