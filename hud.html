<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>HUD</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --s:.6;              /* ขนาดรวม (1 = ปกติ) */
  --left:14px;         /* ระยะจากขอบซ้าย */
  --bottom:14px;       /* ระยะจากขอบล่าง */
  /* ชุดสีเดียวกับ speedo */
  --blue0:#0f5fb8;     /* น้ำเงินเข้ม (ปลายหลอด) */
  --blue:#1d6fd0;      /* น้ำเงินกลาง */
  --blue2:#2aa8ff;     /* น้ำเงินสว่าง (ปลายหลอด) */
  --ice:#a8dcff;       /* ฟ้าอ่อน ใช้กับเกราะ */
  --dim:#1a1e26;      /* พื้นหลอดว่าง */
  --lbl:#3c4350;       /* สีป้ายข้อความ */
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:transparent;overflow:hidden;pointer-events:none;user-select:none;
  font-family:Kanit,"Noto Sans Thai",Tahoma,sans-serif}
#hud{position:fixed;left:var(--left);bottom:var(--bottom);width:470px;height:92px;
  transform:scale(var(--s)) translateY(24px);transform-origin:left bottom;opacity:0;
  transition:opacity .3s,transform .4s cubic-bezier(.2,.9,.3,1.1)}
#hud.on{opacity:1;transform:scale(var(--s))}
.bg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}

/* ป้ายข้อความ */
.lb{position:absolute;color:var(--lbl);font:500 11px/1 Kanit,sans-serif;letter-spacing:3px;white-space:nowrap}
.lb b{color:#8fa6c4;font-weight:600;letter-spacing:1.5px}
#l-hp{left:52px;top:11px}
#l-id{left:92px;top:11px}
#l-ar{right:182px;top:11px;text-align:right}
.val{position:absolute;color:#f4f6fa;font-weight:600;line-height:1;white-space:nowrap}
#hpv{left:50px;top:21px;font-size:32px}
#arv{right:182px;top:27px;font-size:22px;text-align:right}

/* หลอด (ปลายเฉียงแบบเดียวกับ speedo) */
.trk{position:absolute;left:46px;width:254px;background:var(--dim);
  clip-path:polygon(9px 0,100% 0,calc(100% - 9px) 100%,0 100%)}
#t-hp{top:57px;height:15px}
#t-ar{top:76px;height:6px}
.fill{position:absolute;left:0;top:0;bottom:0;width:100%;transition:width .35s ease;
  clip-path:polygon(9px 0,100% 0,calc(100% - 9px) 100%,0 100%)}
#hfill{background:linear-gradient(90deg,var(--blue0),var(--blue2))}
#hfill::after{content:"";position:absolute;left:0;right:0;top:0;height:42%;background:rgba(255,255,255,.14)}
#afill{width:0;background:linear-gradient(90deg,var(--blue),var(--ice))}

/* วงกลม หิว/น้ำ */
.mini{position:absolute;top:14px;width:54px;height:54px}
#m-hg{left:322px}#m-wt{left:386px}
.mini svg{position:absolute;inset:0;width:100%;height:100%}
.prog{transition:stroke-dasharray .4s ease}
.num{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);background:#000;color:#fff;
  font:600 10px/13px Kanit,sans-serif;padding:0 7px;border-radius:7px;border:1px solid #0b1522}

/* เลือด/ของใกล้หมด กะพริบ */
.low #hfill,.low #hpv{animation:blink .6s infinite alternate}
.mini.low svg{animation:blink .6s infinite alternate}
@keyframes blink{from{opacity:1}to{opacity:.3}}
</style>
</head>
<body>
<div id="hud">
  <!-- แผงพื้นหลัง -->
  <svg class="bg" viewBox="0 0 470 92">
    <defs>
      <radialGradient id="pg" cx=".4" cy=".5" r=".7"><stop offset="0" stop-color="#101b2e"/><stop offset=".6" stop-color="#0a0d12"/><stop offset="1" stop-color="#07080a"/></radialGradient>
    </defs>
    <path d="M26 3H444L467 46L444 89H26L3 46Z" fill="url(#pg)" stroke="#050607" stroke-width="4" stroke-linejoin="round"/>
    <path d="M26 3H444L467 46L444 89H26L3 46Z" fill="none" stroke="var(--blue)" stroke-opacity=".28" stroke-width="1" stroke-linejoin="round"/>
  </svg>

  <div class="lb" id="l-hp">HP</div>
  <div class="lb" id="l-id"><b>ID : <span id="uid">0</span></b></div>
  <div class="lb" id="l-ar">ARMOR</div>
  <div class="val" id="hpv">100%</div>
  <div class="val" id="arv">0</div>

  <div class="trk" id="t-hp"><div class="fill" id="hfill"></div></div>
  <div class="trk" id="t-ar"><div class="fill" id="afill"></div></div>

  <!-- หิว -->
  <div class="mini" id="m-hg">
    <svg viewBox="0 0 54 54">
      <defs><linearGradient id="gh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f5fb8"/><stop offset="1" stop-color="#2aa8ff"/></linearGradient></defs>
      <circle cx="27" cy="27" r="26.5" fill="#000"/>
      <circle cx="27" cy="27" r="21" fill="none" stroke="#1a1e26" stroke-width="4"/>
      <circle class="prog" id="pg-hg" cx="27" cy="27" r="21" fill="none" stroke="url(#gh)" stroke-width="4" pathLength="100" stroke-dasharray="0 100" transform="rotate(-90 27 27)"/>
      <circle cx="27" cy="27" r="16" fill="#0a0d12"/>
      <g fill="#f2f2f4"><path d="M20.5 18h1.5v5.5h1.2V18h1.5v5.5h1.2V18h1.5v6.2a3 3 0 0 1-2.4 2.9V36h-2.1v-8.9a3 3 0 0 1-2.4-2.9z" transform="translate(-1.5 0)"/><path d="M31.2 18c2 .8 3.3 3.4 3.3 6.4h-1.6V36h-2.1z" transform="translate(1.5 0)"/></g>
    </svg>
    <div class="num" id="n-hg">100</div>
  </div>

  <!-- น้ำ -->
  <div class="mini" id="m-wt">
    <svg viewBox="0 0 54 54">
      <defs><linearGradient id="gw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f5fb8"/><stop offset="1" stop-color="#2aa8ff"/></linearGradient></defs>
      <circle cx="27" cy="27" r="26.5" fill="#000"/>
      <circle cx="27" cy="27" r="21" fill="none" stroke="#1a1e26" stroke-width="4"/>
      <circle class="prog" id="pg-wt" cx="27" cy="27" r="21" fill="none" stroke="url(#gw)" stroke-width="4" pathLength="100" stroke-dasharray="0 100" transform="rotate(-90 27 27)"/>
      <circle cx="27" cy="27" r="16" fill="#0a0d12"/>
      <path d="M27 16.5C23 22 19.5 25.5 19.5 30a7.5 7.5 0 0 0 15 0C34.5 25.5 31 22 27 16.5z" fill="#f2f2f4"/>
    </svg>
    <div class="num" id="n-wt">100</div>
  </div>
</div>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  function clamp(v){v=Math.round(Number(v));return isNaN(v)?0:Math.max(0,Math.min(100,v))}

  // hud:update -> [hp, armor, hunger, thirst, show, uid]
  function apply(hp,ar,hg,wt,show,uid){
    hp=clamp(hp);ar=clamp(ar);hg=clamp(hg);wt=clamp(wt);
    $('hfill').style.width=hp+'%';
    $('hpv').textContent=hp+'%';
    $('afill').style.width=ar+'%';
    $('arv').textContent=ar;
    $('pg-hg').style.strokeDasharray=hg+' 100';
    $('pg-wt').style.strokeDasharray=wt+' 100';
    $('n-hg').textContent=hg;$('n-wt').textContent=wt;
    $('hud').classList.toggle('low',hp<=25);
    $('m-hg').classList.toggle('low',hg<=20);
    $('m-wt').classList.toggle('low',wt<=20);
    if(uid!==undefined)$('uid').textContent=Math.round(Number(uid))||0;
    if(show!==undefined)$('hud').classList.toggle('on',Number(show)===1);
  }
  function onUpdate(d){if(Array.isArray(d))apply.apply(null,d)}

  window.addEventListener('cef:hud:update',function(e){onUpdate(e.detail)});

  function bind(){
    if(!window.cef||!cef.on)return false;
    cef.on('hud:update',function(){
      var a=[].slice.call(arguments),x=a[0];
      if(a.length==1){if(typeof x=='string'&&x[0]=='[')try{x=JSON.parse(x)}catch(_){}if(Array.isArray(x))a=x}
      onUpdate(a);
    });return true;
  }
  if(!bind()){var iv=setInterval(function(){if(bind())clearInterval(iv)},100)}

  // โหมดทดสอบ: เปิดไฟล์ด้วย ?demo
  if(/[?&]demo/.test(location.search)){
    document.body.style.background='#2a2f38';
    var t=0;apply(100,100,100,100,1,59);
    setInterval(function(){t++;apply(20+Math.round(80*Math.abs(Math.sin(t/6))),Math.round(100*Math.abs(Math.cos(t/9))),Math.max(0,100-t%100),70,1,59)},700);
  }
})();
</script>
</body>
</html>
