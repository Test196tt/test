<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Melvy Town HUD</title>
<style>
:root{
  --s:1;                 /* ขนาดรวมของ HUD (1 = ปกติ, 1.2 = ใหญ่ขึ้น) */
  --left:14px;           /* ระยะจากขอบซ้าย */
  --bottom:14px;         /* ระยะจากขอบล่าง */
  --red:#ff2a3d; --red2:#c1121f; --red3:#6b0610;
  --glass:rgba(26,2,6,.74);
}
html,body{margin:0;height:100%;background:transparent;overflow:hidden;pointer-events:none;
  -webkit-user-select:none;user-select:none;font-family:"Segoe UI",Roboto,Arial,sans-serif}
#hud{position:fixed;left:var(--left);bottom:var(--bottom);display:flex;align-items:center;
  transform:scale(var(--s));transform-origin:left bottom;opacity:0;transition:opacity .25s}
#hud.on{opacity:1}

/* ---- กรอบเพชร ---- */
.dia{position:relative;display:flex;align-items:center;justify-content:center;transform:rotate(45deg);
  background:linear-gradient(135deg,#ff5d6b 0%,var(--red2) 100%);
  border:2px solid #fff;box-shadow:0 0 10px rgba(255,42,61,.7),inset 0 0 6px rgba(255,255,255,.4)}
.dia>*{transform:rotate(-45deg)}
.dia.big{width:36px;height:36px;border-radius:10px;z-index:3}
.dia.sm{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#3a0810,#1c0206);
  border-color:rgba(255,255,255,.9);box-shadow:0 0 8px rgba(255,42,61,.45)}
.dia.big svg{width:20px;height:20px;fill:#fff;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}

/* ---- แถบเลือด ---- */
.bar{position:relative;width:196px;height:28px;margin-left:-16px;border-radius:6px 14px 14px 6px;
  background:var(--glass);border:1.5px solid rgba(255,255,255,.85);overflow:hidden;
  box-shadow:0 0 10px rgba(255,42,61,.45)}
.fill{position:absolute;left:0;top:0;bottom:0;width:100%;
  background:linear-gradient(180deg,#ff7885 0%,#f0182d 50%,#a30c1b 100%);transition:width .35s ease}
.fill::after{content:"";position:absolute;left:0;right:0;top:0;height:42%;background:rgba(255,255,255,.22)}
.lbl{position:absolute;left:24px;top:0;bottom:0;display:flex;align-items:center;color:#fff;
  font-weight:800;font-size:12px;letter-spacing:.3px;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.logo{position:absolute;left:58px;top:50%;height:34px;transform:translateY(-50%);
  filter:drop-shadow(0 0 3px rgba(0,0,0,.45))}
.pct{position:absolute;right:9px;top:0;bottom:0;display:flex;align-items:center;color:#fff;
  font-weight:800;font-size:12px;text-shadow:0 1px 2px rgba(0,0,0,.7)}

/* ---- เพชรเล็ก (เกราะ / หิว / น้ำ) ---- */
.minis{display:flex;gap:14px;margin-left:12px}
.mini{position:relative;width:34px;height:36px;display:flex;align-items:center;justify-content:center}
.num{color:#fff;font-weight:800;font-size:10px;text-shadow:0 1px 1px rgba(0,0,0,.7)}
.ico{position:absolute;right:-5px;bottom:-4px;width:16px;height:16px;fill:#fff;
  filter:drop-shadow(0 0 2px rgba(0,0,0,.8))}
.mini.low .dia{background:linear-gradient(135deg,#ff5d6b,var(--red2));animation:pulse .8s infinite alternate}
@keyframes pulse{from{box-shadow:0 0 4px rgba(255,42,61,.4)}to{box-shadow:0 0 14px rgba(255,42,61,1)}}
.bar.low{animation:pulse .8s infinite alternate}
</style>
</head>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  function clamp(v){v=Math.round(Number(v));return isNaN(v)?0:Math.max(0,Math.min(100,v))}

  // hud:update  ->  [hp, armor, hunger, thirst, show]
  function apply(hp,ar,hg,wt,show){
    hp=clamp(hp);ar=clamp(ar);hg=clamp(hg);wt=clamp(wt);
    $('fill').style.width=hp+'%';
    $('hp').textContent=hp+'%';
    $('bar').classList.toggle('low',hp<=25);
    $('ar').textContent=ar; $('hg').textContent=hg; $('wt').textContent=wt;
    $('m-ar').classList.toggle('low',false);
    $('m-hg').classList.toggle('low',hg<=20);
    $('m-wt').classList.toggle('low',wt<=20);
    $('m-ar').style.opacity=ar>0?1:.55;
    if(show!==undefined) $('hud').classList.toggle('on',Number(show)===1);
  }
  function onUpdate(d){ if(Array.isArray(d)) apply.apply(null,d); }

  // รับ event จากเซิร์ฟเวอร์ (client ส่งเป็น CustomEvent 'cef:<ชื่อ>' ทุกครั้ง)
  window.addEventListener('cef:hud:update',function(e){onUpdate(e.detail)});

  // โหมดทดสอบในเบราว์เซอร์: เปิดไฟล์ด้วย ?demo
  if(/[?&]demo/.test(location.search)){
    var t=0;apply(79,56,13,56,1);
    setInterval(function(){t++;apply(50+Math.round(50*Math.abs(Math.sin(t/6))),56,Math.max(0,100-t%100),70,1)},700);
  }
})();
</script>
