<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>HUD</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --s:.5;              /* ขนาดรวม (1 = ปกติ) */
  --left:14px;         /* ระยะจากขอบซ้าย */
  --bottom:14px;       /* ระยะจากขอบล่าง */
  /* สีโทนเดียวกับ UI รถ (speedo) */
  --hp-a:#00a000;      /* สีหลอดเลือด ฝั่งซ้าย */
  --hp-b:#00e000;      /* สีหลอดเลือด ฝั่งขวา */
  --hp-w:1;            /* ความยาวหลอด (1 = ปกติ) */
  --hp-h:1;            /* ความหนาหลอด (1 = ปกติ) */
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:transparent;overflow:hidden;pointer-events:none;user-select:none;
  font-family:Kanit,"Noto Sans Thai",Tahoma,sans-serif}
#hud{position:fixed;left:var(--left);bottom:var(--bottom);width:508px;height:100px;
  transform:scale(var(--s)) translateY(24px);transform-origin:left bottom;opacity:0;
  transition:opacity .3s,transform .4s cubic-bezier(.2,.9,.3,1.1)}
#hud.on{opacity:1;transform:scale(var(--s))}
#hud svg{width:100%;height:100%;overflow:visible;display:block}
.t{fill:#e6e9ef;font-family:Kanit,"Noto Sans Thai",sans-serif}
#hptxt{font-size:15px;font-weight:700}
#uidtop{font-size:12px;font-weight:600;letter-spacing:.3px}
#armtxt{font-size:10.5px;font-weight:700;letter-spacing:.6px;fill:#0e0e11}
.gn{font-size:9px;font-weight:600;text-anchor:middle}
.bar{transition:width .35s ease}
.ring{transition:stroke-dasharray .4s ease}
.low #hfill,.low #hptxt{animation:blink .6s infinite alternate}
.lowi{animation:blink .6s infinite alternate}
@keyframes blink{from{opacity:1}to{opacity:.3}}
</style>
</head>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  function clamp(v){v=Math.round(Number(v));return isNaN(v)?0:Math.max(0,Math.min(100,v))}
  var uidNow=0;
  var root=document.documentElement;
  var HPW=312, ARW=256;

  // ปรับความยาว/ความหนา "หลอดเลือด"
  function hpSize(){
    var cs=getComputedStyle(root);
    var w=parseFloat(cs.getPropertyValue('--hp-w')),h=parseFloat(cs.getPropertyValue('--hp-h'));
    if(isNaN(w)||w<=0)w=1;if(isNaN(h)||h<=0)h=1;
    $('hpBar').setAttribute('transform','translate(85 49) scale('+w+' '+h+') translate(-85 -49)');
  }
  // hpStyle(สีซ้าย, สีขวา, ความยาว, ความหนา)  เช่น hpStyle('#a00','#f33',1.1,1.2)
  function hpStyle(a,b,w,h){
    if(a)root.style.setProperty('--hp-a',a);
    if(b)root.style.setProperty('--hp-b',b);
    if(w!=null&&w!=='')root.style.setProperty('--hp-w',w);
    if(h!=null&&h!=='')root.style.setProperty('--hp-h',h);
    hpSize();
  }
  window.hpStyle=hpStyle;

  function ring(el,v){el.setAttribute('stroke-dasharray',v+' '+(100-v))}

  // hud:update -> [hp, armor, hunger, thirst, show, uid, stamina]  (stamina = พลังงานการวิ่ง ไม่ส่งมา = 100)
  function apply(hp,ar,hg,wt,show,uid,stam){
    hp=clamp(hp);ar=clamp(ar);hg=clamp(hg);wt=clamp(wt);
    $('hfill').style.width=(HPW*hp/100)+'px';
    $('hptxt').textContent=hp+'%';
    $('arfill').style.width=(ARW*ar/100)+'px';
    var st=Number(stam);st=(stam===undefined||stam===null||isNaN(st))?100:clamp(st);
    ring($('rSt'),st);$('emb').classList.toggle('lowi',st<=20);
    ring($('rHg'),hg);ring($('rWt'),wt);
    $('hgtxt').textContent=hg;$('wttxt').textContent=wt;
    $('hud').classList.toggle('low',hp<=25);
    $('bHg').classList.toggle('lowi',hg<=20);
    $('bWt').classList.toggle('lowi',wt<=20);
    if(uid!==undefined&&uid!==null){var u=Math.round(Number(uid));uidNow=(isNaN(u)||u<0)?0:u}
    $('uidtop').textContent='ID : '+uidNow;
    if(show!==undefined)$('hud').classList.toggle('on',Number(show)===1);
  }
  function onUpdate(d){if(Array.isArray(d))apply.apply(null,d)}

  window.addEventListener('cef:hud:update',function(e){onUpdate(e.detail)});
  window.addEventListener('cef:hud:hpstyle',function(e){var d=e.detail||[];hpStyle(d[0],d[1],d[2],d[3])});

  function bind(){
    if(!window.cef||!cef.on)return false;
    cef.on('hud:update',function(){
      var a=[].slice.call(arguments),x=a[0];
      if(a.length==1){if(typeof x=='string'&&x[0]=='[')try{x=JSON.parse(x)}catch(_){}if(Array.isArray(x))a=x}
      onUpdate(a);
    });
    cef.on('hud:hpstyle',function(a,b,w,h){hpStyle(a,b,w,h)});
    return true;
  }
  if(!bind()){var iv=setInterval(function(){if(bind())clearInterval(iv)},100)}

  hpSize();
  apply(100,0,100,100,undefined,0);

  // โหมดทดสอบ: เปิดไฟล์ด้วย ?demo
  if(/[?&]demo/.test(location.search)){
    document.body.style.background='#2a2f38';
    var t=0;apply(100,100,100,100,1,59,100);
    setInterval(function(){t++;apply(20+Math.round(80*Math.abs(Math.sin(t/6))),Math.round(100*Math.abs(Math.cos(t/9))),Math.max(0,100-t%100),70,1,59,Math.round(100*Math.abs(Math.sin(t/4))))},700);
  }
})();
</script>
