<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Melvy Town HUD</title>
<style>
:root{
  --s:.7;               /* ขนาดรวมของ HUD (1 = ปกติ, 1.2 = ใหญ่ขึ้น) */
  --left:14px;           /* ระยะจากขอบซ้าย */
  --bottom:14px;         /* ระยะจากขอบล่าง */
  --hp-a:#083f66;        /* หลอดเลือด ปลายซ้าย */
  --hp-b:#0b5a96;        /* หลอดเลือด ปลายขวา */
  --wm-op:.14;           /* โลโก้เทาจางเต็มหลอดเลือด 0 = ปิด, .1 = จางมาก, .3 = ชัดขึ้น */
  --stripe-a:0;          /* ลายเส้นเฉียงในหลอดว่าง 0 = ปิด, .035 = เปิด */
  --ring:#0a78d0;        /* วงเพชรหิว/น้ำ */
  --edge:#0c0c0c;        /* ขอบดำนอกสุด */
  --body:#202020;        /* พื้นกรอบ */
  --track:#2e2e2e;       /* พื้นหลอดว่าง */
}
html,body{margin:0;height:100%;background:transparent;overflow:hidden;pointer-events:none;
  -webkit-user-select:none;user-select:none;font-family:"Segoe UI",Roboto,Arial,sans-serif}
#hud{position:fixed;left:var(--left);bottom:var(--bottom);width:292px;height:70px;
  transform:scale(var(--s));transform-origin:left bottom;opacity:0;transition:opacity .25s}
#hud.on{opacity:1}

/* ---- แท็บบน: ID / วันที่-เวลา (สี่เหลี่ยมคางหมูเฉียง) ---- */
.tab{position:absolute;top:0;height:19px;background:var(--edge)}
.tab>div{position:absolute;inset:1.5px;background:var(--body);display:flex;align-items:center;justify-content:space-around;
  color:#fff;font-weight:800;font-size:9.5px;letter-spacing:.4px;white-space:nowrap;
  text-shadow:-1px 0 #000,1px 0 #000,0 -1px #000,0 1px #000}
#t-id{left:0;width:64px;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 100%,0 100%)}
#t-id>div{clip-path:polygon(0 0,calc(100% - 9px) 0,calc(100% - 1px) 100%,0 100%);padding-right:6px;justify-content:center;white-space:pre}
#t-dt{left:58px;width:140px;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 100%,10px 100%)}
#t-dt>div{clip-path:polygon(0 0,calc(100% - 9px) 0,calc(100% - 11px) 100%,10px 100%);padding:0 6px 0 8px}

/* ---- แผงหลัก (HP + เกราะ) ทรงลูกศร ---- */
.panel{position:absolute;left:0;top:23px;width:204px;height:46px;background:var(--edge);
  clip-path:polygon(0 0,calc(100% - 24px) 0,100% 25px,calc(100% - 24px) 100%,14px 100%,0 calc(100% - 13px))}
.pin{position:absolute;inset:2px;background:var(--body);
  clip-path:polygon(0 0,calc(100% - 23px) 0,100% 24px,calc(100% - 23px) 100%,13px 100%,0 calc(100% - 12px))}

/* หลอดเลือด */
#bar{position:absolute;left:2px;top:2px;right:2px;height:23px;background:var(--track);overflow:hidden;
  clip-path:polygon(0 0,calc(100% - 20px) 0,100% 100%,0 100%)}
#bar::after{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(135deg,rgba(255,255,255,var(--stripe-a)) 0 6px,transparent 6px 12px)}
#fill{position:absolute;left:0;top:0;bottom:0;width:100%;transition:width .35s ease;
  background:linear-gradient(90deg,var(--hp-a),var(--hp-b));
  clip-path:polygon(0 0,calc(100% - 9px) 0,100% 100%,0 100%)}
.wm{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 38%;
  filter:grayscale(1) brightness(1.1);opacity:var(--wm-op);z-index:2;pointer-events:none}
.lbl{position:absolute;left:11px;top:0;bottom:0;z-index:3;display:flex;align-items:center;color:#fff;
  font-weight:800;font-size:10.5px;letter-spacing:.6px;white-space:nowrap;
  text-shadow:0 1px 2px rgba(0,0,0,.6)}
#bar.low{animation:blink .8s infinite alternate}

/* หลอดเกราะ: ลายเฉียง 3 ขีดทางซ้าย + หลอดเทา */
#arow{position:absolute;left:2px;top:27px;height:13px;right:28px}
.st{position:absolute;top:0;bottom:0;width:9px;background:#3d3d3d;
  clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
#abar{position:absolute;left:38px;right:0;top:0;bottom:0;background:var(--track);overflow:hidden;
  clip-path:polygon(7px 0,100% 0,calc(100% - 12px) 100%,0 100%)}
#afill{position:absolute;left:0;top:0;bottom:0;width:0%;transition:width .35s ease;
  background:linear-gradient(180deg,#d8d8d8,#8c8c8c);
  clip-path:polygon(0 0,100% 0,calc(100% - 9px) 100%,0 100%)}
#abar .lbl{left:16px;font-size:6.5px;letter-spacing:.8px;text-shadow:0 1px 1px rgba(0,0,0,.7)}

/* ---- เพชรเล็ก (หิว / น้ำ): วงฟ้าวิ่งตามเข็มจากยอดบน ตามค่า ---- */
.mini{position:absolute;top:26px;width:40px;height:40px;z-index:2}
#m-hg{left:208px}
#m-wt{left:249px}
.dm{position:absolute;left:0;top:0;width:40px;height:40px;overflow:visible}
.mini .ic{position:absolute;left:14px;top:14px;width:12px;height:12px;fill:#fff}
.prog{fill:none;stroke:var(--ring);stroke-width:2.6;stroke-linejoin:round;transition:stroke-dasharray .4s ease}
.mini.low .dm{animation:blink .8s infinite alternate}
@keyframes blink{from{opacity:1}to{opacity:.55}}
</style>
</head>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  function clamp(v){v=Math.round(Number(v));return isNaN(v)?0:Math.max(0,Math.min(100,v))}
  function pad(n){return n<10?'0'+n:''+n}

  // hud:update  ->  [hp, armor, hunger, thirst, show, uid]   (uid = ไอดีผู้เล่นที่เริ่มจาก 0 ตอนเข้าเกม เช่น player.id / source)
  function apply(hp,ar,hg,wt,show,uid){
    hp=clamp(hp);ar=clamp(ar);hg=clamp(hg);wt=clamp(wt);
    $('fill').style.width=hp+'%';
    $('hp').textContent=hp;
    $('bar').classList.toggle('low',hp<=25);
    $('afill').style.width=ar+'%';
    $('pg-hg').style.strokeDasharray=hg+' 100';
    $('pg-wt').style.strokeDasharray=wt+' 100';
    $('m-hg').classList.toggle('low',hg<=20);
    $('m-wt').classList.toggle('low',wt<=20);
    if(uid!==undefined) $('uid').textContent=Math.round(Number(uid))||0;
    if(show!==undefined) $('hud').classList.toggle('on',Number(show)===1);
  }
  function onUpdate(d){ if(Array.isArray(d)) apply.apply(null,d); }

  // นาฬิกา (เวลาเครื่องผู้เล่น) รูปแบบ วัน.เดือน.ปี  ชม:นาที:วินาที
  function tick(){
    var d=new Date();
    $('dd').textContent=d.getDate()+'.'+(d.getMonth()+1)+'.'+d.getFullYear();
    $('tt').textContent=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
  }
  tick(); setInterval(tick,1000);

  // รับ event จากเซิร์ฟเวอร์ (client ส่งเป็น CustomEvent 'cef:<ชื่อ>' ทุกครั้ง)
  window.addEventListener('cef:hud:update',function(e){onUpdate(e.detail)});

  // โหมดทดสอบในเบราว์เซอร์: เปิดไฟล์ด้วย ?demo
  if(/[?&]demo/.test(location.search)){
    document.body.style.background='#6f6a52';   // พื้นหลังทึบเฉพาะโหมดทดสอบ จะได้เห็น HUD ชัด
    var t=0;apply(80,60,100,55,1,0);
    setInterval(function(){t++;apply(50+Math.round(50*Math.abs(Math.sin(t/6))),Math.round(100*Math.abs(Math.cos(t/9))),Math.max(0,100-t%100),70,1,t%10)},700);
  }
})();
</script>
