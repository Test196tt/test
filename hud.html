<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>HUD</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --s:.6;              /* ขนาดรวม (1 = ปกติ) */
  --left:14px;         /* ระยะจากขอบซ้าย */
  --bottom:14px;       /* ระยะจากขอบล่าง */
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:transparent;overflow:hidden;pointer-events:none;user-select:none;
  font-family:Kanit,"Noto Sans Thai",Tahoma,sans-serif}
#hud{position:fixed;left:var(--left);bottom:var(--bottom);width:555px;height:105px;
  transform:scale(var(--s)) translateY(24px);transform-origin:left bottom;opacity:0;
  transition:opacity .3s,transform .4s cubic-bezier(.2,.9,.3,1.1)}
#hud.on{opacity:1;transform:scale(var(--s))}
#hud svg{width:100%;height:100%;overflow:visible;display:block}
.t{fill:#fff;font-family:Kanit,"Noto Sans Thai",sans-serif}
#hptxt{font-size:44px;font-weight:600;letter-spacing:-1px}
#stxt{font-size:29px;font-weight:500}
#idtxt{font-size:22px;font-weight:600;letter-spacing:-.8px}
#mic{fill:#fff;stroke:#fff}#mic.talk{fill:#2aa8ff;stroke:#2aa8ff}
.bar{transition:width .35s ease}
.ring{transition:stroke-dasharray .4s ease}
.low #hpfill,.low #hptxt{animation:blink .6s infinite alternate}
.lowi{animation:blink .6s infinite alternate}
@keyframes blink{from{opacity:1}to{opacity:.3}}
</style>
</head>
<body>
<div id="hud">
<svg viewBox="245 74 1110 202" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gHp" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b4bb0"/><stop offset="1" stop-color="#1f74e6"/></linearGradient>
    <linearGradient id="gAr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1d6fd0"/><stop offset="1" stop-color="#a8dcff"/></linearGradient>
    <linearGradient id="gAcc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a86ff"/><stop offset=".55" stop-color="#0f5fd0"/><stop offset="1" stop-color="#0a2f6e"/></linearGradient>
    <linearGradient id="gPanel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#03275a"/><stop offset="1" stop-color="#021c40"/></linearGradient>
    <linearGradient id="gEmpty" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34393d"/><stop offset="1" stop-color="#25292c"/></linearGradient>
    <clipPath id="ckHp"><polygon points="497,165 1036,165 1060,218 497,218"/></clipPath>
    <clipPath id="ckAr"><polygon points="505,132 1010,132 1034,160 505,160"/></clipPath>
    <g id="icChicken">
      <ellipse cx="5" cy="-6" rx="14" ry="11" transform="rotate(-40 5 -6)"/>
      <path d="M-2 2L-13 13" stroke="#fff" stroke-width="6" stroke-linecap="round" fill="none"/>
      <circle cx="-16" cy="12" r="4.5"/><circle cx="-11" cy="17" r="4.5"/>
    </g>
    <path id="icDrop" d="M27 16.5C23 22 19.5 25.5 19.5 30a7.5 7.5 0 0 0 15 0C34.5 25.5 31 22 27 16.5z"/>
  </defs>
  <g id="hpg">
    <polygon points="312,126 345,82 598,82 628,108 312,108" fill="#000"/>
    <polygon points="258,128 312,126 330,108 992,108 1097,237 748,239 716,268 345,268 258,150" fill="#000"/>
    <polygon points="505,132 1010,132 1034,160 505,160" fill="url(#gEmpty)"/>
    <g clip-path="url(#ckAr)"><rect class="bar" id="arfill" x="505" y="132" width="0" height="28" fill="#fff"/></g>
    <polygon points="497,165 1036,165 1060,218 497,218" fill="url(#gEmpty)"/>
    <g clip-path="url(#ckHp)" id="hpfill"><rect class="bar" id="hfill" x="497" y="165" width="236" height="53" fill="url(#gHp)"/></g>
    <polygon points="255,142 298,131 352,212 352,258" fill="url(#gAcc)"/>
    <polygon points="255,142 298,131 306,143 262,154" fill="#3b97ff" opacity=".75"/>
    <polygon points="300,132 520,132 520,152 498,190 498,217 352,217" fill="url(#gPanel)"/>
    <polygon points="300,132 520,132 520,136 300,136" fill="#0b3b80" opacity=".6"/>
    <text class="t" id="hptxt" x="417" y="186" text-anchor="middle">HP 100</text>
    <text class="t" id="stxt" x="470" y="119">ปกติ</text>
    <text class="t" id="idtxt" x="372" y="263">ไอดีตัวละคร : 0 00/00/0000</text>
    <g id="mic" stroke-width="3">
      <rect x="398" y="91" width="14" height="23" rx="7" stroke="none"/>
      <path d="M393 106a12 12 0 0 0 24 0" fill="none"/>
      <path d="M405 118V125M398 125H412" fill="none"/>
    </g>
  </g>
  <g id="bHg">
    <path d="M1160 122L1203.3 147.0V197.0L1160 222L1116.7 197.0V147.0Z" fill="#000" stroke="#000" stroke-width="4" stroke-linejoin="round"/>
    <path d="M1160 130L1196.4 151.0V193.0L1160 214L1123.6 193.0V151.0Z" fill="#05070a" stroke="#14233d" stroke-width="6" stroke-linejoin="round"/>
    <path id="rHg" class="ring" d="M1160 130L1196.4 151.0V193.0L1160 214L1123.6 193.0V151.0Z" fill="none" stroke="#1f74e6" stroke-width="6" stroke-linejoin="round" pathLength="100" stroke-dasharray="100 100"/>
    <g fill="#fff"><use href="#icChicken" transform="translate(1161.4 170.4)"/></g>
  </g>
  <g id="bWt">
    <path d="M1255 122L1298.3 147.0V197.0L1255 222L1211.7 197.0V147.0Z" fill="#000" stroke="#000" stroke-width="4" stroke-linejoin="round"/>
    <path d="M1255 130L1291.4 151.0V193.0L1255 214L1218.6 193.0V151.0Z" fill="#05070a" stroke="#14233d" stroke-width="6" stroke-linejoin="round"/>
    <path id="rWt" class="ring" d="M1255 130L1291.4 151.0V193.0L1255 214L1218.6 193.0V151.0Z" fill="none" stroke="#1f74e6" stroke-width="6" stroke-linejoin="round" pathLength="100" stroke-dasharray="100 100"/>
    <g fill="#fff"><use href="#icDrop" transform="translate(1255 172) scale(2.1) translate(-27 -27)"/></g>
  </g>
  </svg>
</div>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  function clamp(v){v=Math.round(Number(v));return isNaN(v)?0:Math.max(0,Math.min(100,v))}
  function p(n){return n<10?'0'+n:n}
  var uidNow=0;

  function setId(){
    var d=new Date();
    $('idtxt').textContent='ไอดีตัวละคร : '+uidNow+' '+p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear();
  }

  // hud:update -> [hp, armor, hunger, thirst, show, uid, status, talk]
  // (status = ข้อความสถานะ, talk = 1 เมื่อกำลังพูดไมค์ — ไม่ส่งก็ได้)
  function apply(hp,ar,hg,wt,show,uid,status,talk){
    hp=clamp(hp);ar=clamp(ar);hg=clamp(hg);wt=clamp(wt);
    $('hfill').style.width=(563*hp/100)+'px';
    $('hptxt').textContent='HP '+hp;
    $('arfill').style.width=(530*ar/100)+'px';
    $('rHg').setAttribute('stroke-dasharray',hg+' 100');
    $('rWt').setAttribute('stroke-dasharray',wt+' 100');
    $('hud').classList.toggle('low',hp<=25);
    $('bHg').classList.toggle('lowi',hg<=20);
    $('bWt').classList.toggle('lowi',wt<=20);
    if(uid!==undefined)uidNow=Math.round(Number(uid))||0;
    setId();
    if(status!==undefined&&status!==null)$('stxt').textContent=String(status);
    if(talk!==undefined)$('mic').classList.toggle('talk',Number(talk)===1);
    if(show!==undefined)$('hud').classList.toggle('on',Number(show)===1);
  }
  function onUpdate(d){if(Array.isArray(d))apply.apply(null,d)}

  window.addEventListener('cef:hud:update',function(e){onUpdate(e.detail)});

  function bind(){
    if(!window.cef||!cef.on)return false;
    cef.on('hud:update',function(){
      var a=[].slice.call(arguments),x=a[0];
      if(a.length==1){if(typeof x=='string'&&x[0]=='[')try{x=JSON.parse(x)}catch(_){}if(Array.isArray(x))a=x}
      onUpdate(a);
    });return true;
  }
  if(!bind()){var iv=setInterval(function(){if(bind())clearInterval(iv)},100)}

  apply(100,0,100,100,undefined,0);

  // โหมดทดสอบ: เปิดไฟล์ด้วย ?demo
  if(/[?&]demo/.test(location.search)){
    document.body.style.background='#2a2f38';
    var t=0;apply(100,100,100,100,1,59,'ปกติ',0);
    setInterval(function(){t++;apply(20+Math.round(80*Math.abs(Math.sin(t/6))),Math.round(100*Math.abs(Math.cos(t/9))),Math.max(0,100-t%100),70,1,59,'ปกติ',t%6<3?1:0)},700);
  }
})();
</script>
</body>
</html>
