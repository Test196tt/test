<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>HUD</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --s:.5;              /* ขนาดรวม (1 = ปกติ) */
  --left:14px;         /* ระยะจากขอบซ้าย */
  --bottom:14px;       /* ระยะจากขอบล่าง */
  /* สีโทนเดียวกับ UI รถ (speedo) */
  --hp-a:#00a000;      /* สีหลอดเลือด ฝั่งซ้าย */
  --hp-b:#00e000;      /* สีหลอดเลือด ฝั่งขวา */
  --hp-w:1;            /* ความยาวหลอด (1 = ปกติ) */
  --hp-h:1;            /* ความหนาหลอด (1 = ปกติ) */
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:transparent;overflow:hidden;pointer-events:none;user-select:none;
  font-family:Kanit,"Noto Sans Thai",Tahoma,sans-serif}
#hud{position:fixed;left:var(--left);bottom:var(--bottom);width:510px;height:100px;
  transform:scale(var(--s)) translateY(24px);transform-origin:left bottom;opacity:0;
  transition:opacity .3s,transform .4s cubic-bezier(.2,.9,.3,1.1)}
#hud.on{opacity:1;transform:scale(var(--s))}
#hud svg{width:100%;height:100%;overflow:visible;display:block}
.t{fill:#e6e9ef;font-family:Kanit,"Noto Sans Thai",sans-serif}
#hptxt{font-size:17px;font-weight:600}
#uidtop{font-size:12px;font-weight:600;letter-spacing:.3px}
#hptxt{font-style:italic}
.sm{font-size:8px;font-weight:600;font-style:italic}
.lb{font-size:24px;font-weight:700;font-style:italic}
.gn{font-size:12px;font-weight:700;text-anchor:middle}
.bar{transition:width .35s ease}
.ring{transition:stroke-dasharray .4s ease}
.low #hfill,.low #hptxt{animation:blink .6s infinite alternate}
.lowi{animation:blink .6s infinite alternate}
@keyframes blink{from{opacity:1}to{opacity:.3}}
</style>
</head>
<body>
<div id="hud">
<svg viewBox="0 0 510 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gHp" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--hp-a)"/><stop offset="1" style="stop-color:var(--hp-b)"/></linearGradient>
    <linearGradient id="gAr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c4c8d0"/><stop offset="1" stop-color="#f2f5fa"/></linearGradient>
    <linearGradient id="gRing" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00a000"/><stop offset="1" stop-color="#22f022"/></linearGradient>
    <linearGradient id="gAcc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00a000"/><stop offset="1" stop-color="#22f022"/></linearGradient>
    <radialGradient id="gCore" cx=".5" cy=".4" r=".8"><stop offset="0" stop-color="#032a06"/><stop offset="1" stop-color="#0e0e11"/></radialGradient>
    <radialGradient id="gBadge" cx=".5" cy=".35" r=".75"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#bfe6bf"/></radialGradient>
    <linearGradient id="gGloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".25"/><stop offset=".5" stop-color="#fff" stop-opacity=".04"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="ckHp"><path d="M90 52H342L326 88H74Z"/></clipPath>
    <clipPath id="ckAr"><rect x="140" y="38" width="130" height="6" rx="3"/></clipPath>
  </defs>

  <g transform="translate(0 0)">

  <text class="t" id="uidtop" x="30" y="45">ID : 0</text>


  <!-- ====== แถบบน: ARMOR / วันที่ / เวลา ====== -->
  <path d="M100 34H356L349 48H93Z" fill="#000" stroke="#000" stroke-width="4" stroke-linejoin="round"/>
  <path d="M100 34H356L349 48H93Z" fill="#15181d"/>
  <text class="t sm" x="103" y="44.2">ARMOR</text>
  <rect x="140" y="38" width="130" height="6" rx="3" fill="#0b0d10"/>
  <g clip-path="url(#ckAr)"><rect class="bar" id="arfill" x="140" y="38" width="0" height="6" fill="url(#gAr)"/></g>
  <path d="M281 34L277 48M322 34L318 48" stroke="#2e333b" stroke-width="1.2"/>
  <text class="t sm" id="dtxt" x="299" y="44.2" text-anchor="middle">00/00/00</text>
  <text class="t sm" id="ttxt" x="337" y="44.2" text-anchor="middle">00:00</text>

  <!-- ====== ป้าย HP ====== -->
  <path d="M8 90L26 52H84L68 90Z" fill="#000" stroke="#000" stroke-width="4" stroke-linejoin="round"/>
  <path d="M8 90L26 52H84L68 90Z" fill="#15181d"/>
  <path d="M7 91L26 51H88" fill="none" stroke="#22f022" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="t lb" x="25" y="79.5">HP</text>

  <!-- ====== แถบเลือด ====== -->
  <path d="M90 52H342L326 88H74Z" fill="#000" stroke="#000" stroke-width="4" stroke-linejoin="round"/>
  <g id="hpBar">
    <path d="M90 52H342L326 88H74Z" fill="#101114"/>
    <g clip-path="url(#ckHp)" id="hpfill">
      <rect class="bar" id="hfill" x="74" y="52" width="268" height="36" fill="url(#gHp)"/>
      <rect x="74" y="52" width="268" height="14" fill="url(#gGloss)"/>
    </g>
    <path d="M90 52H342L326 88H74Z" fill="none" stroke="#00a000" stroke-opacity=".55" stroke-width="1.2" stroke-linejoin="round"/>
  </g>
  <text class="t" id="hptxt" x="318" y="76.5" text-anchor="end">100%</text>

  <!-- ====== สามเหลี่ยมขึ้น: อาหาร ====== -->
  <g id="bHg">
    <path d="M388 40L421 90H355Z" fill="#000" stroke="#000" stroke-width="9" stroke-linejoin="round"/>
    <path d="M388 40L421 90H355Z" fill="url(#gCore)"/>
    <path d="M388 40L421 90H355Z" fill="none" stroke="#033d03" stroke-width="5" stroke-linejoin="round"/>
    <path class="ring" id="rHg" d="M388 90H355L388 40L421 90Z" fill="none" stroke="url(#gRing)" stroke-width="5" stroke-linejoin="round" pathLength="100"/>
    <g fill="#e6e9ef" transform="translate(388 66) scale(.4)">
      <ellipse cx="5" cy="-6" rx="14" ry="11" transform="rotate(-40 5 -6)"/>
      <path d="M-2 2L-13 13" stroke="#e6e9ef" stroke-width="6" stroke-linecap="round" fill="none"/>
      <circle cx="-16" cy="12" r="4.500"/><circle cx="-11" cy="17" r="4.500"/>
    </g>
    <text class="t gn" id="hgtxt" x="388" y="84" style="font-size:11px">100</text>
  </g>

  <!-- ====== สามเหลี่ยมลง: น้ำ ====== -->
  <g id="bWt">
    <path d="M426 42H492L459 92Z" fill="#000" stroke="#000" stroke-width="9" stroke-linejoin="round"/>
    <path d="M426 42H492L459 92Z" fill="url(#gCore)"/>
    <path d="M426 42H492L459 92Z" fill="none" stroke="#033d03" stroke-width="5" stroke-linejoin="round"/>
    <path class="ring" id="rWt" d="M459 42H492L459 92L426 42Z" fill="none" stroke="url(#gRing)" stroke-width="5" stroke-linejoin="round" pathLength="100"/>
    <text class="t gn" id="wttxt" x="459" y="62" style="font-size:11px">100</text>
    <path d="M27 16.500C23 22 19.500 25.500 19.500 30a7.500 7.500 0 0 0 15 0C34.500 25.500 31 22 27 16.500z" fill="#e6e9ef" transform="translate(459 75) scale(.55) translate(-27 -27)"/>
  </g>
  </g>
</svg>
</div>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  function clamp(v){v=Math.round(Number(v));return isNaN(v)?0:Math.max(0,Math.min(100,v))}
  var uidNow=0;
  var root=document.documentElement;
  var HPW=268, ARW=130;

  // ปรับความยาว/ความหนา "หลอดเลือด"
  function hpSize(){
    var cs=getComputedStyle(root);
    var w=parseFloat(cs.getPropertyValue('--hp-w')),h=parseFloat(cs.getPropertyValue('--hp-h'));
    if(isNaN(w)||w<=0)w=1;if(isNaN(h)||h<=0)h=1;
    $('hpBar').setAttribute('transform','translate(74 70) scale('+w+' '+h+') translate(-74 -70)');
  }
  // hpStyle(สีซ้าย, สีขวา, ความยาว, ความหนา)  เช่น hpStyle('#a00','#f33',1.1,1.2)
  function hpStyle(a,b,w,h){
    if(a)root.style.setProperty('--hp-a',a);
    if(b)root.style.setProperty('--hp-b',b);
    if(w!=null&&w!=='')root.style.setProperty('--hp-w',w);
    if(h!=null&&h!=='')root.style.setProperty('--hp-h',h);
    hpSize();
  }
  window.hpStyle=hpStyle;

  // เส้นขอบเริ่มจากกลางด้านตรงข้ามมุม แล้วแบ่งครึ่งซ้าย/ขวา => ลดพร้อมกันสองฝั่ง เริ่มลดจากมุมสามเหลี่ยม
  function ring(el,v){if(v>=99.5)el.removeAttribute('stroke-dasharray');else{var h=v/2;el.setAttribute('stroke-dasharray',h+' '+(100-v)+' '+h+' 0')}}

  // hud:update -> [hp, armor, hunger, thirst, show, uid]  (ค่าที่ 7 stamina ถูกละเลย ส่งมาก็ไม่เป็นไร)
  function apply(hp,ar,hg,wt,show,uid,stam){
    hp=clamp(hp);ar=clamp(ar);hg=clamp(hg);wt=clamp(wt);
    $('hfill').style.width=(HPW*hp/100)+'px';
    $('hptxt').textContent=hp+'%';
    $('arfill').style.width=(ARW*ar/100)+'px';
    ring($('rHg'),hg);ring($('rWt'),wt);
    $('hgtxt').textContent=hg;$('wttxt').textContent=wt;
    $('hud').classList.toggle('low',hp<=25);
    $('bHg').classList.toggle('lowi',hg<=20);
    $('bWt').classList.toggle('lowi',wt<=20);
    if(uid!==undefined&&uid!==null){var u=Math.round(Number(uid));uidNow=(isNaN(u)||u<0)?0:u}
    $('uidtop').textContent='ID : '+uidNow;
    if(show!==undefined)$('hud').classList.toggle('on',Number(show)===1);
  }
  function onUpdate(d){if(Array.isArray(d))apply.apply(null,d)}

  window.addEventListener('cef:hud:update',function(e){onUpdate(e.detail)});
  window.addEventListener('cef:hud:hpstyle',function(e){var d=e.detail||[];hpStyle(d[0],d[1],d[2],d[3])});

  function bind(){
    if(!window.cef||!cef.on)return false;
    cef.on('hud:update',function(){
      var a=[].slice.call(arguments),x=a[0];
      if(a.length==1){if(typeof x=='string'&&x[0]=='[')try{x=JSON.parse(x)}catch(_){}if(Array.isArray(x))a=x}
      onUpdate(a);
    });
    cef.on('hud:hpstyle',function(a,b,w,h){hpStyle(a,b,w,h)});
    return true;
  }
  if(!bind()){var iv=setInterval(function(){if(bind())clearInterval(iv)},100)}

  // วันที่/เวลา จากนาฬิกาเครื่อง
  function clock(){var d=new Date(),p=function(n){return(n<10?'0':'')+n};
    $('dtxt').textContent=p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+p(d.getFullYear()%100);
    $('ttxt').textContent=p(d.getHours())+':'+p(d.getMinutes())}
  clock();setInterval(clock,10000);

  hpSize();
  apply(100,0,100,100,undefined,0);

  // โหมดทดสอบ: เปิดไฟล์ด้วย ?demo
  if(/[?&]demo/.test(location.search)){
    document.body.style.background='#2a2f38';
    var t=0;apply(100,100,100,100,1,59,100);
    setInterval(function(){t++;apply(20+Math.round(80*Math.abs(Math.sin(t/6))),Math.round(100*Math.abs(Math.cos(t/9))),Math.max(0,100-t%100),70,1,59,Math.round(100*Math.abs(Math.sin(t/4))))},700);
  }
})();
</script>
</body>
</html>
