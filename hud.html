<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>HUD</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --s:.5;              /* ขนาดรวม (1 = ปกติ) */
  --left:14px;         /* ระยะจากขอบซ้าย */
  --bottom:14px;       /* ระยะจากขอบล่าง */
  /* สีโทนเดียวกับ UI รถ (speedo) */
  --hp-a:#1d6fd0;      /* สีหลอดเลือด ฝั่งซ้าย */
  --hp-b:#2aa8ff;      /* สีหลอดเลือด ฝั่งขวา */
  --hp-w:1;            /* ความยาวหลอด (1 = ปกติ) */
  --hp-h:1;            /* ความหนาหลอด (1 = ปกติ) */
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:transparent;overflow:hidden;pointer-events:none;user-select:none;
  font-family:Kanit,"Noto Sans Thai",Tahoma,sans-serif}
#hud{position:fixed;left:var(--left);bottom:var(--bottom);width:508px;height:100px;
  transform:scale(var(--s)) translateY(24px);transform-origin:left bottom;opacity:0;
  transition:opacity .3s,transform .4s cubic-bezier(.2,.9,.3,1.1)}
#hud.on{opacity:1;transform:scale(var(--s))}
#hud svg{width:100%;height:100%;overflow:visible;display:block}
.t{fill:#e6e9ef;font-family:Kanit,"Noto Sans Thai",sans-serif}
#hptxt{font-size:15px;font-weight:700}
#uidtop{font-size:12px;font-weight:600;letter-spacing:.3px}
#armtxt{font-size:10.5px;font-weight:700;letter-spacing:.6px;fill:#0e0e11}
.gn{font-size:9px;font-weight:600;text-anchor:middle}
.bar{transition:width .35s ease}
.ring{transition:stroke-dasharray .4s ease}
.low #hfill,.low #hptxt{animation:blink .6s infinite alternate}
.lowi{animation:blink .6s infinite alternate}
@keyframes blink{from{opacity:1}to{opacity:.3}}
</style>
</head>
<body>
<div id="hud">
<svg viewBox="0 0 508 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gHp" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--hp-a)"/><stop offset="1" style="stop-color:var(--hp-b)"/></linearGradient>
    <linearGradient id="gAr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c4c8d0"/><stop offset="1" stop-color="#f2f5fa"/></linearGradient>
    <linearGradient id="gRing" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d6fd0"/><stop offset="1" stop-color="#3fc3e0"/></linearGradient>
    <radialGradient id="gCore" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#12284a"/><stop offset="1" stop-color="#0e0e11"/></radialGradient>
    <linearGradient id="gGloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".5" stop-color="#fff" stop-opacity=".04"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="ckHp"><rect x="85" y="49" width="312" height="22" rx="4"/></clipPath>
    <clipPath id="ckAr"><rect x="141" y="31" width="256" height="15" rx="3"/></clipPath>
    <g id="icChicken">
      <ellipse cx="5" cy="-6" rx="14" ry="11" transform="rotate(-40 5 -6)"/>
      <path d="M-2 2L-13 13" stroke="#e6e9ef" stroke-width="6" stroke-linecap="round" fill="none"/>
      <circle cx="-16" cy="12" r="4.5"/><circle cx="-11" cy="17" r="4.5"/>
    </g>
    <path id="icDrop" d="M27 16.5C23 22 19.5 25.5 19.5 30a7.5 7.5 0 0 0 15 0C34.5 25.5 31 22 27 16.5z"/>
  </defs>

  <g transform="translate(6 0)">
  <!-- ====== แผงหลัก ====== -->
  <rect x="80" y="26" width="322" height="50" rx="8" fill="#000"/>
  <rect x="81.5" y="27.5" width="319" height="47" rx="7" fill="#0e0e11" stroke="#1d6fd0" stroke-opacity=".5" stroke-width="1.2"/>

  <!-- เกราะ (ขาว) -->
  <rect x="85" y="31" width="52" height="15" rx="3" fill="#e6e9ef"/>
  <text class="t" id="armtxt" x="111" y="42.3" text-anchor="middle">ARMOR</text>
  <rect x="141" y="31" width="256" height="15" rx="3" fill="#1b1b1f"/>
  <g clip-path="url(#ckAr)"><rect class="bar" id="arfill" x="141" y="31" width="0" height="15" fill="url(#gAr)"/></g>

  <!-- เลือด (น้ำเงิน) -->
  <g id="hpBar">
    <rect x="85" y="49" width="312" height="22" rx="4" fill="#151518" stroke="#2a2a30" stroke-width="1.5"/>
    <g clip-path="url(#ckHp)" id="hpfill">
      <rect class="bar" id="hfill" x="85" y="49" width="312" height="22" fill="url(#gHp)"/>
      <rect x="85" y="49" width="312" height="11" fill="url(#gGloss)"/>
    </g>
  </g>
  <path d="M85 49H150V53L143.5 61H85Z" fill="#0e0e11"/>
  <text class="t" id="uidtop" x="92" y="58.8">ID : 0</text>
  <text class="t" id="hptxt" x="391" y="65.8" text-anchor="end">100%</text>

  </g>

  <!-- ====== วงกลมเล็ก: หิว / น้ำ ====== -->
  <g id="bHg" transform="translate(436 54)">
    <circle r="19" fill="#000"/>
    <circle r="17" fill="#0e0e11"/>
    <circle r="13" fill="none" stroke="#15304f" stroke-width="5"/>
    <circle class="ring" id="rHg" r="13" fill="none" stroke="url(#gRing)" stroke-width="5" pathLength="100" stroke-dasharray="100 0" transform="rotate(-90)"/>
    <g fill="#e6e9ef"><use href="#icChicken" transform="translate(1.5 -1) scale(.4)"/></g>
    <rect x="-13" y="12" width="26" height="11" rx="5.5" fill="#000"/>
    <text class="t gn" id="hgtxt" x="0" y="20.6">100</text>
  </g>
  <g id="bWt" transform="translate(476 54)">
    <circle r="19" fill="#000"/>
    <circle r="17" fill="#0e0e11"/>
    <circle r="13" fill="none" stroke="#15304f" stroke-width="5"/>
    <circle class="ring" id="rWt" r="13" fill="none" stroke="url(#gRing)" stroke-width="5" pathLength="100" stroke-dasharray="100 0" transform="rotate(-90)"/>
    <g fill="#e6e9ef"><use href="#icDrop" transform="translate(0 0) scale(.62) translate(-27 -27)"/></g>
    <rect x="-13" y="12" width="26" height="11" rx="5.5" fill="#000"/>
    <text class="t gn" id="wttxt" x="0" y="20.6">100</text>
  </g>
  </g>
  <!-- ====== วงกลมซ้าย (ไอคอน) ====== -->
  <g id="emb" transform="translate(46 50)">
    <circle r="46" fill="#000"/>
    <circle r="43" fill="#0e0e11"/>
    <circle r="37" fill="none" stroke="#15304f" stroke-width="7"/>
    <circle class="ring" id="rSt" r="37" fill="none" stroke="url(#gRing)" stroke-width="7" pathLength="100" stroke-dasharray="100 0" transform="rotate(-90)"/>
    <g stroke="#0e0e11" stroke-width="4">
      <line x1="-23" y1="-23" x2="-30" y2="-30"/><line x1="23" y1="-23" x2="30" y2="-30"/>
      <line x1="-23" y1="23" x2="-30" y2="30"/><line x1="23" y1="23" x2="30" y2="30"/>
    </g>
    <circle r="30" fill="url(#gCore)" stroke="#1d6fd0" stroke-opacity=".45" stroke-width="1.2"/>
    <path d="M5 -19L-11 3H-2L-6 19L11 -5H1Z" fill="#e6e9ef"/>
  </g>

  <g transform="translate(16 0)">
</svg>
</div>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  function clamp(v){v=Math.round(Number(v));return isNaN(v)?0:Math.max(0,Math.min(100,v))}
  var uidNow=0;
  var root=document.documentElement;
  var HPW=312, ARW=256;

  // ปรับความยาว/ความหนา "หลอดเลือด"
  function hpSize(){
    var cs=getComputedStyle(root);
    var w=parseFloat(cs.getPropertyValue('--hp-w')),h=parseFloat(cs.getPropertyValue('--hp-h'));
    if(isNaN(w)||w<=0)w=1;if(isNaN(h)||h<=0)h=1;
    $('hpBar').setAttribute('transform','translate(85 49) scale('+w+' '+h+') translate(-85 -49)');
  }
  // hpStyle(สีซ้าย, สีขวา, ความยาว, ความหนา)  เช่น hpStyle('#a00','#f33',1.1,1.2)
  function hpStyle(a,b,w,h){
    if(a)root.style.setProperty('--hp-a',a);
    if(b)root.style.setProperty('--hp-b',b);
    if(w!=null&&w!=='')root.style.setProperty('--hp-w',w);
    if(h!=null&&h!=='')root.style.setProperty('--hp-h',h);
    hpSize();
  }
  window.hpStyle=hpStyle;

  function ring(el,v){el.setAttribute('stroke-dasharray',v+' '+(100-v))}

  // hud:update -> [hp, armor, hunger, thirst, show, uid, stamina]  (stamina = พลังงานการวิ่ง ไม่ส่งมา = 100)
  function apply(hp,ar,hg,wt,show,uid,stam){
    hp=clamp(hp);ar=clamp(ar);hg=clamp(hg);wt=clamp(wt);
    $('hfill').style.width=(HPW*hp/100)+'px';
    $('hptxt').textContent=hp+'%';
    $('arfill').style.width=(ARW*ar/100)+'px';
    var st=Number(stam);st=(stam===undefined||stam===null||isNaN(st))?100:clamp(st);
    ring($('rSt'),st);$('emb').classList.toggle('lowi',st<=20);
    ring($('rHg'),hg);ring($('rWt'),wt);
    $('hgtxt').textContent=hg;$('wttxt').textContent=wt;
    $('hud').classList.toggle('low',hp<=25);
    $('bHg').classList.toggle('lowi',hg<=20);
    $('bWt').classList.toggle('lowi',wt<=20);
    if(uid!==undefined&&uid!==null){var u=Math.round(Number(uid));uidNow=(isNaN(u)||u<0)?0:u}
    $('uidtop').textContent='ID : '+uidNow;
    if(show!==undefined)$('hud').classList.toggle('on',Number(show)===1);
  }
  function onUpdate(d){if(Array.isArray(d))apply.apply(null,d)}

  window.addEventListener('cef:hud:update',function(e){onUpdate(e.detail)});
  window.addEventListener('cef:hud:hpstyle',function(e){var d=e.detail||[];hpStyle(d[0],d[1],d[2],d[3])});

  function bind(){
    if(!window.cef||!cef.on)return false;
    cef.on('hud:update',function(){
      var a=[].slice.call(arguments),x=a[0];
      if(a.length==1){if(typeof x=='string'&&x[0]=='[')try{x=JSON.parse(x)}catch(_){}if(Array.isArray(x))a=x}
      onUpdate(a);
    });
    cef.on('hud:hpstyle',function(a,b,w,h){hpStyle(a,b,w,h)});
    return true;
  }
  if(!bind()){var iv=setInterval(function(){if(bind())clearInterval(iv)},100)}

  hpSize();
  apply(100,0,100,100,undefined,0);

  // โหมดทดสอบ: เปิดไฟล์ด้วย ?demo
  if(/[?&]demo/.test(location.search)){
    document.body.style.background='#2a2f38';
    var t=0;apply(100,100,100,100,1,59,100);
    setInterval(function(){t++;apply(20+Math.round(80*Math.abs(Math.sin(t/6))),Math.round(100*Math.abs(Math.cos(t/9))),Math.max(0,100-t%100),70,1,59,Math.round(100*Math.abs(Math.sin(t/4))))},700);
  }
})();
</script>
</body>
</html>
